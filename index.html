   curr:{it:`PROGRAMMA UFFICIALE MODULO B — UNITÀ SPECIFICA
Settore: GENERICO (con applicazione prevalente in logistica, sanità, grande distribuzione)
Argomento: Movimentazione Manuale dei Carichi (MMC)
(Titolo VI D.Lgs. 81/08 — Art. 167-171 — Allegato XXXIII)

━━━ CONTENUTI FORMATIVI ━━━

1. DEFINIZIONE DI MMC (Art. 167)
Operazioni di trasporto o di sostegno di un carico ad opera di uno o più lavoratori, comprese le azioni di:
• Sollevamento
• Deposizione
• Spinta
• Traino
• Portamento
• Spostamento
di un carico che, per le sue caratteristiche o in conseguenza delle condizioni ergonomiche sfavorevoli, comporta rischi di patologie da sovraccarico biomeccanico.

2. PATOLOGIE DA MMC
• Rachialgia (lombalgia, cervicalgia, dorsalgia)
• Ernie del disco (lombare L4-L5, L5-S1)
• Discopatie
• Patologie muscoloscheletriche degli arti superiori (sindrome del tunnel carpale, tendiniti)
⚠️ Sono tra le patologie professionali più diffuse in Italia e in Europa.

3. FATTORI DI RISCHIO DA VALUTARE (Art. 168 — Allegato XXXIII)
CARATTERISTICHE DEL CARICO:
• Troppo pesante (>25 kg per uomini, >20 kg per donne in condizioni ideali)
• Troppo ingombrante (difficoltà di presa, visibilità ridotta)
• In equilibrio precario o con contenuto che può spostarsi
• Collocato in una posizione che richiede movimenti di torsione del tronco
• Spigoloso, tagliente o con superficie irregolare
• Fragile o con contenuto potenzialmente pericoloso

SFORZO FISICO RICHIESTO:
• Eccessivo o effettuato solo con la torsione del tronco
• Eseguito con il corpo in posizione instabile
• Richiede una spinta o trazione del carico, con rischio di un suo spostamento improvviso
• Effettuato con il corpo in posizione flessa o con movimenti ripetitivi

CARATTERISTICHE DELL'AMBIENTE DI LAVORO:
• Spazio insufficiente (verticale, orizzontale)
• Pavimento irregolare, scivoloso, instabile
• Posto o ambiente di lavoro che non consente al lavoratore di movimentare il carico ad altezza sicura
• Pavimento o piano di lavoro con dislivelli
• Temperatura, umidità o ventilazione inadeguate

ESIGENZE DELL'ATTIVITÀ:
• Sforzi fisici eccessivi, troppo frequenti o troppo prolungati
• Periodo di riposo fisiologico o di recupero insufficiente
• Distanze di trasporto troppo grandi
• Ritmo imposto dal processo, non modulabile

4. IL METODO NIOSH (Allegato XXXIII)
Peso Limite Raccomandato (PLR) in condizioni IDEALI:
┌─────────────────────────────┬──────────────┐
│ Categoria                   │ Peso limite  │
├─────────────────────────────┼──────────────┤
│ Uomini adulti               │ 25 kg        │
│ Donne adulte                │ 20 kg        │
│ Lavoratori < 18 anni        │ 15 kg        │
└─────────────────────────────┴──────────────┘

COEFFICIENTI MOLTIPLICATIVI NIOSH (tutti ≤ 1, riducono il PLR):
• CM — Fattore altezza di presa: distanza verticale delle mani dal suolo all'inizio del sollevamento
• CV — Fattore dislocazione verticale: distanza percorsa verticalmente dal carico
• CO — Fattore dislocazione orizzontale: distanza orizzontale tra le mani e il punto di mezzo dei piedi
• CA — Fattore asimmetria: angolo di torsione del tronco durante il sollevamento
• CF — Fattore frequenza: numero di sollevamenti per minuto
• CP — Fattore presa: qualità della presa (buona, discreta, scarsa)

Indice di Sollevamento (IS) = Peso effettivo carico / PLR
• IS < 0,75: rischio trascurabile
• 0,75 ≤ IS < 1,25: rischio accettabile con sorveglianza
• IS ≥ 1,25: rischio elevato — necessario intervento immediato

5. METODO OCRA (per movimenti ripetitivi degli arti superiori)
• Usato quando i rischi riguardano le mani, i polsi, i gomiti, le spalle
• Considera: forza, postura, frequenza, recupero, fattori complementari
• Indice OCRA < 1,5: rischio trascurabile
• 1,5 ≤ OCRA < 2,2: rischio bordeline
• OCRA ≥ 2,2: rischio presente — intervento richiesto

6. OBBLIGHI DEL DATORE DI LAVORO (Art. 168)
• Valutare il rischio MMC e documentarlo nel DVR
• Adottare le misure organizzative necessarie per ridurre il rischio:
  - Fornire ausili meccanici (transpallet, carrelli, gru a bandiera, sollevatori)
  - Organizzare la rotazione del personale tra attività a diverso carico
  - Prevedere pause adeguate
  - Riorganizzare il posto di lavoro (altezze, distanze, ecc.)
• Garantire la sorveglianza sanitaria per i lavoratori esposti
• Formare e informare i lavoratori sui rischi MMC e sulle tecniche corrette

7. TECNICHE CORRETTE DI SOLLEVAMENTO
• Avvicinarsi al carico il più possibile
• Piedi divaricati (larghezza spalle), con il carico tra le gambe
• Schiena dritta, lordosi lombare mantenuta
• Flettere le ginocchia (non la schiena)
• Afferrare saldamente il carico con entrambe le mani
• Tenere il carico vicino al corpo
• Alzarsi con la forza delle gambe (non della schiena)
• Evitare rotazioni del tronco durante il sollevamento

━━━ NOTE PER SETTORI SPECIFICI ━━━
🏭 LOGISTICA/MAGAZZINO (massima esposizione):
• Sollevamento colli/bancali nella preparazione ordini (picking)
• Scarico/carico manuale da camion
• Uso di transpallet manuali ed elettrici
• Stoccaggio in scaffalature (rischio posture estreme)
• Obbligatoria la valutazione NIOSH nel DVR

🏥 SANITÀ: movimentazione paziente (MMC specifica — metodo MAPO)
🏢 GRANDE DISTRIBUZIONE: rischio elevato in reparti ricevimento merci
🏗️ CANTIERI: materiali edili pesanti (sacchi cemento, mattoni, lastre)
🏭 INDUSTRIA MANIFATTURIERA: movimentazione di stampi, pezzi, componenti

━━━ RIFERIMENTI NORMATIVI ━━━

• Linee guida INAIL per la valutazione del rischio MMC`, en:`OFFICIAL CURRICULUM MODULE B — SPECIFIC UNIT
Sector: GENERIC (all sectors)
Topic: Work Equipment and Machinery
(State-Regions Agreement 26/01/2006 — Duration varies by ATECO sector)

━━━ TRAINING CONTENT ━━━

1. DEFINITION OF WORK EQUIPMENT (Art. 69)
• Any machine, apparatus, tool or plant used during work
• Also includes: vehicles, lifts, electrical installations
• Subject to Title III, Chapter I of D.Lgs. 81/08

2. MACHINERY DIRECTIVE (Dir. 2006/42/EC — D.Lgs. 17/2010)
ESSENTIAL REQUIREMENTS:
• CE marking mandatory for all machinery placed on the market after 1995
• Instruction manual in the language of the country of use
• Declaration of Conformity (DoC) to be kept by the employer
• Specific safety devices as designed by the manufacturer

RISK ASSESSMENT BY THE MANUFACTURER:
• The manufacturer must carry out a risk assessment for each machine
• Implement safety measures in order of priority: design → guards → information

3. EMPLOYER OBLIGATIONS FOR WORK EQUIPMENT (Art. 71)
• Provide workers with equipment suitable for the specific work
• Equipment must be properly installed and maintained
• Equipment must be used only for the operations for which it was designed
• Keep documentation (instructions, maintenance log)
• Carry out periodic checks as required by regulations

4. MAINTENANCE AND CHECKS (Art. 71 c.8-9)
Periodic statutory checks for certain equipment:
• Lifting equipment (cranes, lifts): INAIL check every 1-2 years depending on category
• Pressure equipment (compressors, autoclaves): periodic checks by authorised body
• Overhead cranes: visual inspection every 12 months + full check every 10 years

5. FORKLIFTS (SPECIFIC LOGISTICS SECTOR CONTENT)
• Training obligation: D.Lgs. 81/08 + State-Regions Agreement 12/03/2012
  - Module 1 (general): legislative references, types of forklift — 4h
  - Module 2 (specific technical): load, stability, handling — 4h
  - Module 3 (practical): manoeuvres, loads, safety checks — 4h
  - TOTAL: 12h initial training + practical test
  - Mandatory update: 4h every 5 years
• Forklifts require periodic maintenance and pre-use check (daily)
• Maximum loads as indicated on the forklift's load chart
• Maximum tilt and speed in the workplace as defined by the employer

6. WORK AT HEIGHT EQUIPMENT (Title IV, Art. 111-116)
• Ladders: maximum height 5m without stabilising devices, never left unattended
• Mobile scaffolding (towers): check before each use, anchor to structures at intervals
• Cherry pickers (MEWPs): authorised operator, ground stability check, wind limit
• Fixed scaffolding: inspection every 3 months or after adverse weather events
• Safety lines and harnesses: Category III PPE, periodic check

7. ELECTRICAL EQUIPMENT (Title III, Chapter III — Art. 80-87)
• Employer must ensure electrical safety of all equipment
• Periodic earthing checks as specified
• No modifications to original electrical systems without authorisation
• Protection against electrical hazard: insulation, guards, reduced voltage

━━━ SECTOR-SPECIFIC CONNECTIONS ━━━
🏭 Logistics/Warehouse: forklifts are the MAIN piece of equipment. Specific training 12h mandatory. Daily pre-use inspection. Load chart. Separation of vehicle/pedestrian routes.
🏗️ Construction: scaffolding, work at height equipment, heavy machinery (excavators, cranes).
🏥 Healthcare: hospital beds, lifting equipment, specialised medical devices.
🏢 Offices: workstation (VDT), office equipment, ergonomics.

━━━ LEGAL REFERENCES ━━━
• D.Lgs. 81/2008, Title III, Art. 69-87, Annex VII
• D.Lgs. 17/2010 (Machinery Directive)
• State-Regions Agreement 12/03/2012 (forklift training)
• Circular INAIL on periodic equipment checks`},

   sum:{
     it:`RUMORE (Art. 188-200) — misurato in dB(A) come LEX,8h (esposizione quotidiana personale):

Tre soglie fondamentali:
• Valore inferiore di azione: LEX = 80 dB(A) → informazione e formazione; DPI (otoprotettori) disponibili su richiesta ma NON obbligatori
• Valore superiore di azione: LEX = 85 dB(A) → sorveglianza sanitaria obbligatoria; uso DPI obbligatorio; segnalazione e delimitazione zone rumorose; misure tecniche/organizzative
• Valore limite di esposizione: LEX = 87 dB(A) → non superabile mai, anche tenuto conto dell'attenuazione dei DPI

La valutazione del rischio rumore va aggiornata ogni 4 anni (ogni 2 anni se cambiano le condizioni).

VIBRAZIONI (Art. 201-210):
HAV — mano-braccio (utensili vibranti, ecc.):
• Valore d'azione: 2,5 m/s²  |  Valore limite: 5,0 m/s²

WBV — corpo intero (conducenti carrelli elevatori, veicoli industriali):
• Valore d'azione: 0,5 m/s²  |  Valore limite: 1,15 m/s²

Rilevanza in logistica: rumore da carrelli elevatori e nastri trasportatori; WBV per carrellisti su pavimentazioni irregolari.`,
     en:`NOISE (Art. 188-200) — measured in dB(A) as LEX,8h (personal daily exposure):

Three key thresholds:
• Lower action value: LEX = 80 dB(A) → information and training; PPE (hearing protectors) available on request but NOT mandatory
• Upper action value: LEX = 85 dB(A) → mandatory health surveillance; mandatory PPE use; noisy zone marking and delimitation; technical/organizational measures
• Exposure limit value: LEX = 87 dB(A) → must never be exceeded, accounting for PPE attenuation

Noise risk assessment updated every 4 years (every 2 years if conditions change).

VIBRATIONS (Art. 201-210):
HAV — hand-arm (vibrating tools, etc.):
• Action value: 2.5 m/s²  |  Limit value: 5.0 m/s²

WBV — whole-body (forklift operators, industrial vehicles):
• Action value: 0.5 m/s²  |  Limit value: 1.15 m/s²

Logistics relevance: noise from forklifts and conveyors; WBV for operators on uneven flooring.`

   curr:{it:`PROGRAMMA UFFICIALE MODULO B — UNITÀ SPECIFICA
Settore: GENERICO (con note per settori ad alta esposizione)
Argomento: Rischi Fisici — Rumore e Vibrazioni
(Titolo VIII D.Lgs. 81/08 — Art. 188-210)

━━━ CONTENUTI FORMATIVI ━━━

1. IL RISCHIO RUMORE — GRANDEZZE E UNITÀ DI MISURA (Art. 188)
• LEX,8h — Livello di esposizione personale al rumore (media sull'intera giornata lavorativa)
• Ppeak — Valore di picco della pressione acustica (per rumori impulsivi)
• Unità di misura: dB(A) per LEX,8h; dB(C) per il valore di picco

2. VALORI DI RIFERIMENTO PER IL RUMORE (Art. 189)
┌──────────────────────────────────────────────┬─────────────┬─────────────┐
│ Soglia                                       │ LEX,8h      │ Ppeak       │
├──────────────────────────────────────────────┼─────────────┼─────────────┤
│ Valore inferiore d'azione                    │ 80 dB(A)    │ 135 dB(C)   │
│ Valore superiore d'azione                    │ 85 dB(A)    │ 137 dB(C)   │
│ Valore limite di esposizione (non superabile)│ 87 dB(A)    │ 140 dB(C)   │
└──────────────────────────────────────────────┴─────────────┴─────────────┘
⚠️ Il valore limite di 87 dB(A) considera l'attenuazione dei DPI utilizzati.

3. OBBLIGHI IN BASE AI LIVELLI DI ESPOSIZIONE AL RUMORE
AL SUPERAMENTO DI 80 dB(A) — Valore inferiore d'azione (Art. 192):
• Informazione e formazione sui rischi da esposizione al rumore
• Messa a disposizione dei DPI (otoprotettori) su richiesta del lavoratore
• Sorveglianza sanitaria su richiesta del lavoratore (facoltativa)

AL SUPERAMENTO DI 85 dB(A) — Valore superiore d'azione (Art. 192-193):
• Misure tecniche e organizzative per ridurre l'esposizione
• Delimitazione e segnalazione delle zone rumorose
• Uso OBBLIGATORIO dei DPI (otoprotettori)
• Sorveglianza sanitaria OBBLIGATORIA

AL RAGGIUNGIMENTO DI 87 dB(A) — Valore limite (Art. 192):
• Limite INVALICABILE (anche considerando l'attenuazione dei DPI)
• Intervento immediato: individuare le cause, adottare misure di riduzione, riportare sotto il limite

4. AGGIORNAMENTO DELLA VALUTAZIONE DEL RISCHIO RUMORE (Art. 190)
• Ogni 4 anni (se non cambiano le condizioni)
• Ogni 2 anni se cambiano significativamente le condizioni di lavoro

5. LE VIBRAZIONI — TIPOLOGIE E GRANDEZZE (Art. 201)
VIBRAZIONI MANO-BRACCIO (HAV — Hand-Arm Vibrations):
• Prodotte da utensili vibranti manuali (smerigliatrici, martelli pneumatici, motoseghe)
• Parametro: accelerazione RMS ponderata A(8) in m/s²
• Rischi: sindrome di Raynaud (dito bianco), neuropatia del tunnel carpale, tendiniti

VIBRAZIONI AL CORPO INTERO (WBV — Whole Body Vibrations):
• Trasmesse dal sedile o dalla piattaforma su cui sta il lavoratore (veicoli, carrelli, macchine)
• Parametro: accelerazione ponderata A(8) in m/s²
• Rischi: lombalgie, ernie del disco, danni al rachide

6. VALORI DI RIFERIMENTO PER LE VIBRAZIONI (Art. 201)
VIBRAZIONI MANO-BRACCIO (HAV):
┌──────────────────────────────────┬──────────────────┐
│ Soglia                           │ A(8)             │
├──────────────────────────────────┼──────────────────┤
│ Valore d'azione giornaliero      │ 2,5 m/s²         │
│ Valore limite giornaliero        │ 5,0 m/s²         │
└──────────────────────────────────┴──────────────────┘

VIBRAZIONI CORPO INTERO (WBV):
┌──────────────────────────────────┬──────────────────┐
│ Soglia                           │ A(8)             │
├──────────────────────────────────┼──────────────────┤
│ Valore d'azione giornaliero      │ 0,5 m/s²         │
│ Valore limite giornaliero        │ 1,15 m/s²        │
└──────────────────────────────────┴──────────────────┘

7. OBBLIGHI DEL DATORE DI LAVORO PER LE VIBRAZIONI (Art. 202-204)
AL SUPERAMENTO DEL VALORE D'AZIONE:
• Elaborare e attuare un programma di misure tecniche e organizzative
• Adottare DPI (guanti antivibranti per HAV; sedili ammortizzati per WBV)
• Sorveglianza sanitaria obbligatoria
• Formazione e informazione specifica

AL RAGGIUNGIMENTO DEL VALORE LIMITE:
• Intervento immediato per riportare l'esposizione al di sotto del limite
• Individuazione delle cause
• Revisione della valutazione del rischio

8. MISURE DI PREVENZIONE E RIDUZIONE DEL RISCHIO
Per il RUMORE:
• Sostituire le attrezzature rumorose con modelli più silenziosi
• Insonorizzare le macchine (cabine, pannelli fonoassorbenti)
• Organizzare rotazione del personale ed esposizione frazionata
• Manutenzione regolare delle attrezzature
• DPI: otoprotettori (cuffie, inserti — SNR adeguato al livello di rumore)

Per le VIBRAZIONI HAV:
• Sostituire utensili con versioni antivibranti
• Limitare il tempo di utilizzo giornaliero
• Manutenzione delle attrezzature (usura riduce smorzamento)
• DPI: guanti antivibranti (riduzione limitata: massimo 30%)
• Pause di recupero durante il turno

Per le VIBRAZIONI WBV:
• Sedili con sospensione ammortizzata per operatori di veicoli e carrelli
• Manutenzione delle pavimentazioni (irregolarità amplificano le vibrazioni)
• Limitare la velocità di transito dei veicoli
• Rotazione degli operatori tra mansioni con e senza esposizione a WBV

━━━ NOTE PER SETTORI SPECIFICI ━━━
🏭 LOGISTICA/MAGAZZINO:
• Rumore: carrelli elevatori (diesel/GPL), nastri trasportatori, aree di ricevimento merci
• WBV: carrellisti su pavimentazioni deteriorate o in uscita/entrata da camion
• HAV: utilizzo occasionale di avvitatori o utensili pneumatici

🏗️ CANTIERI: HAV molto elevato (martelli, compattatori, smerigliatrici); WBV per operatori di macchine movimento terra.
🏭 INDUSTRIA MANIFATTURIERA: HAV da smerigliatrici, presse; WBV da carrelli/muletti.
🌲 SELVICOLTURA: HAV da motoseghe (rischio molto alto, sindrome di Raynaud).
🚛 TRASPORTI: WBV per conducenti di camion e bus su lunghi percorsi.

━━━ RIFERIMENTI NORMATIVI ━━━
• D.Lgs. 81/2008, Art. 188-200 (rumore) e Art. 201-210 (vibrazioni)
• Norma UNI EN ISO 9612 (misura del rumore negli ambienti di lavoro)
• Norma UNI EN ISO 5349 (vibrazioni mano-braccio)
• Norma UNI EN ISO 2631 (vibrazioni corpo intero)`, en:`OFFICIAL CURRICULUM MODULE B — SPECIFIC UNIT
Sector: GENERIC (all sectors — with sector-specific notes)
Topic: Manual Handling of Loads (MMC)
(State-Regions Agreement 26/01/2006 — Title VI D.Lgs. 81/08)

━━━ TRAINING CONTENT ━━━

1. DEFINITION OF MMC (Art. 167)
Manual Handling of Loads means any operation of:
• Lifting, lowering, pushing, pulling, carrying or moving
• Performed by one or more workers
• Any load weighing MORE THAN 3 kg
• That may create a risk of injury, especially to the lumbar region

2. RISK FACTORS (Art. 168, Annex XXXIII)
LOAD CHARACTERISTICS (intrinsic risk factors):
• Too heavy (reference values: 25 kg for men, 20 kg for women)
• Difficult to grip (no handles, asymmetrical shape, unstable)
• Too large (visibility reduced)
• Requiring twisting or bending to handle

WORK ENVIRONMENT:
• Insufficient space for free movement
• Uneven, slippery or unstable floor
• Presence of steps and differences in level
• Poor lighting conditions
• Hot, cold or humid environment affecting grip/strength

INDIVIDUAL FACTORS:
• Age (workers <18 and >45 years are more susceptible)
• Pregnancy
• Pre-existing musculoskeletal disorders
• Insufficient training

WORK ORGANISATION:
• Repetitiveness (frequency of handling)
• Rest breaks not adequate to recovery
• Individualwork pace imposed by the production system

3. NIOSH EQUATION (REFERENCE METHOD)
Recommended weight limit: RWL = 23 × HM × VM × DM × AM × FM × CM
Where:
• HM = Horizontal Multiplier (distance from load to body)
• VM = Vertical Multiplier (height of load from ground)
• DM = Distance Multiplier (vertical travel distance)
• AM = Asymmetry Multiplier (angle of body rotation)
• FM = Frequency Multiplier (handling frequency)
• CM = Coupling Multiplier (quality of grip)
Lifting Index: LI = Actual weight / RWL — if LI > 1, risk is present

4. PREVENTION MEASURES (Art. 168)
Priority order:
1. Automation or mechanisation of handling (conveyors, pallet trucks, forklifts)
2. Ergonomic design of the work environment (adjustable working height)
3. Limitation of load weight (splitting heavy loads)
4. Training and instruction of workers on correct techniques
5. Health surveillance by the MC (periodic examinations)

5. CORRECT MANUAL HANDLING TECHNIQUE
• Always keep the load close to the body
• Bend the knees, not the back
• Maintain the natural lumbar curve during lifting
• Do not twist the spine while lifting — turn the whole body
• Handle at belt height where possible
• Two-person handling for loads >25 kg or awkward to hold

6. UPPER LIMB DISORDERS — WORK-RELATED MUSCULOSKELETAL DISORDERS (WMSDs)
Assessment methods for upper limb repetitive movements:
• OCRA (Occupational Repetitive Actions) — most reliable method
• RULA (Rapid Upper Limb Assessment) — for static and semi-static postures
• REBA (Rapid Entire Body Assessment) — for the whole body

7. HEALTH SURVEILLANCE OBLIGATION
Mandatory when the DVR identifies MMC as a significant risk:
• The MC assesses workers before assignment to tasks with MMC
• Periodic examinations at frequency defined by the MC
• Fitness judgment with any necessary prescriptions

━━━ SECTOR-SPECIFIC CONNECTIONS ━━━
🏭 Logistics/Warehouse: MMC is the PRIMARY risk. NIOSH mandatory assessment. Mandatory provision of pallet trucks and mechanical aids. Workers with back problems: fitness-for-duty assessment by MC.
🏗️ Construction: manual handling of building materials, concrete blocks, formwork.
🏥 Healthcare: patient handling — specific MAPO (Moving and Assisting Patients Operations) assessment protocol required.
🏢 Offices: typically low risk for MMC but present for archive management.

━━━ LEGAL REFERENCES ━━━
• D.Lgs. 81/2008, Title VI, Art. 167-171, Annex XXXIII
• Dir. 90/269/CEE (manual handling)
• NIOSH Equation (1994)
• INAIL Guidelines on WMSDs`},

   sum:{
     it:`Definizione (Art. 69): qualsiasi macchina, apparecchio, utensile o impianto destinato ad essere usato durante il lavoro.

Requisiti di sicurezza (Art. 70): le attrezzature devono essere conformi alle direttive CE applicabili (es. Direttiva Macchine 2006/42/CE) e recare la marcatura CE. Devono essere adeguate al lavoro da svolgere.

Obblighi del DL (Art. 71):
• Mettere a disposizione attrezzature idonee al lavoro
• Garantire manutenzione in buono stato di funzionamento
• Conservare la documentazione delle manutenzioni e verifiche
• Assicurare formazione e addestramento specifico per attrezzature pericolose

CARRELLI ELEVATORI — Accordo Stato-Regioni 22/02/2012:
• Abilitazione obbligatoria per tutti gli operatori di carrelli semoventi con conducente a bordo
• Formazione: Modulo giuridico-normativo (4h) + Modulo tecnico (4h) + Modulo pratico (4h) = 12h totali
• Aggiornamento quinquennale: 4 ore ogni 5 anni
• Il controllo pre-utilizzo (livelli, freni, cinture, forche, segnalatori) è responsabilità dell'operatore

Manutenzione (Art. 71 c.4): le attrezzature soggette a rischi di deterioramento devono essere sottoposte a verifiche periodiche documentate.`,
     en:`Definition (Art. 69): any machine, apparatus, tool or installation intended to be used during work.

Safety requirements (Art. 70): equipment must comply with applicable EU directives (e.g. Machinery Directive 2006/42/EC) and bear CE marking. Must be suitable for the task.

Employer obligations (Art. 71):
• Provide equipment suitable for the task
• Ensure maintenance in good working order
• Keep maintenance and verification documentation
• Ensure specific training and instruction for dangerous equipment

FORKLIFTS — State-Regions Agreement 22/02/2012:
• Mandatory qualification for all operators of self-propelled equipment with onboard driver
• Training: Legal-regulatory module (4h) + Technical module (4h) + Practical module (4h) = 12h total
• 5-year update: 4 hours every 5 years
• Pre-use check (levels, brakes, belts, forks, signals) is operator's responsibility

Maintenance (Art. 71 c.4): equipment subject to deterioration risks must undergo documented periodic checks.`

   curr:{it:`PROGRAMMA UFFICIALE MODULO B — UNITÀ SPECIFICA
Settore: GENERICO (con forte applicazione in logistica, manifattura, edilizia)
Argomento: Attrezzature di Lavoro
(Titolo III D.Lgs. 81/08 — Art. 69-73 — Accordo S-R 22/02/2012)

━━━ CONTENUTI FORMATIVI ━━━

1. DEFINIZIONE DI ATTREZZATURA DI LAVORO (Art. 69)
• Qualsiasi macchina, apparecchio, utensile o impianto destinato ad essere usato durante il lavoro
• Comprende: veicoli industriali, carrelli elevatori, gru, impalcature, scale, ecc.

2. OBBLIGHI DEL DATORE DI LAVORO (Art. 70-71)
• Mettere a disposizione attrezzature conformi alle disposizioni legislative e regolamentari
• Le attrezzature devono essere idonee ai lavori da svolgere e adeguate alla sicurezza
• Garantire la manutenzione, le verifiche e i controlli periodici
• Tenere un registro delle manutenzioni e verifiche (per attrezzature soggette a verifica periodica)
• Fornire informazione, formazione e addestramento specifico ai lavoratori che usano le attrezzature

3. VERIFICA PERIODICA DELLE ATTREZZATURE (Art. 71 c.11 — Allegato VII)
Attrezzature soggette a verifica periodica obbligatoria:
• Apparecchi di sollevamento non azionati a mano (gru, montacarichi, carroponte)
• Apparecchi a pressione (compressori, autoclavi, recipienti in pressione)
• Impianti di messa a terra e di protezione dai fulmini
• Impianti nei luoghi con pericolo di esplosione

Prima verifica: richiesta al datore di lavoro entro 60 giorni dalla messa in servizio
Verifiche periodiche: cadenza definita dall'Allegato VII (annuale, biennale, quinquennale a seconda del tipo)
Ente verificatore: INAIL (o soggetti abilitati dal Ministero del Lavoro)

4. FORMAZIONE OBBLIGATORIA PER ATTREZZATURE SPECIFICHE
ACCORDO STATO-REGIONI 22/02/2012:
Definisce i requisiti di formazione per operatori di:
a) Carrelli elevatori semoventi con conducente a bordo:
   • Durata: 12 ore (teoriche 4h + pratiche 8h)
   • Aggiornamento: 4 ore ogni 5 anni
   • Abilitazione: attestato di abilitazione INAIL
   
b) Gru per autocarro:
   • Durata: 10-14 ore (in base alla categoria)
   • Aggiornamento: 4 ore ogni 5 anni

c) Piattaforme di lavoro elevabili (PLE — cestelli):
   • Durata: 6-10 ore (in base al tipo di PLE)
   • Aggiornamento: 4 ore ogni 5 anni

d) Macchine movimento terra (escavatori, pale, ecc.):
   • Durata: 8-16 ore (in base alla macchina)
   • Aggiornamento: 4 ore ogni 5 anni

e) Gru a torre:
   • Durata: 14 ore
   • Aggiornamento: 4 ore ogni 5 anni

⚠️ IMPORTANTE: l'abilitazione è personale, specifica per tipo di attrezzatura, e ha validità 5 anni.

5. CARRELLI ELEVATORI — RISCHI E MISURE (dettaglio per logistica)
Rischi principali:
• Ribaltamento del carrello (causa principale di infortuni gravi e mortali)
• Investimento di pedoni nelle corsie di transito
• Caduta del carico dall'alto
• Urti con scaffalature o strutture
• Fuoriuscita di gas (GPL, batterie)

Misure di prevenzione:
• Separazione fisica dei percorsi pedonali e delle corsie carrelli
• Velocità massima in magazzino: 10 km/h (in corsia) — 5 km/h negli incroci
• Segnali di precedenza agli incroci e specchi retrovisori
• Obbligo cintura di sicurezza per il carrellista
• Controllo giornaliero pre-utilizzo del carrello (check-list)
• Manutenzione programmata
• Divieto di trasportare persone sul carrello
• Divieto di lavorare sotto carichi sospesi

6. SCALE PORTATILI — USO SICURO
• Scelta del tipo idoneo all'uso (appoggio, doppia, trasformabile)
• Lunghezza massima per scale in legno: 8 m; in alluminio: 15 m
• Angolo di inclinazione: 75° (scala a pioli contro parete)
• Non usare mai l'ultimo gradino o piolo
• Una persona alla volta sulla scala
• Non utilizzare scale con difetti o pioli mancanti
• Ancoraggio in testa o in piede (almeno uno dei due)

7. UTILIZZO SICURO DELLE ATTREZZATURE
• Leggere sempre il manuale del fabbricante
• Non superare il carico massimo indicato
• Non modificare le attrezzature
• Usare solo gli accessori previsti dal costruttore
• Segnalare immediatamente al preposto qualsiasi anomalia
• Non usare attrezzature difettose o con dispositivi di sicurezza manomessi

━━━ NOTE PER SETTORI SPECIFICI ━━━
🏭 LOGISTICA/MAGAZZINO: il carrello elevatore è la macchina più pericolosa del settore. L'Accordo S-R 22/02/2012 è obbligatorio per tutti i carrellisti. Ogni azienda deve disporre di un elenco aggiornato degli operatori abilitati.
🏗️ CANTIERI: gru a torre, PLE (cestelli), macchine movimento terra — tutte richiedono abilitazione specifica.
🏭 INDUSTRIA: carroponti, gru a bandiera, sollevatori — verifica periodica INAIL obbligatoria.
🌲 SILVICOLTURA: motoseghe — formazione obbligatoria; DPI specifici (pantaloni anti-taglio, stivali, casco con visiera e cuffie).

━━━ RIFERIMENTI NORMATIVI ━━━
• D.Lgs. 81/2008, Art. 69-73 e Allegato VII
• Accordo Stato-Regioni 22/02/2012 (abilitazioni attrezzature)
• D.Lgs. 17/2010 (Direttiva macchine — marcatura CE)
• Norma UNI ISO 3691 (carrelli industriali)`, en:`OFFICIAL CURRICULUM MODULE B — SPECIFIC UNIT
Sector: GENERIC (all sectors)
Topic: Chemical and Biological Agents
(State-Regions Agreement 26/01/2006 — Title IX D.Lgs. 81/08)

━━━ TRAINING CONTENT ━━━

1. CHEMICAL AGENTS — DEFINITIONS (Art. 222)
• Chemical agent: any element or compound (natural or synthesised) that may pose a risk
• Dangerous chemical agent: classified according to CLP Regulation (EU No. 1272/2008)
• Main hazard classifications: flammable, explosive, toxic, corrosive, irritant, sensitising, carcinogenic

2. CLP REGULATION — CLASSIFICATION AND LABELLING (EU Reg. 1272/2008)
Mandatory elements on each label:
• Hazard pictograms (GHS symbols)
• Signal word: "Danger" or "Warning"
• Hazard statements (H statements)
• Precautionary statements (P statements)
• Manufacturer's/importer's name and address

3. OCCUPATIONAL EXPOSURE LIMIT VALUES (OELVs)
• TLV-TWA (Time-Weighted Average): 8h average exposure
• TLV-STEL (Short-Term Exposure Limit): maximum 15-minute value
• TLV-C (Ceiling): value never to be exceeded
• BEI (Biological Exposure Indices): biological monitoring values

4. RISK ASSESSMENT FOR CHEMICAL AGENTS (Art. 223)
Factors to consider:
• Hazardous properties of the chemical agent
• Level, type and duration of exposure
• Exposure conditions (inhalation, skin contact, ingestion)
• Actions values established by law
• Results of health surveillance

5. PREVENTION MEASURES — HIERARCHY (Art. 224)
1. Elimination of the chemical agent (substitution with safer materials)
2. Enclosure of processes producing chemical agents
3. Local exhaust ventilation (LEV — extraction at source)
4. General ventilation of the working environment
5. Appropriate working procedures (reduce number of exposed workers)
6. Chemical PPE (gloves, respirators, goggles, suits)

6. CARCINOGENIC AND MUTAGENIC AGENTS (Title IX, Chapter II)
• Employer must reduce use to a minimum or substitute
• Closed processes or other means to minimise exposure
• Biological monitoring (urine checks, blood tests)
• 40-year retention of health records

7. BIOLOGICAL AGENTS (Title X, Art. 266-286)
Classification:
• Group 1: unlikely to cause disease in humans
• Group 2: can cause disease, responds to therapy (e.g. Hepatitis B, Salmonella)
• Group 3: can cause serious disease, effective therapy available (e.g. HIV, Tuberculosis)
• Group 4: can cause serious disease, no effective therapy (e.g. Ebola)
Mandatory measures for Groups 2-4:
• Containment and hygiene procedures
• Specific PPE
• Health surveillance and vaccination (where available)
• Emergency procedures

8. SAFETY DATA SHEET (SDS — REACH Regulation EU 1907/2006)
• Mandatory for all hazardous substances placed on the market
• 16 sections (EU format): identification, hazards, composition, first aid, etc.
• Must be available at the point of use in the language of the country of use
• Workers must be trained on how to read and use the SDS

━━━ SECTOR-SPECIFIC CONNECTIONS ━━━
🏭 Logistics/Warehouse: chemical risk from handling ADR goods (dangerous goods transport), cleaning products (alkaline detergents, solvents), battery charging (sulphuric acid fumes, hydrogen gas), CO from combustion-engine forklifts in enclosed environments.
🏗️ Construction: cement, silica, epoxy resins, solvents, asbestos (in remediation).
🏥 Healthcare: biological Group 2/3 agents, disinfectants, chemotherapy drugs, anaesthetic gases.
🏭 Chemical industry: primary sector for chemical risks.

━━━ LEGAL REFERENCES ━━━
• D.Lgs. 81/2008, Title IX, Art. 217-232 (chemical), Art. 233-245 (carcinogens), Title X, Art. 266-286 (biological)
• EU Reg. 1272/2008 (CLP)
• EU Reg. 1907/2006 (REACH)
• EU Dir. 2004/37/EC (carcinogens and mutagens)`},

   sum:{
     it:`Principali rischi nel settore logistica/magazzino:

1. Investimento da carrello elevatore — causa principale di infortuni gravi/mortali in magazzino
   Prevenzione: corsie pedonali separate, segnaletica a terra, limitazione velocità, regole di precedenza (carrelli cedono il passo ai pedoni nei punti critici).

2. Caduta di materiali dalle scaffalature
   Cause: sovraccarico, errato stoccaggio, scaffalature danneggiate, assenza di sistemi di ritenuta.
   Prevenzione: verifica periodica scaffali (norma UNI EN 15635), formazione operatori, sistema SARI (verde=ok/giallo=attenzione/rosso=fuori servizio).

3. Movimentazione manuale dei carichi (→ Modulo B2): lombalgia, ernie; prevenzione con ausili meccanici e rotazione.

4. Rischi specifici del carrello elevatore:
   • Ribaltamento: velocità eccessiva in curva, carico alzato troppo in alto durante la marcia
   • Caduta del carico: forche non abbassate, peso non centrato, mancanza fermapallet
   In caso di ribaltamento: restare allacciati con cintura, tenersi al volante, inclinare verso l'opposto — MAI saltare fuori.

5. Aree di carico e scarico: rischio caduta dalla banchina, investimento da mezzi esterni.
   Prevenzione: fermaruota (cunei) obbligatori, uso passerelle, segnalazione perimetrale.`,
     en:`Main risks in logistics/warehouse:

1. Forklift collision — main cause of serious/fatal accidents in warehouses
   Prevention: separate pedestrian lanes, floor signage, speed limits, right-of-way rules (forklifts yield to pedestrians at critical points).

2. Material falling from racking
   Causes: overloading, incorrect storage, damaged racking, missing restraint systems.
   Prevention: periodic rack inspection (standard UNI EN 15635), operator training, SARI system (green=ok/yellow=attention/red=out of service).

3. Manual handling of loads (→ Module B2): back pain, disc herniation; prevention with mechanical aids and rotation.

4. Forklift-specific risks:
   • Overturning: excessive speed in curves, load raised too high during travel
   • Load falling: forks not lowered, off-center weight, missing pallet retainers
   If overturning: stay buckled, hold steering wheel, lean opposite direction — NEVER jump out.

5. Loading and unloading areas: dock fall risk, collision from external vehicles.
   Prevention: mandatory wheel chocks, use of walkways, perimeter signage.`
   },

   curr:{it:`PROGRAMMA UFFICIALE MODULO B — UNITÀ SPECIFICA
Settore: LOGISTICA E MAGAZZINO (+ cenni altri settori)
Argomento: Rischi Specifici Logistica, Scaffalature, Aree di Carico
(Accordo Stato-Regioni 26/01/2006 — Settore ATECO specifico)

━━━ CONTENUTI FORMATIVI ━━━

1. IL PROFILO DI RISCHIO DEL SETTORE LOGISTICA/MAGAZZINO
Il settore logistico e del magazzinaggio presenta una delle più alte incidenze di infortuni sul lavoro in Italia:
• Infortuni da carrelli elevatori: ribaltamento, investimento, caduta carico
• Infortuni da MMC: lombalgie, ernie discali, patologie muscoloscheletriche
• Cadute dall'alto: da scale, scaffalature, piattaforme
• Cadute a livello: scivolamenti, inciampi su pavimenti
• Urti con scaffalature: soprattutto durante movimentazione notturna o in spazi angusti

2. LE SCAFFALATURE INDUSTRIALI — NORMATIVA E REQUISITI
Norma UNI EN 15635 (Sistemi di stoccaggio metallici — Uso e manutenzione):
• Sistemi di ispezione periodica obbligatoria delle scaffalature
• Persona Responsabile delle scaffalature (PRSES): designata dal DL
• Ispezione periodica: almeno una volta l'anno da personale competente
• Ispezione giornaliera/settimanale: da parte degli operatori (report visivo)

Classificazione dei danni alle scaffalature (UNI EN 15635):
• Verde: nessun danno — normale utilizzo
• Giallo: danno presente — limitare l'uso, pianificare riparazione
• Rosso: danno grave — METTERE FUORI SERVIZIO IMMEDIATAMENTE

Cause tipiche di danni alle scaffalature:
• Urto da carrello elevatore (causa principale)
• Sovraccarico (peso effettivo > portata nominale)
• Installazione non corretta
• Mancata manutenzione

Prevenzione:
• Protezioni angolari (paraurti, montanti di protezione)
• Cartelli con portata massima ben visibili
• Barriere fisiche per impedire l'accesso di carrelli alle aree vulnerabili
• Non superare mai la portata nominale del ripiano

3. AREE DI CARICO E SCARICO
Rischi specifici:
• Investimento da camion (manovra in retromarcia)
• Caduta dal bordo della banchina di carico
• Scivolamento su banchine bagnate o contaminate
• Contusioni da sportelli del camion o da nastri trasportatori

Misure di prevenzione:
• Blocco ruote del veicolo durante il carico/scarico
• Allineatore di banchina (dock leveller) per colmare il dislivello
• Protezioni laterali sul bordo banchina (catene, barriere)
• Divieto di transito pedoni nelle aree di manovra dei veicoli
• Segnalazione luminosa o acustica del movimento dei veicoli in retromarcia
• Scarpe con puntale in acciaio per tutti gli addetti

4. INFORTUNI TIPICI DEL SETTORE LOGISTICA — STATISTICHE INAIL
• MMC e patologie muscoloscheletriche: ~35% delle malattie professionali
• Infortuni da carrelli elevatori: ~15% degli infortuni gravi
• Cadute a livello: ~25% degli infortuni
• Cadute dall'alto: ~10% degli infortuni (scala, scaffale, banchina)
• Investimento da veicoli: ~5% degli infortuni mortali

5. GESTIONE DEL RISCHIO CHIMICO NEI MAGAZZINI
• Magazzini con prodotti chimici: DVR deve includere la valutazione del rischio chimico
• Prodotti etichettati GHS/CLP: leggere la scheda SDS (Safety Data Sheet)
• Stoccaggio separato di prodotti incompatibili (acidi/basi, ossidanti/infiammabili)
• Sistemi di ritenzione per sversamenti (vasche di contenimento)
• DPI specifici: guanti, occhiali, maschere in base alla sostanza

6. RISCHIO INCENDIO NEI MAGAZZINI
• D.M. 10/03/1998: classificazione del rischio incendio (basso, medio, alto)
• Magazzini con presenza di materiali combustibili (cartone, plastica, legno): rischio medio/alto
• Sistemi di estinzione: sprinkler automatici, estintori (CO₂ o polvere), idranti
• Vie di uscita: almeno 2 uscite, segnalate, sgombre
• Piano di emergenza aggiornato con frequenza
• Esercitazione antincendio: almeno 1 volta/anno (D.M. 10/03/1998)
• Addetti antincendio: formazione 4h (rischio basso), 8h (rischio medio), 16h (rischio alto)

7. STRESS DA LAVORO E RISCHI ORGANIZZATIVI IN LOGISTICA
• Turnazione e lavoro notturno: disturbi del sonno, alterazione ritmi circadiani
• Lavoro sotto pressione temporale: picchi stagionali (es. Black Friday, Natale)
• Isolamento sociale: turni notturni con pochi colleghi
• Monotonia e ripetitività delle operazioni: rischio burnout
• Valutazione stress lavoro-correlato: obbligatoria nel DVR (Art. 28)
• Indicatori da monitorare: assenteismo, turnover, malattie frequenti, incidenti

━━━ NOTE PER ALTRI SETTORI ━━━
🏗️ CANTIERI: rischi analoghi per cadute, urti con mezzi, ma in ambienti dinamici e variabili.
🏭 INDUSTRIA MANIFATTURIERA: rischi simili per scaffalature e aree di carico; aggiungono rischi da macchine utensili.
🏢 GRANDE DISTRIBUZIONE (GDO): simile alla logistica per ricevimento merci e rifornimento scaffali; aggiunge il rischio rapina e il rischio stress da contatto col pubblico.

━━━ RIFERIMENTI NORMATIVI ━━━
• D.Lgs. 81/2008 (integrale)
• Norma UNI EN 15635 (scaffalature industriali)
• D.M. 10/03/1998 (prevenzione incendi)
• Accordo Stato-Regioni 22/02/2012 (formazione carrellisti)
• Linee guida INAIL per il settore logistica`, en:`OFFICIAL CURRICULUM MODULE B — SPECIFIC UNIT
Sector: GENERIC (all sectors)
Topic: Physical Agents — Noise, Vibrations, Radiation
(State-Regions Agreement 26/01/2006 — Title VIII D.Lgs. 81/08)

━━━ TRAINING CONTENT ━━━

1. NOISE AT WORK (Title VIII, Chapter II — Art. 187-198)
KEY VALUES:
• Lower action value (LAV): LEX,8h = 80 dB(A) and LCpeak = 135 dB(C)
  → Information and training; voluntary health surveillance; PPE available
• Upper action value (UAV): LEX,8h = 85 dB(A) and LCpeak = 137 dB(C)
  → MANDATORY hearing protection; MANDATORY health surveillance
• Limit value (LV): LEX,8h = 87 dB(A) (with PPE correction applied)
  → Must NEVER be exceeded

PREVENTION MEASURES (Art. 192):
• Technical measures: low-noise machinery, acoustic insulation, vibration-damping mounts
• Organisational measures: noise exposure time reduction, rotation
• Individual measures: hearing protectors Cat. II or III (mandatory above 85dB)

HEALTH SURVEILLANCE:
• Mandatory above upper action value (LEX >85dB)
• Audiometric examination to assess hearing loss over time

2. WHOLE-BODY VIBRATIONS (WBV) (Art. 200-204)
• Caused by: forklifts, trucks, agricultural machinery, construction machinery
• Key values:
  - Action value: A(8) = 0.5 m/s²
  - Limit value: A(8) = 1.15 m/s²
• Health effects: lumbar spine disorders, discopathy
• Forklift operators: WBV is the primary risk → health surveillance mandatory

3. HAND-ARM VIBRATIONS (HAV) (Art. 200-204)
• Caused by: angle grinders, pneumatic drills, jackhammers, vibrating tools
• Key values:
  - Action value: A(8) = 2.5 m/s²
  - Limit value: A(8) = 5 m/s²
• Health effects: Raynaud's syndrome, carpal tunnel, vascular/neurological disorders

4. EXTREME TEMPERATURES
• Cold work: >8h in environments below -15°C (deep freeze logistics, refrigerated stores)
  - Mandatory rest periods, thermal PPE, water-proof footwear
• Hot work: >8h in environments above 35°C (summer warehouses, close to furnaces)
  - Acclimatisation, hydration, environmental monitoring

5. OPTICAL RADIATION (Art. 213-218)
• Non-ionising radiation (NIR): UV, visible light, infrared, laser
• Ionising radiation: X-rays, gamma, nuclear (regulated by D.Lgs. 230/1995 — separate)
• Main sources at work: industrial lasers, UV lamps for curing, welding arcs
• PPE for laser: specific goggles (OD rated for the wavelength)
• PPE for welding: darkened visors (shade 10-13 for electric arc)

6. ELECTROMAGNETIC FIELDS (Art. 206-212)
• Sources: induction heating equipment, medical MRI, welding equipment, high-voltage lines
• Action values and limit values in EU Dir. 2013/35/EU (transposed into Italian law)
• Particular protection for workers with active implanted devices (pacemakers, etc.)
• Health surveillance required above action values

7. PHYSICAL RISK ASSESSMENT IN THE DVR
• Noise: LEX,8h measurement with calibrated phonometer
• Vibrations: measurement with accelerometer according to ISO 5349 (HAV) and ISO 2631 (WBV)
• The measurement must be carried out by a qualified technician
• Results recorded in the DVR with corrective action plan if action values are exceeded

━━━ SECTOR-SPECIFIC CONNECTIONS ━━━
🏭 Logistics/Warehouse: WBV from forklifts (primary risk — mandatory health surveillance), noise in loading/unloading areas (impact beeps, reversing alarms, pallet handling), cold risk in refrigerated warehouses, chemical CO risk from combustion-engine forklifts.
🏗️ Construction: HAV from power tools, WBV from heavy machinery, noise from demolition and machinery.
🏥 Healthcare: NIR from medical equipment (UV lamps, surgical lasers), electromagnetic fields from MRI.
🏭 Industry: all types of physical risk potentially present.

━━━ LEGAL REFERENCES ━━━
• D.Lgs. 81/2008, Title VIII: Art. 187-218
• EU Dir. 2003/10/EC (noise), Dir. 2002/44/EC (vibrations), Dir. 2006/25/EC (optical radiation), Dir. 2013/35/EU (electromagnetic fields)
• ISO 5349 (HAV measurement), ISO 2631 (WBV measurement)`},

   title:{it:'Videoterminali (VDT)',en:'Display Screen Equipment (DSE)',fa:'صفحه‌نمایش‌ها'},
   sub:{it:'Titolo VII · Art. 172-179 · Tutela della vista e della postura',en:'Title VII · Art. 172-179 · Eye and posture protection'},
   arts:['Art. 172','Art. 173','Art. 174','Art. 175','Art. 176','Art. 177'],
   sum:{
     it:`Videoterminale (Art. 172): qualsiasi interfaccia alfanumerica o grafica, indipendentemente dal tipo di procedimento usato per la visualizzazione.

Lavoratore VDT (Art. 173 c.1 lett. c): chi usa abitualmente un'attrezzatura munita di VDT per almeno 20 ore settimanali, dedotte le pause di legge.

Obblighi del DL (Art. 174):
• Analisi dei posti di lavoro per valutare i rischi per la vista, i problemi fisici e la postura
• Adottare misure per eliminare o ridurre i rischi riscontrati
• Informare i lavoratori sulle misure applicate e sulla corretta organizzazione del lavoro

Pause e interruzioni (Art. 175): dopo ogni 2 ore continuative al VDT il lavoratore ha diritto a una pausa di 15 minuti. Le pause possono essere stabilite dalla contrattazione collettiva; in alternativa si applica il regime di legge. Le pause NON sono recuperabili.

Sorveglianza sanitaria (Art. 176):
• Visita preventiva (prima dell'adibizione) e visita periodica ogni 5 anni (ogni 2 anni per lavoratori >50 anni o con rischio elevato)
• Il MC valuta l'idoneità alla mansione specifica
• Lavoratori con problemi visivi: diritto a esame oculistico a cura del DL

Requisiti del posto di lavoro (Allegato XXXIV):
• Schermo: orientabile e inclinabile, assenza di riflessi, caratteri stabili e leggibili
• Tastiera: separata dallo schermo, inclinabile, superficie opaca
• Piano di lavoro: dimensioni adeguate, superficie a bassa riflessione, altezza regolabile
• Sedia: regolabile in altezza, schienale regolabile, poggiapiedi se necessario
• Illuminazione: 300-500 lux, evitare abbagliamenti e riflessi sullo schermo`,
     en:`Display Screen (Art. 172): any alphanumeric or graphic interface, regardless of display technology.

DSE Worker (Art. 173 c.1 lett. c): anyone who habitually uses DSE for at least 20 hours per week, excluding legal breaks.

Employer obligations (Art. 174):
• Workstation analysis to assess risks to sight, physical problems and posture
• Adopt measures to eliminate or reduce identified risks
• Inform workers on measures applied and correct work organization

Breaks (Art. 175): after every 2 continuous hours at DSE, worker has the right to a 15-minute break. Breaks may be set by collective bargaining; otherwise the statutory regime applies. Breaks are NOT recoverable.

Health surveillance (Art. 176):
• Preventive visit (before assignment) and periodic visit every 5 years (every 2 years for workers >50 or with elevated risk)
• MC evaluates fitness for specific duty
• Workers with visual problems: right to eye examination at employer's expense

Workstation requirements (Annex XXXIV):
• Screen: tiltable and swivelling, no reflections, stable readable characters
• Keyboard: separate from screen, tiltable, matt surface
• Work surface: adequate dimensions, low-reflection surface, adjustable height
• Chair: height-adjustable, adjustable backrest, footrest if needed
• Lighting: 300-500 lux, avoid glare and reflections on screen`
   },

   curr:{it:`PROGRAMMA UFFICIALE MODULO B — UNITÀ SPECIFICA
Settore: GENERICO (con forte applicazione in uffici, call center, amministrazioni)
Argomento: Videoterminali (VDT) / Display Screen Equipment
(Titolo VII D.Lgs. 81/08 — Art. 172-179)

━━━ CONTENUTI FORMATIVI ━━━

1. DEFINIZIONI (Art. 172)
• Videoterminale (VDT): schermo alfanumerico o grafico indipendentemente dal tipo di procedimento
• Postazione di lavoro: l'insieme del VDT + tastiera + supporto per documenti + sedia + piano di lavoro + ambiente
• Lavoratore al VDT soggetto a sorveglianza sanitaria: chi usa il VDT sistematicamente o abitualmente per ≥20 ore settimanali (al netto delle pause)

2. RISCHI DA LAVORO CON VDT
• Disturbi visivi: affaticamento visivo (astenopia), secchezza oculare, bruciore, vista offuscata
• Disturbi muscoloscheletrici: cervicalgia, dorsalgia, lombosciatalgia, sindrome del tunnel carpale
• Disturbi da stress e affaticamento mentale: in particolare per attività ad alta pressione (call center)

3. REQUISITI DELLA POSTAZIONE DI LAVORO (Allegato XXXIV)
SCHERMO:
• Caratteri ben definiti, immagine stabile (no sfarfallio)
• Regolabilità di luminosità e contrasto
• Orientamento e inclinazione regolabili
• Assenza di riflessi e riverberi
• Distanza ottimale dagli occhi: 50-70 cm

TASTIERA:
• Inclinabile e separata dallo schermo
• Spazio sufficiente davanti alla tastiera per appoggiare le mani
• Superficie opaca per evitare riflessi
• Layout adeguato (QWERTY per l'italiano)

PIANO DI LAVORO:
• Superficie sufficientemente ampia e opaca
• Altezza regolabile (o fissa a 72-75 cm se sedia regolabile)
• Supporto porta-documenti se necessario

SEDILE:
• Regolabile in altezza
• Schienale regolabile in altezza e inclinazione
• Poggiapiedi disponibile su richiesta (se non si raggiunge il pavimento con i piedi)

AMBIENTE:
• Illuminazione: 300-500 lux sul piano di lavoro; no abbagliamento diretto
• Finestre con schermature (tende, veneziane) per evitare riflessi sullo schermo
• Temperatura: 19-26°C; umidità relativa 40-60%
• Rumore: livelli compatibili con la concentrazione richiesta

4. PAUSE E INTERRUZIONI (Art. 175)
• Dopo ogni 2 ore di applicazione continuativa al VDT: pausa di almeno 15 minuti
• Le pause non sono cumulabili (non si può fare 30 minuti ogni 4 ore)
• Durante la pausa: cambio di attività visiva e posturale
• Le pause sono tempo di lavoro a tutti gli effetti (retribuite)

5. SORVEGLIANZA SANITARIA (Art. 176)
• Obbligatoria per i lavoratori che usano VDT ≥20h/settimana
• Visita preventiva: prima dell'adibizione al lavoro VDT
• Visite periodiche: ogni 5 anni (ogni 2 anni per lavoratori >50 anni o con prescrizione correttiva)
• Il MC può prescrivere occhiali o altri dispositivi correttivi specifici per il lavoro al VDT
• Il costo degli occhiali correttivi è a carico del DL (se il MC li prescrive come necessari)

━━━ NOTE PER SETTORI SPECIFICI ━━━
🏢 UFFICI/AMMINISTRAZIONI: applicazione massima. Quasi tutti i lavoratori sono soggetti.
📞 CALL CENTER: alto rischio di stress + VDT. Rotazione obbligatoria tra attività.
🏭 LOGISTICA/MAGAZZINO: uffici amministrativi del magazzino, sistemi WMS su terminal dedicati.
🏥 SANITÀ: cartelle cliniche elettroniche, diagnostica per immagini (VDT ad alta risoluzione).`, en:`OFFICIAL CURRICULUM MODULE C — MANAGEMENT UNIT 1
(State-Regions Agreement 26/01/2006 — Duration: 4 hours — RSPP only)

━━━ TRAINING CONTENT ━━━

1. HEALTH AND SAFETY MANAGEMENT SYSTEMS (HSMS)
• HSMS: structured set of procedures, roles and responsibilities for managing H&S
• Voluntary but incentivised adoption (Art. 30 — exemption from administrative liability)
• Main international standards:
  - BS OHSAS 18001:2007 (superseded)
  - ISO 45001:2018 (current international standard)
  - UNI INAIL Guidelines (2001 — Italian reference)

2. ISO 45001:2018 — KEY ELEMENTS
PDCA CYCLE (Plan-Do-Check-Act):
• PLAN: H&S policy; risk identification and assessment; objectives and targets
• DO: implementation of operational controls; training; communication; emergency management
• CHECK: performance monitoring; internal audits; incident investigation
• ACT: corrective and preventive actions; management review

3. CORPORATE H&S POLICY
Must:
• Be appropriate to the nature and size of the organisation
• Commit to prevention of injury and ill health
• Commit to compliance with applicable legal requirements
• Commit to continuous improvement of the HSMS
• Be communicated to all workers
• Be reviewed periodically

4. ART. 30 — ORGANISATIONAL MODELS (D.Lgs. 231/2001)
• D.Lgs. 231/2001: administrative liability of legal entities for offences by their representatives
• Art. 30 D.Lgs. 81/08: an effective HSMS (ISO 45001 or UNI INAIL) constitutes an exemption
• Exempt the company from administrative sanctions following workplace accidents
• Requirements: real implementation, periodic audits, disciplinary system

5. KEY PERFORMANCE INDICATORS (KPIs) FOR H&S
Leading indicators (predictive):
• Near-miss and unsafe condition reports
• Safety training completion rate
• Percentage of corrective actions closed on time
• H&S inspection frequency

Lagging indicators (outcome-based):
• Injury frequency rate (IFR) = accidents × 1,000,000 / hours worked
• Injury severity rate (ISR) = lost days × 1,000 / hours worked
• Number of occupational diseases reported

6. EMERGENCY MANAGEMENT WITHIN THE HSMS
• Business Continuity Plan (BCP): ensuring operational continuity after a critical event
• Emergency procedures: testing, drills, periodic review
• Coordination with external bodies: Fire Brigade, Civil Protection, 118

━━━ LEGAL REFERENCES ━━━
• D.Lgs. 81/2008, Art. 30
• D.Lgs. 231/2001
• ISO 45001:2018
• UNI INAIL Guidelines (2001)
• BS OHSAS 18001:2007 (historical reference)`},

{id:'C2',cat:'C',order:2,icon:'⚗️',hrs:4,
   title:{it:'Agenti Chimici Pericolosi',en:'Hazardous Chemical Agents',fa:'عوامل شیمیایی خطرناک'},
   sub:{it:'Titolo IX Capo I · Art. 221-232 · VLE, valutazione, misure',en:'Title IX Chapter I · Art. 221-232 · OEL, assessment, measures'},
   arts:['Art. 221','Art. 222','Art. 223','Art. 224','Art. 225','Art. 226','Art. 228','Art. 229'],
   sum:{
     it:`Agente chimico pericoloso (Art. 222): qualsiasi agente chimico classificato come pericoloso ai sensi del Regolamento CLP (Reg. CE 1272/2008), o che pur non classificato può presentare rischi per la sicurezza e la salute dei lavoratori a causa delle sue proprietà chimico-fisiche, chimiche o tossicologiche.

Valutazione del rischio chimico (Art. 223): il DL deve valutare tutti i rischi derivanti da agenti chimici presenti sul luogo di lavoro, prendendo in considerazione:
• Proprietà pericolose dell'agente (schede SDS)
• Livelli, tipo e durata dell'esposizione
• Valori limite di esposizione professionale (VLEP/OEL) — Allegato XXXVIII
• Effetti delle misure preventive e protettive già adottate
• Risultati della sorveglianza sanitaria disponibili

Gerarchia delle misure (Art. 224):
1. Eliminazione/sostituzione con agente meno pericoloso
2. Misure di prevenzione e protezione collettiva (ventilazione, confinamento)
3. Misure organizzative (riduzione tempi di esposizione, rotazione)
4. DPI (ultima risorsa — guanti, respiratori, occhiali)

Rischio basso (Art. 224 c.2): se la valutazione evidenzia che i rischi sono bassi e le misure adottate sono sufficienti, non è necessaria la sorveglianza sanitaria né la redazione di una valutazione documentata specifica (sufficiente indicazione nel DVR).

Valori limite di esposizione professionale (VLEP): valori di concentrazione nell'aria che, se non superati, non causano effetti nocivi. Distinti in:
• TLV-TWA (Time Weighted Average): valore medio ponderato su 8 ore
• TLV-STEL (Short Term Exposure Limit): valore limite di breve durata (15 minuti)
• TLV-C (Ceiling): valore che non deve mai essere superato

Schede SDS (Safety Data Sheet): obbligatorie per tutti gli agenti chimici pericolosi; articolate in 16 sezioni secondo il Regolamento REACH (CE 1907/2006).`,
     en:`Hazardous chemical agent (Art. 222): any chemical agent classified as hazardous under CLP Regulation (EC 1272/2008), or which though not classified may present risks to workers' health and safety due to its physico-chemical, chemical or toxicological properties.

Chemical risk assessment (Art. 223): employer must assess all risks from chemical agents present at workplace, considering:
• Hazardous properties of agent (SDS sheets)
• Levels, type and duration of exposure
• Occupational Exposure Limit Values (OELs) — Annex XXXVIII
• Effects of prevention and protection measures already in place
• Available health surveillance results

Measures hierarchy (Art. 224):
1. Elimination/substitution with less hazardous agent
2. Collective prevention and protection measures (ventilation, containment)
3. Organizational measures (reduced exposure time, job rotation)
4. PPE (last resort — gloves, respirators, goggles)

Low risk (Art. 224 c.2): if assessment shows risks are low and measures are sufficient, health surveillance is not required, nor specific documented assessment (indication in DVR is sufficient).

OEL values: air concentration values that, if not exceeded, do not cause harmful effects. Distinguished into:
• TLV-TWA (Time Weighted Average): 8-hour time-weighted average
• TLV-STEL (Short Term Exposure Limit): 15-minute short-term limit
• TLV-C (Ceiling): value that must never be exceeded

SDS (Safety Data Sheets): mandatory for all hazardous chemicals; structured in 16 sections per REACH Regulation (EC 1907/2006).`
   },

     it:['Art. 222: agente chimico pericoloso = classificato CLP o con proprietà tossicologiche/fisico-chimiche pericolose','Art. 223: la valutazione usa i VLEP (Allegato XXXVIII): TWA (8h), STEL (15 min), Ceiling (mai superare)','Gerarchia: eliminazione → sostituzione → protezione collettiva → DPI','Art. 224 c.2: rischio basso = nessuna sorveglianza sanitaria specifica obbligatoria','SDS (scheda dati sicurezza): 16 sezioni obbligatorie per ogni sostanza pericolosa (Reg. REACH)'],

   curr:{it:`PROGRAMMA UFFICIALE MODULO B — UNITÀ SPECIFICA
Settore: GENERICO (con forte applicazione in industria chimica, pulizie, laboratori, sanità)
Argomento: Agenti Chimici Pericolosi
(Titolo IX Capo I D.Lgs. 81/08 — Art. 221-232)

━━━ CONTENUTI FORMATIVI ━━━

1. DEFINIZIONE DI AGENTE CHIMICO PERICOLOSO (Art. 222)
• Qualsiasi agente chimico classificato come pericoloso ai sensi del Reg. CE 1272/2008 (CLP)
• Agenti che pur non essendo classificati possono comportare un rischio per la sicurezza e la salute (es. CO non classificato ma tossico in ambienti chiusi)

2. IL REGOLAMENTO CLP E L'ETICHETTATURA GHS
Pittogrammi GHS di pericolo:
• GHS01: esplosivo (bomba)
• GHS02: infiammabile (fiamma)
• GHS03: comburente (fiamma su cerchio)
• GHS04: gas compresso (bombola)
• GHS05: corrosivo (provette con acido su metallo e mano)
• GHS06: tossico acuto (teschio)
• GHS07: nocivo/irritante (punto esclamativo)
• GHS08: pericolo cronico per la salute (uomo con stella sul petto)
• GHS09: pericolo per l'ambiente acquatico (pesce e albero)

3. VALUTAZIONE DEL RISCHIO CHIMICO (Art. 223)
La valutazione deve considerare:
• Proprietà pericolose degli agenti (scheda SDS — Safety Data Sheet)
• Informazioni sulla salute e la sicurezza fornite dal fabbricante/fornitore
• Livello, tipo e durata dell'esposizione
• Effetti delle misure preventive adottate
• Risultati della sorveglianza sanitaria già effettuata
• Valori limite di esposizione professionale (VLE)

4. VALORI LIMITE DI ESPOSIZIONE PROFESSIONALE (VLE — Art. 232)
• TLV-TWA: concentrazione media ponderata nel tempo (8 ore/giorno — 40 ore/settimana)
• TLV-STEL: limite di breve durata (15 minuti, massimo 4 volte/giorno)
• TLV-C: ceiling — valore che non deve essere mai superato
• I VLE sono definiti nell'Allegato XXXVIII del D.Lgs. 81/08

5. MISURE DI PREVENZIONE E PROTEZIONE (Art. 225)
In ordine gerarchico:
1. Sostituzione con agenti meno pericolosi
2. Modifica dei processi produttivi (ciclo chiuso)
3. Sistemi di aspirazione localizzata
4. Ventilazione generale dell'ambiente
5. DPI (guanti, maschere, occhiali, tute) — ultima opzione

6. SCHEDA SDS (Safety Data Sheet — Reg. REACH 1907/2006)
16 sezioni obbligatorie:
1. Identificazione della sostanza/miscela e della società
2. Identificazione dei pericoli
3. Composizione/informazioni sugli ingredienti
4. Misure di primo soccorso
5. Misure antincendio
6. Misure in caso di rilascio accidentale
7. Manipolazione e stoccaggio
8. Controllo dell'esposizione/protezione individuale
9. Proprietà fisiche e chimiche
10-16. Informazioni tossicologiche, ecologiche, smaltimento, trasporto, normativa, altre

━━━ NOTE PER SETTORI SPECIFICI ━━━
🏭 INDUSTRIA CHIMICA/FARMACEUTICA: massima esposizione. DVR chimico obbligatorio con misurazione ambientale.
🏥 SANITÀ: disinfettanti, chemioterapici, anestetici — rischio chimico elevato.
🏭 LOGISTICA: magazzini di prodotti chimici o detergenti. Rischio sversamento e inalazione.
🧹 PULIZIE: prodotti di pulizia e igiene — rischio dermatite da contatto.`, en:`OFFICIAL CURRICULUM MODULE C — MANAGEMENT UNIT 2
(State-Regions Agreement 26/01/2006 — Duration: 4 hours — RSPP only)

━━━ TRAINING CONTENT ━━━

1. ACCIDENT ANALYSIS AND INVESTIGATION
• Near-miss: event without injury but with injury potential → MUST be reported and investigated
• Accident: event causing injury to one or more workers
• Occupational disease: pathology arising from prolonged work-related exposure

2. ACCIDENT INVESTIGATION METHODS
ROOT CAUSE ANALYSIS (RCA):
• Identify the root causes (not just the immediate causes) of the accident
• Methods: Fault Tree Analysis (FTA), Fishbone Diagram, Why-Why Analysis (5 Whys)
• 5 WHYs METHOD: ask "why?" 5 consecutive times to reach the root cause
  Example: Worker slips → 1) Why? Floor wet → 2) Why? Liquid spill → 3) Why? No drip tray → 4) Why? Not required by procedure → 5) Why? Procedure not reviewed → Root cause: inadequate risk assessment

3. INAIL REPORTING AND NOTIFICATION
Employer obligations for accidents:
• ACCIDENT WITH PROGNOSIS >3 days: report to INAIL within 2 days
• FATAL ACCIDENT: report to INAIL within 24 hours + report to Judicial Authority
• INAIL report online: via INAIL web portal
• Report to Labour Inspectorate: for serious accidents (permanent disability, death)

4. ACCIDENT COSTS — DIRECT AND INDIRECT
DIRECT COSTS (borne by INAIL):
• Compensation for temporary disability
• Permanent disability pension
• Death compensation for heirs

INDIRECT COSTS (borne by the company — 3 to 10 times direct costs):
• Lost production
• Machine/equipment damage
• Management time for investigation and reporting
• Cost of replacement worker training
• Reputational damage

5. OCCUPATIONAL DISEASE NOTIFICATION
• The physician who diagnoses an occupational disease must notify INAIL
• The worker may also notify directly
• Main occupational diseases: work-related musculoskeletal disorders (WMSDs), hearing loss, silicosis, asbestosis, work-related stress

6. STATISTICAL ANALYSIS FOR PREVENTION
• Injury frequency rate (IFR): (accidents × 1,000,000) / hours worked
• Injury severity rate (ISR): (lost days × 1,000) / hours worked
• Sector benchmarking: comparison with INAIL sector averages
• Trend analysis: year-on-year monitoring to assess effectiveness of actions taken

━━━ LEGAL REFERENCES ━━━
• D.Lgs. 81/2008, Art. 53 (registers), Art. 54 (reports)
• D.P.R. 1124/1965 (Consolidated Law on occupational accidents) — partially still in force
• INAIL online reporting procedures`},
   quiz:[
     {q:{it:'Il valore TLV-TWA rappresenta:',en:'The TLV-TWA value represents:'},
      opts:{it:['Il valore che non deve MAI essere superato','La concentrazione media ponderata su 8 ore lavorative','Il limite per esposizioni brevi di 15 minuti','Il valore massimo per sostanze cancerogene'],en:['The value that must NEVER be exceeded','The time-weighted average concentration over 8 working hours','The limit for short-term 15-minute exposures','The maximum value for carcinogenic substances']},
      ans:1,exp:{it:'Il TLV-TWA (Time Weighted Average) è la concentrazione media ponderata nel tempo su 8 ore lavorative giornaliere e 40 ore settimanali. Il TLV-C è quello che non deve mai essere superato, mentre il TLV-STEL vale per esposizioni brevi (15 min).',en:'TLV-TWA (Time Weighted Average) is the time-weighted average concentration over 8 daily working hours and 40 weekly hours. TLV-C must never be exceeded, while TLV-STEL applies to short-term 15-min exposures.'}},
     {q:{it:'Quando si può escludere la sorveglianza sanitaria per agenti chimici (Art. 224)?',en:'When can health surveillance be excluded for chemical agents (Art. 224)?'},
      opts:{it:['Mai, è sempre obbligatoria','Quando il rischio è basso e le misure adottate sono sufficienti','Solo per le ditte con meno di 10 dipendenti','Quando il DL lo decide autonomamente'],en:['Never, it is always mandatory','When risk is low and measures in place are sufficient','Only for companies with fewer than 10 employees','When the employer decides autonomously']},
      ans:1,exp:{it:'Art. 224 c.2: se la valutazione dimostra che i rischi sono bassi per la sicurezza e irrilevanti per la salute, il DL non è tenuto a effettuare la sorveglianza sanitaria specifica né una valutazione documentale approfondita.',en:'Art. 224 c.2: if assessment shows risks are low for safety and negligible for health, employer is not required to perform specific health surveillance or detailed documented assessment.'}},
     {q:{it:'La scheda SDS (Safety Data Sheet) è strutturata in:',en:'The SDS (Safety Data Sheet) is structured in:'},
      opts:{it:['8 sezioni','12 sezioni','16 sezioni','20 sezioni'],en:['8 sections','12 sections','16 sections','20 sections']},
      ans:2,exp:{it:'Il Regolamento REACH (CE 1907/2006) stabilisce che la SDS deve essere articolata in 16 sezioni standard obbligatorie, contenenti informazioni su identificazione, composizione, pericoli, misure di pronto soccorso, antincendio, DPI, ecc.',en:'REACH Regulation (EC 1907/2006) establishes that the SDS must be structured in 16 mandatory standard sections, containing information on identification, composition, hazards, first aid measures, fire-fighting, PPE, etc.'}},
     {q:{it:'Nella gerarchia delle misure per il rischio chimico, i DPI si trovano:',en:'In the hierarchy of measures for chemical risk, PPE is placed:'},
      opts:{it:['Al primo posto','Al secondo posto, dopo eliminazione','All\'ultimo posto, dopo eliminazione, sostituzione e protezione collettiva','Al terzo posto, prima della protezione collettiva'],en:['First','Second, after elimination','Last, after elimination, substitution and collective protection','Third, before collective protection']},
      ans:2,exp:{it:'Art. 224: la gerarchia prevede 1) Eliminazione/sostituzione, 2) Misure di protezione collettiva (ventilazione, confinamento), 3) Misure organizzative, 4) DPI. I DPI sono sempre l\'ultima opzione.',en:'Art. 224: the hierarchy requires 1) Elimination/substitution, 2) Collective protection measures (ventilation, containment), 3) Organizational measures, 4) PPE. PPE is always the last option.'}}
   ]},

{id:'C3',cat:'C',order:3,icon:'☢️',hrs:3,
   title:{it:'Agenti Cancerogeni e Mutageni',en:'Carcinogenic & Mutagenic Agents',fa:'عوامل سرطان‌زا و جهش‌زا'},
   sub:{it:'Titolo IX Capo II · Art. 233-245 · D.Lgs. 135/2024',en:'Title IX Chapter II · Art. 233-245 · D.Lgs. 135/2024'},
   arts:['Art. 233','Art. 234','Art. 235','Art. 236','Art. 237','Art. 238','Art. 239','Art. 240','Art. 241','Art. 242','Art. 243','Art. 244','Art. 245'],
   sum:{
     it:`Agente cancerogeno (Art. 234): sostanza o miscela classificata come cancerogena di categoria 1A o 1B dal Regolamento CLP (Reg. CE 1272/2008), oppure qualsiasi sostanza, miscela o procedimento indicato nell'Allegato XLII del D.Lgs. 81/08.

Agente mutageno: sostanza classificata come mutagena di categoria 1A o 1B dal Regolamento CLP. Il D.Lgs. 135/2024 ha esteso la tutela alle sostanze reprotossiche (tossiche per la riproduzione).

Principio cardine: la sostituzione è obbligatoria (Art. 235). Il DL DEVE evitare o ridurre l'uso di agenti cancerogeni ricorrendo, ove tecnicamente possibile, a sostanze, miscele o processi che non siano pericolosi o lo siano meno. Non è facoltativo.

Valutazione del rischio (Art. 236): obbligatoria e documentata in tutti i casi. Deve includere:
• Tipo, livello, durata dell'esposizione
• Valore limite di esposizione (VLE) — Allegato XLIII (aggiornato da D.Lgs. 135/2024)
• Misure preventive e protettive adottate
• Numero di lavoratori esposti o potenzialmente esposti

Misure specifiche (Art. 237-239):
• Limitare al minimo il numero dei lavoratori esposti
• Progettare i processi lavorativi in modo da evitare la formazione e la dispersione
• Misurare i valori di esposizione con metodologie validate (UNI EN 482)
• Registro degli esposti: ogni lavoratore esposto a cancerogeni deve essere iscritto nel registro degli esposti tenuto dal DL (Art. 243)

Sorveglianza sanitaria (Art. 242): obbligatoria per tutti i lavoratori esposti, senza eccezioni. La cartella sanitaria è conservata per 40 anni dalla fine dell'esposizione. Al termine del rapporto di lavoro, il DL informa il lavoratore del diritto alla sorveglianza sanitaria anche dopo la cessazione.

D.Lgs. 135/2024: ha modificato 22 articoli del Titolo IX e introdotto il nuovo Allegato XLIII-BIS sul piombo e i suoi composti ionici, recependo la Direttiva UE 2022/431.`,
     en:`Carcinogenic agent (Art. 234): substance or mixture classified as carcinogenic category 1A or 1B under CLP Regulation (EC 1272/2008), or any substance, mixture or process listed in Annex XLII of D.Lgs. 81/08.

Mutagenic agent: substance classified as mutagenic category 1A or 1B under CLP. D.Lgs. 135/2024 extended protection to reprotoxic substances.

Key principle: substitution is mandatory (Art. 235). The employer MUST avoid or reduce use of carcinogenic agents by using, where technically possible, substances, mixtures or processes that are not or are less hazardous. This is not optional.

Risk assessment (Art. 236): mandatory and documented in all cases. Must include:
• Type, level, duration of exposure
• Exposure Limit Value (ELV) — Annex XLIII (updated by D.Lgs. 135/2024)
• Prevention and protection measures adopted
• Number of workers exposed or potentially exposed

Specific measures (Art. 237-239):
• Minimize number of exposed workers
• Design work processes to avoid formation and dispersal
• Measure exposure values with validated methods (UNI EN 482)
• Register of exposed workers: each worker exposed to carcinogens must be entered in register kept by employer (Art. 243)

Health surveillance (Art. 242): mandatory for ALL exposed workers, without exceptions. Health records kept for 40 years after end of exposure. At end of employment, employer informs worker of right to health surveillance even after leaving.

D.Lgs. 135/2024: modified 22 articles of Title IX and introduced new Annex XLIII-BIS on lead and its ionic compounds, transposing EU Directive 2022/431.`
   },

   curr:{it:`PROGRAMMA UFFICIALE MODULO B — UNITÀ SPECIFICA
Settore: GENERICO (con applicazione in industria, cantieri, sanità, laboratori)
Argomento: Agenti Cancerogeni e Mutageni
(Titolo IX Capo II D.Lgs. 81/08 — Art. 233-245)

━━━ CONTENUTI FORMATIVI ━━━

1. DEFINIZIONI (Art. 233)
• Agente cancerogeno: sostanza, miscela o processo che causa o può causare il cancro
• Agente mutageno: sostanza o miscela che provoca mutazioni genetiche ereditabili
• Agente reprotossico: sostanza che danneggia la fertilità o lo sviluppo del feto
• Classificazione: categoria 1A (cancerogeno accertato per l'uomo), 1B (probabile), 2 (possibile)

2. ESEMPI DI AGENTI CANCEROGENI PROFESSIONALI
• Amianto (asbesto): cancerogeno certo — mesotelioma pleurico, carcinoma polmonare
• Silice cristallina respirabile: silicosi e cancro del polmone (cantieri, ceramica, fonderie)
• Benzene: leucemia (industria petrolchimica)
• Formaldeide: cancro nasofaringeo (industria del legno, laboratori, pompe funebri)
• IPA (Idrocarburi Policiclici Aromatici): cancerogeni in fumo di saldatura, asfalto
• Cromo VI: cancro al polmone (galvaniche, verniciatura)
• Polveri di legno duro (querce, faggi): cancro nasofaringeo (falegnami, carpentieri)

3. OBBLIGHI DEL DATORE DI LAVORO (Art. 235)
• Sostituire l'agente cancerogeno con uno non pericoloso o meno pericoloso (PRIORITÀ ASSOLUTA)
• Se la sostituzione non è tecnicamente possibile: ciclo chiuso o riduzione al minimo possibile
• Ridurre il numero di lavoratori esposti al minimo necessario
• Misurare periodicamente le concentrazioni nell'aria
• Comunicare il numero di lavoratori esposti all'INAIL (Registro degli esposti — Art. 243)

4. IL REGISTRO DEGLI ESPOSTI AD AGENTI CANCEROGENI (Art. 243)
• Il DL istituisce e aggiorna il registro degli esposti
• Ogni lavoratore iscritto riceve copia della propria cartella
• In caso di cessazione dell'attività: il registro è consegnato all'INAIL e all'organo di vigilanza
• La sorveglianza sanitaria continua DOPO la cessazione dell'esposizione (follow-up a lungo termine)

5. AMIANTO — NORMATIVA SPECIFICA (Art. 246-262)
• L'amianto è vietato in Italia dal 1992 (L. 257/1992)
• Può essere ancora presente in edifici costruiti prima del 1992
• Bonifica dell'amianto: eseguita solo da imprese specializzate (iscritte all'Albo)
• Piano di lavoro per la bonifica: comunicato all'ASL con 30 giorni di anticipo
• DPI obbligatori: tuta integrale monouso + maschera FFP3 o respiratore a pieno facciale
• Valore limite di esposizione: 0,1 fibre/cm³ (per 8 ore/giorno)

━━━ NOTE PER SETTORI SPECIFICI ━━━
🏗️ CANTIERI: silice cristallina (demolizioni, perforazioni), amianto (edifici pre-1992), IPA (asfalto a caldo).
🏭 INDUSTRIA MANIFATTURIERA: polveri di legno duro, solventi, cromo, formaldeide.
🏥 SANITÀ: farmaci chemioterapici (preparazione e somministrazione), formaldeide nei laboratori.
🏭 LOGISTICA: rischio limitato ma presente in magazzini con prodotti chimici o con strutture in amianto.`, en:`OFFICIAL CURRICULUM MODULE C — MANAGEMENT UNIT 3
(State-Regions Agreement 26/01/2006 — Duration: 4 hours — RSPP only)

━━━ TRAINING CONTENT ━━━

1. COMMUNICATION IN H&S
The RSPP as communication facilitator:
• H&S information must reach ALL workers in a clear and timely manner
• Multilingual communication: adapt information to different nationalities
• Communication channels: posters, bulletin boards, email, toolbox talks, individual meetings

2. TRAINING NEEDS ANALYSIS (TNA)
Steps for the RSPP:
1. Identify roles requiring H&S training (all employees including new hires)
2. Assess training already received vs. what is required
3. Plan training sessions by risk level and ATECO group
4. Select suitable trainers and methodologies
5. Record training and evaluate effectiveness

3. PLANNING AND IMPLEMENTING H&S TRAINING
• Annual training plan: aligned with the DVR and identified needs
• Teaching methods: classroom, practical, e-learning (limitations for manual tasks)
• Evaluation: exit tests, practical assessment, pre/post comparison
• Documentation: attendance records, test results, trainer qualifications

4. CONSULTATION AND PARTICIPATION OF WORKERS (Art. 50)
The RLS as a key partner for the RSPP:
• The RSPP should consult the RLS at every significant stage of H&S management
• Periodic meeting (Art. 35): opportunity for consultation and joint planning
• Active participation of workers: suggestion boxes, near-miss reporting

5. COORDINATION WITH EXTERNAL SUBJECTS
The RSPP interfaces with:
• INAIL: reporting, funding, prevention incentive calls (OT23)
• Local Health Authority (ASL/ATS): inspections, occupational disease notifications
• Fire Brigade: fire safety checks, drills
• Labour Inspectorate (INL): accident inspections, administrative sanctions
• Notified bodies: machinery checks, pressure equipment

6. H&S BUDGET MANAGEMENT
Cost-benefit analysis for prevention:
• Rule: €1 spent on prevention saves €3-5 in accident costs
• INAIL OT23 incentive: up to 28% reduction in INAIL contribution for companies investing in prevention
• How to apply for OT23: online application by 28 February each year
• Eligible interventions: PPE, safety training, ergonomics, technological investments

━━━ LEGAL REFERENCES ━━━
• D.Lgs. 81/2008, Art. 35, 36, 37, 50
• INAIL OT23 Guidelines (annual update)
• State-Regions Agreement 21/12/2011 (training)`},

      ans:1,exp:{it:'Art. 243: il registro degli esposti deve riportare per ogni lavoratore: l\'attività lavorativa svolta, l\'agente cancerogeno o mutageno utilizzato, il livello di esposizione accertato e il periodo di esposizione. Il registro è inviato all\'INAIL e all\'organo di vigilanza.',en:'Art. 243: the register of exposed workers must record for each worker: the work activity performed, the carcinogenic or mutagenic agent used, the ascertained exposure level and the exposure period. The register is sent to INAIL and the supervisory authority.'}}

{id:'C4',cat:'C',order:4,icon:'😰',hrs:3,
   title:{it:'Stress Lavoro-Correlato',en:'Work-Related Stress',fa:'استرس مرتبط با کار'},
   sub:{it:'Art. 28 · Accordo Europeo 2004 · Metodo INAIL',en:'Art. 28 · European Agreement 2004 · INAIL Method'},
   arts:['Art. 28','Art. 29'],
   sum:{
     it:`Obbligo normativo (Art. 28 c.1): la valutazione dei rischi deve riguardare TUTTI i rischi, incluso "quello collegato allo stress lavoro-correlato, secondo i contenuti dell'Accordo europeo dell'8 ottobre 2004".

Definizione (Accordo Europeo 8/10/2004): lo stress è una condizione accompagnata da sofferenze o disfunzioni fisiche, psicologiche o sociali, che si producono quando le persone non si sentono in grado di rispondere alle richieste o alle aspettative nei loro confronti.

Indicatori di stress (Accordo 2004):
• Indicatori sentinella: elevato assenteismo, turn-over elevato, elevato numero di infortuni e incidenti, conflitti interpersonali frequenti, ricorsi frequenti al MC
• Fattori di contenuto del lavoro: carico di lavoro, orario, ambiente fisico, autonomia, varietà dei compiti
• Fattori di contesto del lavoro: cultura organizzativa, ruolo nella struttura, sviluppo di carriera, relazioni interpersonali, interfaccia casa-lavoro

Metodo di valutazione INAIL (Circolare Min. Lavoro 18/11/2010 + aggiornamento 2017):
FASE 1 — Valutazione preliminare (obbligatoria per tutti):
  • 4 gruppi di indicatori oggettivi e verificabili: eventi sentinella, fattori di contenuto del lavoro, fattori di contesto del lavoro, comportamenti/stili di vita
  • Se il risultato è BASSO: si adottano misure di miglioramento e si monitora nel tempo
  • Se il risultato è MEDIO o ALTO: si procede obbligatoriamente alla Fase 2

FASE 2 — Valutazione approfondita (solo se necessario):
  • Coinvolgimento diretto dei lavoratori tramite questionari validati e/o focus group
  • Identificazione delle azioni correttive specifiche

Soggetti coinvolti: RSPP, MC (obbligatorio il suo coinvolgimento nella valutazione), RLS/RLST, eventualmente consulenti psicologi del lavoro.

Differenza fondamentale: lo stress non è una malattia ma un rischio da valutare e gestire come tutti gli altri rischi prevenzionistici.`,
     en:`Legal obligation (Art. 28 c.1): risk assessment must cover ALL risks, including "that connected to work-related stress, according to the contents of the European Agreement of 8 October 2004".

Definition (European Agreement 8/10/2004): stress is a condition accompanied by physical, psychological or social suffering or dysfunctions, which arise when people feel unable to meet demands or expectations placed on them.

Stress indicators (Agreement 2004):
• Sentinel indicators: high absenteeism, high turnover, high number of accidents and incidents, frequent interpersonal conflicts, frequent appeals to MC
• Work content factors: workload, working hours, physical environment, autonomy, task variety
• Work context factors: organizational culture, role in structure, career development, interpersonal relations, home-work interface

INAIL assessment method (Min. of Labour Circular 18/11/2010 + 2017 update):
PHASE 1 — Preliminary assessment (mandatory for all):
  • 4 groups of objective and verifiable indicators: sentinel events, work content factors, work context factors, behaviours/lifestyles
  • If result is LOW: improvement measures adopted and monitored over time
  • If result is MEDIUM or HIGH: Phase 2 is mandatory

PHASE 2 — In-depth assessment (only if necessary):
  • Direct worker involvement through validated questionnaires and/or focus groups
  • Identification of specific corrective actions

Persons involved: RSPP, MC (involvement in assessment is mandatory), RLS/RLST, possibly occupational psychology consultants.

Key distinction: stress is not a disease but a risk to be assessed and managed like all other preventive risks.`
