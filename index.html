   curr:{it:`PROGRAMMA UFFICIALE MODULO A — UNITÀ DIDATTICA 1
(Accordo Stato-Regioni 26/01/2006 — Durata: 3 ore)

━━━ CONTENUTI FORMATIVI OBBLIGATORI ━━━

1. IL SISTEMA LEGISLATIVO IN MATERIA DI SICUREZZA
• L'evoluzione storica della normativa: dal D.P.R. 547/1955 al D.Lgs. 626/1994 fino al D.Lgs. 81/2008
• Il Testo Unico Sicurezza (D.Lgs. 81/2008): struttura, titoli e allegati
• Abrogazione del D.Lgs. 626/1994 e unificazione di oltre 20 normative previgenti
• Entrata in vigore: 15 maggio 2008
• Il D.Lgs. 106/2009: decreto correttivo e integrativo

2. CAMPO DI APPLICAZIONE (Art. 3)
• Applicazione universale: tutti i settori privati e pubblici
• Tutte le tipologie di rischio, senza esclusioni di categoria
• Estensione ai lavoratori autonomi (Art. 21), ai soci di cooperative, ai tirocinanti
• Settori speciali: Forze Armate, Polizia, Vigili del Fuoco — applicazione con adattamenti

3. PRINCIPI GENERALI E FINALITÀ (Art. 1)
• Principio di massima sicurezza tecnologicamente fattibile
• Conformità all'articolo 117 della Costituzione
• Uniformità della tutela su tutto il territorio nazionale
• Rispetto delle direttive europee in materia di salute e sicurezza

4. DEFINIZIONI FONDAMENTALI (Art. 2)
• Lavoratore: chi svolge attività lavorativa nell'ambito di un'organizzazione
• Datore di lavoro (DL): soggetto titolare del rapporto di lavoro con poteri decisionali e di spesa
• Dirigente: attua le direttive del DL, organizza e vigila
• Preposto: sovrintende l'attività e garantisce l'attuazione degli obblighi
• RSPP: Responsabile del Servizio di Prevenzione e Protezione
• ASPP: Addetto al Servizio di Prevenzione e Protezione
• RLS: Rappresentante dei Lavoratori per la Sicurezza
• Medico Competente (MC): medico nominato per la sorveglianza sanitaria
• Rischio: probabilità di raggiungimento del danno
• Pericolo: proprietà intrinseca di causare danno
• Prevenzione: misure per evitare o ridurre i rischi

5. OBBLIGHI NON DELEGABILI DEL DATORE DI LAVORO (Art. 17)
• Valutazione di TUTTI i rischi e redazione del Documento di Valutazione dei Rischi (DVR)
• Designazione del Responsabile del SPP (RSPP)
⚠️ ATTENZIONE: questi 2 obblighi non possono essere delegati ad altri soggetti, MAI
• Tutti gli altri obblighi (formazione, DPI, sorveglianza sanitaria, emergenze) sono delegabili per iscritto

6. COMPUTO DEI LAVORATORI (Art. 4)

• Rilevanza del computo: determina gli obblighi specifici (es. numero RLS, SPP interno/esterno)

━━━ COLLEGAMENTO CON SETTORI SPECIFICI ━━━

🏥 Sanità: soggetta a disposizioni specifiche per rischio biologico e radiologico.
🚛 Trasporti: disposizioni speciali per conducenti professionali (vibrazioni, stress da guida).

━━━ RIFERIMENTI NORMATIVI ━━━
• D.Lgs. 81/2008, Art. 1, 2, 3, 4, 17

• Accordo Stato-Regioni 26/01/2006 (formazione ASPP/RSPP)`, en:`OFFICIAL CURRICULUM MODULE A — TEACHING UNIT 1
(State-Regions Agreement 26/01/2006 — Duration: 3 hours)

━━━ MANDATORY TRAINING CONTENT ━━━

1. THE LEGISLATIVE SYSTEM ON SAFETY
• Historical evolution of legislation: from D.P.R. 547/1955 to D.Lgs. 626/1994 through to D.Lgs. 81/2008
• The Consolidated Safety Act (D.Lgs. 81/2008): structure, titles and annexes
• Repeal of D.Lgs. 626/1994 and consolidation of 20+ previous regulations
• Entry into force: 15 May 2008
• D.Lgs. 106/2009: corrective and supplementary decree

2. SCOPE OF APPLICATION (Art. 3)
• Universal application: all private and public sectors
• All types of risk, without category exclusions
• Extension to self-employed workers (Art. 21), cooperative members, trainees
• Special sectors: Armed Forces, Police, Fire Brigade — application with adaptations

3. GENERAL PRINCIPLES AND PURPOSE (Art. 1)
• Principle of maximum technologically feasible safety
• Compliance with Article 117 of the Constitution
• Uniformity of protection across the national territory
• Compliance with European health and safety directives

4. KEY DEFINITIONS (Art. 2)
• Worker: anyone performing work within an organisation
• Employer (DL): the party holding the employment relationship with decision-making and spending powers
• Manager: implements the employer's directives, organises and supervises
• Supervisor: oversees the activity and ensures implementation of obligations
• RSPP: Head of the Prevention and Protection Service
• ASPP: Member of the Prevention and Protection Service
• RLS: Workers' Safety Representative
• Occupational Physician (MC): physician appointed for health surveillance
• Risk: probability of harm being realised
• Hazard: intrinsic property to cause harm
• Prevention: measures to avoid or reduce risks

5. NON-DELEGABLE EMPLOYER DUTIES (Art. 17)
• Assessment of ALL risks and preparation of the Risk Assessment Document (DVR)
• Designation of the Head of the SPP (RSPP)
⚠️ IMPORTANT: these 2 obligations can NEVER be delegated to others
• All other obligations (training, PPE, health surveillance, emergencies) may be delegated in writing

6. WORKER COUNT (Art. 4)
• Not counted: family collaborators, trainees, school students
• Part-time and agency workers: counted based on hours actually worked (on a six-monthly basis)
• Relevance of the count: determines specific obligations (e.g. number of RLS, internal/external SPP)

━━━ SECTOR-SPECIFIC CONNECTIONS ━━━
🏭 Logistics/Warehouse: D.Lgs. 81/08 applies in full; forklift operators, warehouse workers and handling staff are "workers" in every respect.
🏗️ Construction sites: application with the specifics of Title IV (safety coordinators).
🏥 Healthcare: subject to specific provisions for biological and radiological risk.
🚛 Transport: special provisions for professional drivers (vibrations, driving stress).

━━━ LEGAL REFERENCES ━━━
• D.Lgs. 81/2008, Art. 1, 2, 3, 4, 17
• D.Lgs. 106/2009 (corrective decree)
• Law 3 August 2007, No. 123 (delegation)
• State-Regions Agreement 26/01/2006 (ASPP/RSPP training)`},

     en:`Employer (Art. 17-18): NON-delegable = DVR + RSPP appointment. Delegable: training, PPE, prevention measures, health surveillance, emergencies.

   curr:{it:`PROGRAMMA UFFICIALE MODULO A — UNITÀ DIDATTICA 2
(Accordo Stato-Regioni 26/01/2006 — Durata: 4 ore)

━━━ CONTENUTI FORMATIVI OBBLIGATORI ━━━

1. IL DATORE DI LAVORO (Art. 17-18)
• Obblighi NON delegabili: DVR + nomina RSPP
• Obblighi delegabili (solo per iscritto con indicazione delle funzioni): formazione, informazione, DPI, misure di prevenzione e protezione, sorveglianza sanitaria, piano di emergenza
• Responsabilità penale e amministrativa in caso di inadempimento
• Possibilità di delega di funzioni (Art. 16): deve essere scritta, accettata per iscritto, con adeguate risorse, pubblicizzata

2. IL DIRIGENTE (Art. 18)
• Chi è: persona con competenze professionali e poteri gerarchici/funzionali
• Attua le direttive del DL organizzando le risorse e vigilando
• Ha gli stessi obblighi del DL in quanto applicabili alla sua posizione
• Risponde delle violazioni in materia di sicurezza nell'ambito delle proprie deleghe

3. IL PREPOSTO (Art. 19)
• Chi è: sovrintende all'attività lavorativa e garantisce l'attuazione delle direttive
• Obblighi specifici:
  - Verificare che i lavoratori abbiano ricevuto formazione e informazione adeguata
  - Verificare che i lavoratori usino correttamente i DPI
  - Segnalare le non conformità al DL o al dirigente
  - ⭐ INTERROMPERE IMMEDIATAMENTE l'attività in caso di pericolo grave e immediato
  - NON attendere autorizzazione del DL per interrompere il lavoro pericoloso
  - Richiedere l'osservanza delle misure di prevenzione

4. I LAVORATORI (Art. 20)
• Obblighi:
  - Prendersi cura della propria salute e sicurezza e di quella delle persone intorno
  - Usare correttamente attrezzature, sostanze, DPI e impianti
  - Segnalare immediatamente condizioni di pericolo al preposto o DL
  - Non rimuovere o modificare dispositivi di sicurezza
  - Non eseguire operazioni non autorizzate o pericolose
  - Sottoporsi alla sorveglianza sanitaria
  - Partecipare ai programmi di formazione

5. IL SERVIZIO DI PREVENZIONE E PROTEZIONE — SPP (Art. 31-33)
• Obbligatorio in OGNI azienda (interno o esterno)
• Compiti del SPP (Art. 33):
  - Individuazione dei fattori di rischio
  - Elaborazione DVR e misure preventive
  - Elaborazione procedure di sicurezza per le varie attività
  - Informazione e formazione dei lavoratori
  - Partecipazione alle riunioni periodiche

6. L'RSPP — RESPONSABILE SPP (Art. 31-33)
• Nominato dal DL (obbligo NON delegabile)
• Requisiti professionali (Art. 32): titolo di studio + percorso formativo specifico
• Formazione obbligatoria: Modulo A (28h) + Modulo B (12-68h settoriale) + Modulo C (24h)
• Aggiornamento: 40h ogni 5 anni

7. L'ASPP — ADDETTO SPP
• Fa parte del SPP, collabora con l'RSPP
• Formazione: Modulo A (28h) + Modulo B (12-68h settoriale)
• NON deve seguire il Modulo C (riservato all'RSPP)

8. IL DATORE DI LAVORO COME RSPP (Art. 34)
• Il DL può svolgere personalmente i compiti di RSPP se:
  - L'azienda ha fino a 30 addetti (10 in certi settori)
  - Frequenta il Modulo A + Modulo B specifico per il settore ATECO
• Non è necessario il Modulo C

9. IL RLS — RAPPRESENTANTE LAVORATORI SICUREZZA (Art. 47-50)
• Eletto o designato dai lavoratori
• Numero minimo: 1 RLS in aziende 1-200 lavoratori; 3 RLS in aziende >200
• Diritti (Art. 50):
  - Accesso a TUTTI i luoghi di lavoro
  - Consultazione e visione del DVR
  - Ricezione delle informazioni provenienti da enti di vigilanza
  - Partecipazione alla riunione periodica (Art. 35)
  - Ricorso alle autorità competenti se ritiene inadeguate le misure di sicurezza
  - Formazione specifica: 32h + aggiornamento 8h/anno
• Nessun potere sanzionatorio sui lavoratori

10. IL MEDICO COMPETENTE — MC (Art. 25, 38-41)
• Nominato dal DL quando è prevista la sorveglianza sanitaria
• Collabora alla valutazione dei rischi
• Effettua le visite mediche e rilascia i giudizi di idoneità alla mansione specifica
• Istituisce e aggiorna le cartelle sanitarie e di rischio (riservate)
• Partecipa alla riunione periodica
• Requisiti: specializzazione in medicina del lavoro o titoli equipollenti

11. LA RIUNIONE PERIODICA (Art. 35)
• Obbligatoria nelle aziende con >15 lavoratori, almeno una volta all'anno
• Partecipanti: DL/delegato, RSPP, MC (se nominato), RLS
• Argomenti: DVR, DUVRI, DPI, programmi formazione, statistiche infortuni

━━━ COLLEGAMENTO CON SETTORI SPECIFICI ━━━
🏭 Logistica/Magazzino: il preposto (es. capoturno, responsabile magazzino) ha l'obbligo di interrompere l'attività dei carrellisti in caso di pericolo (guasto al carrello, scaffali instabili, ecc.).
🏗️ Cantieri: il preposto corrisponde al capocantiere.
🏥 Sanità: il MC riveste ruolo cruciale per rischio biologico, radiazioni, stress.
🚛 Trasporti: l'autotrasportatore autonomo è spesso anche DL e lavoratore allo stesso tempo.`, en:`OFFICIAL CURRICULUM MODULE A — TEACHING UNIT 2
(State-Regions Agreement 26/01/2006 — Duration: 4 hours)

━━━ MANDATORY TRAINING CONTENT ━━━

1. THE EMPLOYER (Art. 17-18)
• NON-delegable obligations: DVR + RSPP appointment
• Delegable obligations (only in writing, specifying the functions): training, information, PPE, prevention and protection measures, health surveillance, emergency plan
• Criminal and administrative liability for non-compliance
• Possibility of delegation of functions (Art. 16): must be written, accepted in writing, with adequate resources, and published

2. THE MANAGER (Art. 18)
• Who they are: a person with professional skills and hierarchical/functional powers
• Implements employer directives by organising resources and supervising
• Has the same applicable obligations as the employer within their position
• Liable for safety violations within the scope of their delegated powers

3. THE SUPERVISOR — PREPOSTO (Art. 19)
• Who they are: oversees work activity and ensures directives are implemented
• Specific obligations:
  - Verify that workers have received adequate training and information
  - Verify that workers correctly use PPE
  - Report non-conformities to the employer or manager
  ⭐ IMMEDIATELY STOP the activity in case of serious and immediate danger
  - DO NOT wait for employer authorisation to stop hazardous work
  - Require compliance with prevention measures

4. WORKERS (Art. 20)
• Obligations:
  - Take care of their own health and safety and that of those around them
  - Correctly use equipment, substances, PPE and systems
  - Immediately report hazardous conditions to the supervisor or employer
  - Not remove or modify safety devices
  - Not carry out unauthorised or dangerous operations
  - Undergo health surveillance
  - Participate in training programmes

5. PREVENTION AND PROTECTION SERVICE — SPP (Art. 31-33)
• Mandatory in EVERY company (internal or external)
• SPP duties (Art. 33):
  - Identification of risk factors
  - Preparation of DVR and preventive measures
  - Development of safety procedures for various activities
  - Worker information and training
  - Participation in periodic meetings

6. THE RSPP — HEAD OF SPP (Art. 31-33)
• Appointed by the employer (NON-delegable obligation)
• Professional requirements (Art. 32): academic qualification + specific training path
• Mandatory training: Module A (28h) + Module B (12-68h sector-specific) + Module C (24h)
• Update: 40h every 5 years

7. THE ASPP — SPP MEMBER
• Part of the SPP, collaborates with the RSPP
• Training: Module A (28h) + Module B (12-68h sector-specific)
• Does NOT need to follow Module C (reserved for the RSPP)

8. THE EMPLOYER AS RSPP (Art. 34)
• The employer may personally carry out RSPP duties if:
  - The company has up to 30 employees (10 in certain sectors)
  - They complete Module A + the sector-specific Module B
• Module C is not required

9. THE RLS — WORKERS' SAFETY REPRESENTATIVE (Art. 47-50)
• Elected or designated by workers
• Minimum number: 1 RLS in companies with 1-200 workers; 3 RLS in companies >200
• Rights (Art. 50):
  - Access to ALL workplaces
  - Consultation and review of the DVR
  - Receipt of information from supervisory authorities
  - Participation in the periodic meeting (Art. 35)
  - Appeal to competent authorities if safety measures are deemed inadequate
  - Specific training: 32h + 8h/year update
• No sanctioning power over workers

10. THE OCCUPATIONAL PHYSICIAN — MC (Art. 25, 38-41)
• Appointed by the employer when health surveillance is required
• Collaborates on risk assessment
• Carries out medical examinations and issues fitness-for-duty judgments
• Establishes and updates health and risk records (confidential)
• Participates in the periodic meeting
• Requirements: specialisation in occupational medicine or equivalent qualifications

11. THE PERIODIC MEETING (Art. 35)
• Mandatory in companies with >15 workers, at least once a year
• Participants: employer/delegate, RSPP, MC (if appointed), RLS
• Topics: DVR, DUVRI, PPE, training programmes, accident statistics

━━━ SECTOR-SPECIFIC CONNECTIONS ━━━
🏭 Logistics/Warehouse: the supervisor (e.g. shift leader, warehouse manager) is obliged to stop forklift operators' activity in case of danger (forklift failure, unstable shelving, etc.).
🏗️ Construction: the supervisor corresponds to the site manager.
🏥 Healthcare: the MC plays a crucial role for biological risk, radiation, stress.
🚛 Transport: self-employed hauliers are often both employer and worker simultaneously.`},

   curr:{it:`PROGRAMMA UFFICIALE MODULO A — UNITÀ DIDATTICA 3
(Accordo Stato-Regioni 26/01/2006 — Durata: 4 ore)

━━━ CONTENUTI FORMATIVI OBBLIGATORI ━━━

1. LA VALUTAZIONE DEI RISCHI — PRINCIPI GENERALI (Art. 28)
• Obbligo del DL di valutare TUTTI i rischi per la salute e la sicurezza
• La VdR deve riguardare:
  - Tutti i rischi per la salute e sicurezza (fisici, chimici, biologici, ergonomici, organizzativi)
  - Rischio da stress lavoro-correlato (Accordo europeo 8/10/2004)
  - Rischi connessi alle lavoratrici in stato di gravidanza (D.Lgs. 151/2001)
  - Rischi connessi alle differenze di genere, età, provenienza geografica
  - Rischi connessi alla tipologia contrattuale
• Principio di priorità: eliminare il rischio, se non possibile ridurlo al minimo

2. CONTENUTI OBBLIGATORI DEL DVR (Art. 28 c.2)
Il Documento di Valutazione dei Rischi deve contenere:
a) Relazione sulla valutazione di tutti i rischi, con specificazione dei criteri adottati
b) Indicazione delle misure di prevenzione e di protezione adottate
c) Programma delle misure ritenute opportune per garantire il miglioramento nel tempo dei livelli di sicurezza
d) Individuazione delle procedure per l'attuazione delle misure da realizzare e dei ruoli dell'organizzazione aziendale che vi debbono provvedere
e) Indicazione del nominativo del RSPP, del RLS e del MC
f) Individuazione delle mansioni che eventualmente espongono i lavoratori a rischi specifici

3. REDAZIONE, FIRMA E DATA (Art. 29)
• Il DVR è redatto dal DL in collaborazione con RSPP e MC (ove nominato)
• Firmato da: DL + RSPP + MC (ove nominato)
• Con data certa (firma digitale, timbro postale, o notaio)
• ⚠️ La firma dell'RLS NON è richiesta per la validità giuridica
• Il DVR deve essere custodito presso l'azienda e disponibile per le ispezioni
• Nuove imprese: DVR entro 90 giorni dall'inizio dell'attività

4. AGGIORNAMENTO DEL DVR (Art. 29 c.3)
Il DVR va aggiornato in caso di:
• Modifiche significative al processo produttivo o all'organizzazione
• Infortuni significativi o incidenti con potenziale di infortunio grave
• Quando la sorveglianza sanitaria ne evidenzia la necessità
• Evoluzione della tecnica, della prevenzione e della protezione
• Acquisizione di nuove attrezzature o sostanze pericolose

5. METODOLOGIE DI VALUTAZIONE DEI RISCHI
• Metodo a matrice rischio (Probabilità × Danno): R = P × D
  - Probabilità (P): da 1 (improbabile) a 4 (quasi certa)
  - Danno (D): da 1 (lieve) a 4 (gravissimo)
  - Rischio R: da 1 (basso) a 16 (altissimo)
• Metodi quantitativi per rischi specifici (NIOSH per MMC, Movarisch per arti superiori)
• Checklist e sopralluoghi periodici
• Analisi storica degli infortuni e delle malattie professionali

6. IL DUVRI — DOCUMENTO UNICO VALUTAZIONE RISCHI DA INTERFERENZA (Art. 26)
• Obbligatorio quando il DL committente affida lavori a imprese appaltatrici o lavoratori autonomi
• Scopo: individuare i rischi da interferenza tra le attività di diverse imprese nello stesso luogo
• Chi lo redige: il DL committente
• Contenuto: misure di sicurezza per eliminare/ridurre i rischi da interferenza
• Non obbligatorio per: forniture di materiali senza installazione, servizi di natura intellettuale
• Nei cantieri edili il DUVRI è sostituito dal PSC (Piano di Sicurezza e Coordinamento)

7. LA GESTIONE DEI RISCHI — GERARCHIA DELLE MISURE (Art. 15)
Le misure di prevenzione e protezione si applicano nell'ordine:
1. Eliminazione del rischio alla fonte
2. Sostituzione con agenti/attrezzature meno pericolosi
3. Interventi strutturali (progettazione sicura degli ambienti)
4. Misure di protezione collettiva (barriere, aspiratori, ventilazione)
5. Misure di protezione individuale (DPI)
6. Informazione, formazione, addestramento dei lavoratori

━━━ COLLEGAMENTO CON SETTORI SPECIFICI ━━━
🏭 Logistica/Magazzino: il DVR deve includere specificatamente il rischio MMC (movimentazione manuale carichi), il rischio da carrelli elevatori, il rischio da caduta scaffali, il rischio da scivolamento su pavimenti bagnati.
🏗️ Cantieri: si aggiunge il PSC (Piano Sicurezza Coordinamento) redatto dal coordinatore per la progettazione.
🏥 Sanità: il DVR deve includere il rischio biologico (patogeni, aghi, ecc.) e il rischio da radiazioni ionizzanti.
🏢 Uffici: stress lavoro-correlato, VDT, ergonomia della postazione.`, en:`OFFICIAL CURRICULUM MODULE A — TEACHING UNIT 3
(State-Regions Agreement 26/01/2006 — Duration: 4 hours)

━━━ MANDATORY TRAINING CONTENT ━━━

1. RISK ASSESSMENT — GENERAL PRINCIPLES (Art. 28)
• Employer's obligation to assess ALL health and safety risks
• The risk assessment must cover:
  - All health and safety risks (physical, chemical, biological, ergonomic, organisational)
  - Work-related stress risk (European Agreement 8/10/2004)
  - Risks relating to pregnant workers (D.Lgs. 151/2001)
  - Risks relating to gender, age and geographical origin differences
  - Risks relating to type of employment contract
• Priority principle: eliminate the risk; if not possible, reduce it to a minimum

2. MANDATORY CONTENTS OF THE DVR (Art. 28 c.2)
The Risk Assessment Document must contain:
a) Report on the assessment of all risks, specifying the criteria adopted
b) Indication of the prevention and protection measures adopted
c) Programme of measures considered appropriate to improve safety levels over time
d) Identification of procedures for implementing the measures and the roles responsible
e) Name of the RSPP, RLS and MC
f) Identification of roles that may expose workers to specific risks

3. DRAFTING, SIGNING AND DATE (Art. 29)
• The DVR is drawn up by the employer in collaboration with the RSPP and MC (where appointed)
• Signed by: Employer + RSPP + MC (where appointed)
• With certified date (digital signature, postmark, or notary)
• ⚠️ RLS signature is NOT required for legal validity
• The DVR must be kept on company premises and available for inspections
• New companies: DVR within 90 days of starting operations

4. UPDATING THE DVR (Art. 29 c.3)
The DVR must be updated in the event of:
• Significant changes to the production process or organisation
• Significant accidents or incidents with potential for serious injury
• When health surveillance indicates the need
• Evolution of techniques, prevention and protection
• Acquisition of new equipment or hazardous substances

5. RISK ASSESSMENT METHODOLOGIES
• Risk matrix method (Probability × Harm): R = P × D
  - Probability (P): from 1 (unlikely) to 4 (almost certain)
  - Harm (D): from 1 (minor) to 4 (very serious)
  - Risk R: from 1 (low) to 16 (very high)
• Quantitative methods for specific risks (NIOSH for manual handling, OCRA/Movarisch for upper limbs)
• Checklists and periodic inspections
• Historical analysis of accidents and occupational diseases

6. DUVRI — SINGLE DOCUMENT FOR INTERFERENCE RISK ASSESSMENT (Art. 26)
• Mandatory when the client employer entrusts work to contractors or self-employed workers
• Purpose: to identify interference risks between the activities of different companies in the same workplace
• Who drafts it: the client employer
• Content: safety measures to eliminate/reduce interference risks
• Not mandatory for: material supplies without installation, intellectual services
• On construction sites the DUVRI is replaced by the PSC (Safety and Coordination Plan)

7. RISK MANAGEMENT — HIERARCHY OF MEASURES (Art. 15)
Prevention and protection measures are applied in order:
1. Elimination of the risk at source
2. Substitution with less hazardous agents/equipment
3. Structural interventions (safe design of environments)
4. Collective protection measures (barriers, extractors, ventilation)
5. Individual protection measures (PPE)
6. Worker information, training and instruction

━━━ SECTOR-SPECIFIC CONNECTIONS ━━━
🏭 Logistics/Warehouse: the DVR must specifically include MMC risk (manual handling of loads), forklift risk, shelving collapse risk, and slipping risk on wet floors.
🏗️ Construction: add the PSC (Safety Coordination Plan) drafted by the design-phase coordinator.
🏥 Healthcare: the DVR must include biological risk (pathogens, needles, etc.) and ionising radiation risk.
🏢 Offices: work-related stress, VDT use, ergonomics of the workstation.`},

   sum:{
     it:`Informazione (Art. 36): ogni lavoratore deve ricevere informazioni su rischi aziendali e specifici della propria mansione, procedure di emergenza/PS/antincendio, nominativi di RSPP/MC/RLS.

Formazione (Art. 37): formazione sufficiente e adeguata. Deve avvenire durante l'orario di lavoro, senza oneri economici per i lavoratori. Occasioni obbligatorie: assunzione, cambio mansione, nuove attrezzature, nuove sostanze pericolose.

Accordo Stato-Regioni 21/12/2011:
• Lavoratori rischio basso: 4h generali + 4h specifiche = 8h totali
• Lavoratori rischio medio: 4h + 8h = 12h totali
• Lavoratori rischio alto: 4h + 12h = 16h totali
• Preposti: percorso lavoratori + 8h specifiche aggiuntive
• Dirigenti: 16h (mod. A 6h + mod. B 10h)
• Aggiornamento obbligatorio: ogni 5 anni (6h per lavoratori e preposti)`,
     en:`Information (Art. 36): each worker must receive information on company and job-specific risks, emergency/first aid/fire procedures, names of RSPP/MC/RLS.

Training (Art. 37): sufficient and adequate training. Must occur during working hours, at no cost to workers. Mandatory occasions: hiring, job change, new equipment, new hazardous substances.

State-Regions Agreement 21/12/2011:
• Workers low risk: 4h general + 4h specific = 8h total
• Workers medium risk: 4h + 8h = 12h total
• Workers high risk: 4h + 12h = 16h total
• Supervisors: worker path + 8 additional specific hours
• Managers: 16h (mod. A 6h + mod. B 10h)
• Mandatory update: every 5 years (6h for workers and supervisors)`

   curr:{it:`PROGRAMMA UFFICIALE MODULO A — UNITÀ DIDATTICA 4
(Accordo Stato-Regioni 26/01/2006 — Durata: 3 ore)

━━━ CONTENUTI FORMATIVI OBBLIGATORI ━━━

1. INFORMAZIONE AI LAVORATORI (Art. 36)
Ogni lavoratore deve ricevere informazioni adeguate su:
• I rischi per la salute e sicurezza connessi all'attività dell'impresa in generale
• I rischi specifici cui è esposto in relazione alla propria mansione
• Le normative di sicurezza e le disposizioni aziendali in materia
• I pericoli connessi all'uso di sostanze e preparati pericolosi
• Le misure e le attività di protezione e prevenzione adottate
• Le procedure che riguardano il pronto soccorso, la lotta antincendio, l'evacuazione
• I nominativi dei lavoratori incaricati dell'applicazione delle misure di emergenza
• Il nominativo del RSPP e del MC

⚠️ DIFFERENZA CHIAVE:
• INFORMAZIONE = trasmettere conoscenze (comunicazione unidirezionale)
• FORMAZIONE = sviluppare competenze e comportamenti (processo educativo interattivo)
• ADDESTRAMENTO = acquisire praticamente l'uso di attrezzature e procedure

2. FORMAZIONE DEI LAVORATORI (Art. 37)
• La formazione deve essere sufficiente e adeguata
• Deve avvenire DURANTE L'ORARIO DI LAVORO
• NON può comportare oneri economici a carico dei lavoratori
• Occasioni obbligatorie per la formazione:
  - Al momento dell'assunzione
  - Al trasferimento o al cambio di mansione
  - All'introduzione di nuove attrezzature di lavoro
  - All'introduzione di nuove tecnologie
  - All'introduzione di nuove sostanze e agenti pericolosi
• Deve essere periodicamente ripetuta in relazione all'evoluzione dei rischi

3. ACCORDO STATO-REGIONI 21/12/2011 — FORMAZIONE LAVORATORI
Durata obbligatoria per i lavoratori (in base al rischio ATECO):
┌─────────────────┬──────────────┬──────────────┬──────────────┐
│ Livello rischio │ Generale (h) │ Specifico (h)│ TOTALE (h)   │
├─────────────────┼──────────────┼──────────────┼──────────────┤
│ BASSO           │      4       │      4       │      8       │
│ MEDIO           │      4       │      8       │     12       │
│ ALTO            │      4       │     12       │     16       │
└─────────────────┴──────────────┴──────────────┴──────────────┘
• Il modulo generale (4h) è UGUALE per tutti i livelli di rischio

ATECO rischio BASSO: commercio al dettaglio, studi professionali, servizi alla persona
ATECO rischio MEDIO: manifattura leggera, ristorazione, artigianato
ATECO rischio ALTO: costruzioni, industria chimica, logistica/magazzino, sanità

4. FORMAZIONE PREPOSTI
• Percorso lavoratori (in base al livello di rischio ATECO) +
• 8 ore aggiuntive specifiche per il ruolo di preposto, su:
  - Principali soggetti del sistema di prevenzione aziendale
  - Relazioni tra i vari soggetti interni/esterni del sistema di prevenzione
  - Definizione e individuazione dei fattori di rischio
  - Incidenti e infortuni mancati
  - Tecniche di comunicazione e sensibilizzazione
  - Valutazione dei rischi dell'azienda
  - Individuazione misure tecniche, organizzative e procedurali di prevenzione

5. FORMAZIONE DIRIGENTI
• 16 ore totali articolate in 4 moduli:
  - Modulo 1 (4h): giuridico-normativo
  - Modulo 2 (4h): gestione e organizzazione della sicurezza
  - Modulo 3 (4h): individuazione e valutazione dei rischi
  - Modulo 4 (4h): comunicazione, formazione, consultazione

6. FORMAZIONE RSPP E ASPP — ACCORDO S-R 26/01/2006
• Modulo A (28h): obbligatorio per tutti (ASPP e RSPP)
  - A1: Quadro normativo (3h)
  - A2: Figure della sicurezza (4h)
  - A3: Individuazione e valutazione dei rischi (4h)
  - A4: Comunicazione e formazione (3h)
  - A5: Dispositivi di protezione individuale (2h)
  - A6: Emergenze (2h)
  - A7: Salute e sicurezza: modalità di gestione (4h)
  - A8: Organizzazione del servizio (4h) — solo Modulo A completo
• Modulo B (12-68h): specifico per settore ATECO — per ASPP e RSPP
• Modulo C (24h): solo per RSPP (gestione, relazione, comunicazione)

7. AGGIORNAMENTO OBBLIGATORIO (Accordo S-R 21/12/2011)
• Lavoratori: 6h ogni 5 anni
• Preposti: 6h ogni 5 anni
• Dirigenti: 6h ogni 5 anni
• RSPP/ASPP: 40h ogni 5 anni (suddivise per moduli)

8. ACCORDO 59/CSR/2025 — AGGIORNAMENTO NORMATIVO
• Aggiorna progressivamente l'Accordo 2011
• Ore invariate per i lavoratori; contenuti aggiornati
• E-learning ammesso per moduli teorici; moduli pratici OBBLIGATORIAMENTE in presenza
• Formatori: requisiti aggiornati, obbligo di registrazione delle attività formative

━━━ COLLEGAMENTO CON SETTORI SPECIFICI ━━━
🏭 Logistica/Magazzino: settore ATECO a rischio ALTO → 4h generali + 12h specifiche (MMC, carrelli, cadute, DPI). La formazione per carrellisti è aggiuntiva (Accordo S-R 22/02/2012).
🏗️ Cantieri: rischio ALTO + formazione specifica per lavori in quota, demolizioni, ecc.
🏥 Sanità: rischio ALTO + formazione specifica per agenti biologici, radiazioni, stress.`, en:`OFFICIAL CURRICULUM MODULE A — TEACHING UNIT 4
(State-Regions Agreement 26/01/2006 — Duration: 4 hours)

━━━ MANDATORY TRAINING CONTENT ━━━

1. THE TRAINING OBLIGATION (Art. 37)
• Mandatory for ALL workers, including temporary/agency staff, at-home workers, and new hires
• Must be provided: at the start of the employment relationship or change of role
• Also when work organisation changes, new equipment or new technologies are introduced
• Training must be adapted to the specific risk of the role

2. INFORMATION OBLIGATION (Art. 36)
The employer must inform workers of:
• The risks for health and safety connected with work activity in general
• The specific risks connected to their role/tasks
• The measures adopted and the procedures for first aid, fire-fighting, evacuation
• The names of the RSPP, the emergency workers and the MC (where applicable)

3. TRAINING CONTENT FOR WORKERS (State-Regions Agreement 21/12/2011)
GENERAL PART (applicable to all workers):
• Legislative framework and institutional roles: 2 hours
• Risk concepts and assessment: 2 hours
SPECIFIC PART (differentiated by risk level):
• Low risk (ATECO macro-group A): 4 hours — total 6h
• Medium risk (ATECO macro-group B): 8 hours — total 12h
• High risk (ATECO macro-group C): 12 hours — total 16h

4. TRAINING FOR SUPERVISORS (preposti)
• Same path as workers (based on risk level)
• Plus 8 additional specific hours for the supervisory role:
  - Communication and team management techniques
  - Conflict management
  - Supervision and monitoring techniques
  - Reporting and documentation obligations

5. TRAINING FOR MANAGERS (dirigenti)
• 16-hour course covering:
  - Legislative and institutional framework
  - Risk concepts and assessment
  - Technical and organisational safety measures
  - Occupational health protection
• Mandatory update every 5 years (6 hours)

6. TRAINING FOR RSPP AND ASPP
• Module A (28 hours) — General framework
• Module B (12 to 68 hours) — Sector-specific
• Module C (24 hours) — Only for RSPP
• Update: 40 hours every 5 years (RSPP); 28h every 5 years (ASPP)

7. TRAINING TIMING AND DELIVERY (Art. 37)
• Must take place during working hours, at no cost to the worker
• Cannot be provided exclusively via e-learning for manual/practical activities
• Must be recorded in a specific register (training register)
• Trainers must have appropriate qualifications and experience

8. MANDATORY UPDATE (State-Regions Agreement 21/12/2011)
• Workers: every 5 years — 6 hours
• Supervisors: every 5 years — 6 hours
• Managers: every 5 years — 6 hours

━━━ SECTOR-SPECIFIC CONNECTIONS ━━━
🏭 Logistics/Warehouse: workers are in the HIGH RISK group (ATECO macro-group C) — 16h initial training + 6h every 5 years.
🏗️ Construction: high-risk group + specific requirements for site safety.
🏥 Healthcare: high-risk group with additional biological risk training modules.
🏢 Offices: low to medium risk group depending on specific tasks.`},

   sum:{
     it:`DPI (Art. 74): qualsiasi attrezzatura destinata ad essere indossata dal lavoratore per proteggerlo da uno o più rischi.

Gerarchia delle misure di prevenzione — i DPI sono SEMPRE l'ultima opzione:
1. Eliminazione del rischio alla fonte
2. Sostituzione con agenti meno pericolosi
3. Misure di protezione collettiva (recinzioni, aspiratori, ecc.)
4. DPI — solo se le precedenti misure sono insufficienti

Categorie DPI (Art. 76):
• Categoria I: rischi minimi (guanti giardinaggio, occhiali sole) — autodichiarazione fabbricante
• Categoria II: rischi intermedi (caschi, occhiali protettivi, guanti lavoro) — esame CE di tipo
• Categoria III: rischi gravi/mortali (imbracature, respiratori, anticaduta) — esame CE di tipo + sorveglianza produzione

Obblighi DL (Art. 77): fornire DPI adeguati al rischio specifico, marcati CE, istruire i lavoratori, garantire manutenzione.
Obblighi lavoratori (Art. 78): usare correttamente i DPI, averne cura, segnalare difetti al DL o preposto.

Segnaletica (Titolo V, Allegato XXV):
• Divieto: sfondo BIANCO, simbolo nero, banda/bordo ROSSO
• Avvertimento: triangolo GIALLO, simbolo nero
• Prescrizione: sfondo BLU, simbolo bianco
• Salvataggio/emergenza: sfondo VERDE, simbolo bianco`,
     en:`PPE (Art. 74): any equipment designed to be worn by workers to protect them from one or more risks.

Prevention measures hierarchy — PPE is ALWAYS the last option:
1. Risk elimination at source
2. Substitution with less hazardous agents
3. Collective protection measures (barriers, extractors, etc.)
4. PPE — only if previous measures are insufficient

PPE Categories (Art. 76):
• Category I: minimal risks (garden gloves, sunglasses) — manufacturer self-declaration
• Category II: intermediate risks (helmets, safety glasses, work gloves) — EC type-examination
• Category III: serious/fatal risks (harnesses, respirators, fall arrest) — EC type-exam + production surveillance

Employer obligations (Art. 77): provide PPE suited to specific risk, CE-marked, train workers, ensure maintenance.
Worker obligations (Art. 78): use PPE correctly, take care of it, report defects to employer or supervisor.

Signage (Title V, Annex XXV):
• Prohibition: WHITE background, black symbol, RED border/band
• Warning: YELLOW triangle, black symbol
• Mandatory: BLUE background, white symbol
• Rescue/emergency: GREEN background, white symbol`
   },

   curr:{it:`PROGRAMMA UFFICIALE MODULO A — UNITÀ DIDATTICA 5
(Accordo Stato-Regioni 26/01/2006 — Durata: 2 ore + approfondimento 1 ora)

━━━ CONTENUTI FORMATIVI OBBLIGATORI ━━━

1. DEFINIZIONE DI DPI (Art. 74)
• Qualsiasi attrezzatura destinata ad essere indossata e tenuta dal lavoratore
• Scopo: proteggere da uno o più rischi suscettibili di minacciare la salute o la sicurezza
• Comprende: accessori e complementi destinati allo scopo
• NON sono DPI: indumenti di lavoro ordinari, attrezzature di pronto soccorso, DPC (colletivi)

2. GERARCHIA DELLE MISURE DI PREVENZIONE (Art. 15)
⚠️ I DPI occupano l'ULTIMO posto nella gerarchia:
1° Eliminazione del rischio alla fonte (misura più efficace)
2° Sostituzione con agenti o processi meno pericolosi
3° Misure di protezione collettiva (barriere, aspiratori, ventilazione forzata)
4° Misure organizzative (rotazione del personale, riduzione tempi esposizione)
5° DPI — SOLO se le precedenti misure sono insufficienti

3. CATEGORIE DI DPI (Art. 76 — Reg. UE 2016/425)
CATEGORIA I — Rischi minimi (progettati dal fabbricante):
• Guanti da giardinaggio, da cucina leggera
• Occhiali da sole non per uso professionale
• Certificazione: autodichiarazione del fabbricante

CATEGORIA II — Rischi intermedi (non I né III):
• Caschi protettivi per la testa (cantieri, logistica)
• Occhiali di protezione, visiere
• Guanti da lavoro (anti-taglio, anti-vibrazione)
• Scarpe antinfortunistiche (S1, S2, S3)
• Otoprotettori (cuffie, inserti auricolari)
• Certificazione: esame CE di tipo da organismo notificato

CATEGORIA III — Rischi gravi o mortali:
• Imbracature di sicurezza anticaduta (lavori in quota)
• Respiratori e dispositivi di protezione delle vie respiratorie
• Caschi per protezione da elettricità ad alta tensione
• Guanti per protezione chimica (agenti tossici, corrosivi)
• Occhiali per protezione da radiazioni ottiche
• Certificazione: esame CE di tipo + sorveglianza della produzione (verifica annuale)

4. OBBLIGHI DEL DATORE DI LAVORO (Art. 77)
• Fornire DPI adeguati al rischio specifico individuato nel DVR
• I DPI devono essere marcati CE e conformi al Reg. UE 2016/425
• Garantire la funzionalità e l'igiene dei DPI (manutenzione, sostituzione)
• Fornire istruzioni comprensibili per l'uso dei DPI
• Formare e addestrare i lavoratori all'uso corretto dei DPI
• Aggiornare la scelta dei DPI a seguito di modifiche del rischio

5. OBBLIGHI DEI LAVORATORI (Art. 78)
• Usare i DPI conformemente all'informazione e alla formazione ricevuta
• Avere cura dei DPI messi a loro disposizione
• Non apportare modifiche ai DPI
• Segnalare immediatamente qualsiasi difetto, inconveniente o evento
• Non rifiutarsi di usare i DPI obbligatori

6. SEGNALETICA DI SICUREZZA (Titolo V, Art. 161-166 — Allegato XXV)
SEGNALI DI DIVIETO (vietano un comportamento):
• Forma: circolare
• Sfondo: BIANCO
• Simbolo: NERO
• Bordo e banda: ROSSO
• Esempi: "Vietato fumare", "Vietato l'accesso ai non autorizzati"

SEGNALI DI AVVERTIMENTO (avvertono di un pericolo):
• Forma: triangolare
• Sfondo: GIALLO
• Simbolo: NERO
• Esempi: "Attenzione pericolo generico", "Materiale infiammabile"

SEGNALI DI PRESCRIZIONE (impongono un comportamento obbligatorio):
• Forma: circolare
• Sfondo: BLU
• Simbolo: BIANCO
• Esempi: "Obbligo di indossare il casco", "Obbligo guanti", "Obbligo scarpe antinf."

SEGNALI DI SALVATAGGIO / EMERGENZA:
• Forma: rettangolare o quadrata
• Sfondo: VERDE
• Simbolo: BIANCO
• Esempi: "Uscita di emergenza", "Pronto soccorso", "Doccia di emergenza"

SEGNALI ANTINCENDIO:
• Forma: rettangolare o quadrata
• Sfondo: ROSSO
• Simbolo: BIANCO
• Esempi: "Estintore", "Idrante", "Pulsante di allarme"

7. CRITERI DI SCELTA DEI DPI
• Adeguatezza al rischio valutato nel DVR
• Conformità ai requisiti del Reg. UE 2016/425
• Adattabilità alle condizioni esistenti sul luogo di lavoro
• Compatibilità con le esigenze ergonomiche e di salute del lavoratore
• Possibilità di adattamento alla morfologia del lavoratore

━━━ COLLEGAMENTO CON SETTORI SPECIFICI ━━━
🏭 Logistica/Magazzino: DPI tipici → scarpe antinf. S3 (anti-schiacciamento, anti-perforazione), guanti da lavoro Cat. II, otoprotettori (aree >85dB), giubbino ad alta visibilità (aree transito carrelli), casco se presenti cadute dall'alto.
🏗️ Cantieri: imbracature Cat. III (lavori in quota), casco, scarpe, guanti, otoprotettori.
🏥 Sanità: guanti in nitrile/lattice Cat. III per agenti biologici, maschere FFP2/FFP3.
🏭 Industria chimica: guanti chimici Cat. III, occhiali a tenuta, tute protettive.`, en:`OFFICIAL CURRICULUM MODULE A — TEACHING UNIT 5
(State-Regions Agreement 26/01/2006 — Duration: 2 hours + 1 hour supplement)

━━━ MANDATORY TRAINING CONTENT ━━━

1. DEFINITION OF PPE (Art. 74)
• Any equipment designed to be worn and held by the worker
• Purpose: to protect against one or more risks that could threaten health or safety
• Includes: accessories and add-ons designed for the purpose
• NOT PPE: ordinary work clothing, first-aid equipment, collective protection devices (CPE)

2. HIERARCHY OF PREVENTION MEASURES (Art. 15)
⚠️ PPE occupies the LAST place in the hierarchy:
1st Elimination of the risk at source (most effective measure)
2nd Substitution with less hazardous agents or processes
3rd Collective protection measures (barriers, extractors, forced ventilation)
4th Organisational measures (staff rotation, reduced exposure time)
5th PPE — ONLY if the previous measures are insufficient

3. PPE CATEGORIES (Art. 76 — EU Reg. 2016/425)
CATEGORY I — Minimal risks (designed by the manufacturer):
• Garden gloves, light kitchen gloves
• Non-professional sunglasses
• Certification: manufacturer's self-declaration

CATEGORY II — Intermediate risks (neither I nor III):
• Protective helmets for the head (construction, logistics)
• Safety glasses, face shields
• Work gloves (cut-resistant, anti-vibration)
• Safety footwear (S1, S2, S3)
• Hearing protectors (earmuffs, earplugs)
• Certification: EC type-examination by a notified body

CATEGORY III — Serious or fatal risks:
• Fall-arrest safety harnesses (work at height)
• Respirators and respiratory protective devices
• Helmets for protection from high-voltage electricity
• Gloves for chemical protection (toxic, corrosive agents)
• Goggles for protection from optical radiation
• Certification: EC type-examination + production surveillance (annual check)

4. EMPLOYER OBLIGATIONS (Art. 77)
• Provide PPE suited to the specific risk identified in the DVR
• PPE must be CE-marked and compliant with EU Reg. 2016/425
• Ensure functionality and hygiene of PPE (maintenance, replacement)
• Provide comprehensible instructions for PPE use
• Train and instruct workers on correct PPE use
• Update PPE selection following risk changes

5. WORKER OBLIGATIONS (Art. 78)
• Use PPE in accordance with the information and training received
• Take care of the PPE provided
• Not modify the PPE
• Immediately report any defect, inconvenience or event
• Not refuse to use mandatory PPE

6. SAFETY SIGNAGE (Title V, Art. 161-166 — Annex XXV)
PROHIBITION SIGNS (forbid a behaviour):
• Shape: circular
• Background: WHITE
• Symbol: BLACK
• Border and band: RED
• Examples: "No smoking", "Unauthorised persons forbidden"

WARNING SIGNS (warn of a hazard):
• Shape: triangular
• Background: YELLOW
• Symbol: BLACK
• Examples: "Caution — general hazard", "Flammable material"

MANDATORY SIGNS (impose mandatory behaviour):
• Shape: circular
• Background: BLUE
• Symbol: WHITE
• Examples: "Helmet must be worn", "Gloves mandatory", "Safety footwear mandatory"

RESCUE / EMERGENCY SIGNS:
• Shape: rectangular or square
• Background: GREEN
• Symbol: WHITE
• Examples: "Emergency exit", "First aid", "Emergency shower"

FIRE SAFETY SIGNS:
• Shape: rectangular or square
• Background: RED
• Symbol: WHITE
• Examples: "Fire extinguisher", "Hydrant", "Alarm button"

7. CRITERIA FOR PPE SELECTION
• Suitability for the risk assessed in the DVR
• Compliance with the requirements of EU Reg. 2016/425
• Adaptability to existing conditions in the workplace
• Compatibility with ergonomic and worker health requirements
• Possibility of adjustment to the worker's body shape

━━━ SECTOR-SPECIFIC CONNECTIONS ━━━
🏭 Logistics/Warehouse: typical PPE → S3 safety footwear (anti-crush, anti-penetration), Cat. II work gloves, hearing protectors (areas >85dB), high-visibility vest (forklift transit areas), helmet if overhead falls present.
🏗️ Construction: Cat. III harnesses (work at height), helmet, footwear, gloves, hearing protectors.
🏥 Healthcare: Cat. III nitrile/latex gloves for biological agents, FFP2/FFP3 masks.
🏭 Chemical industry: Cat. III chemical gloves, sealed goggles, protective suits.`},

  {id:'A6',cat:'A',order:6,icon:'🚨',hrs:2,
   title:{it:'Emergenze e Pronto Soccorso',en:'Emergencies & First Aid',fa:'اضطرار و کمک‌های اولیه'},
   sub:{it:'Art. 43-45 · D.M. 388/2003 · Piano di evacuazione',en:'Art. 43-45 · D.M. 388/2003 · Evacuation plan'},
   arts:['Art. 43','Art. 44','Art. 45'],
   sum:{
     it:`Misure di emergenza (Art. 43): il DL designa i lavoratori addetti all'antincendio, all'evacuazione e al pronto soccorso. Devono essere formati e in numero sufficiente.

Diritto di abbandono (Art. 44): il lavoratore che, in caso di pericolo grave, immediato e non evitabile, abbandona il posto di lavoro non può subire pregiudizio alcuno. Non può essere sanzionato disciplinarmente.

Primo soccorso (Art. 45): il DL adotta i provvedimenti necessari tenendo conto della natura dell'attività e delle dimensioni aziendali. Gli addetti ricevono formazione adeguata.

D.M. 388/2003 — Classificazione aziende:
• Gruppo A: attività con particolari rischi o >5 lavoratori esposti → 16h formazione + aggiornamento triennale (6h)
• Gruppo B: >3 lavoratori, non in A → 12h + aggiornamento triennale (4h)
• Gruppo C: ≤3 lavoratori, non in A → 6h + aggiornamento triennale (2h)

Piano di evacuazione: deve indicare vie di esodo, punti di raccolta, addetti alle emergenze, procedure per avvisare i soccorsi.`,
     en:`Emergency measures (Art. 43): employer designates workers assigned to fire-fighting, evacuation and first aid. They must be trained and sufficient in number.

Right to leave (Art. 44): a worker who, in case of serious, immediate and unavoidable danger, leaves the workplace cannot suffer any prejudice and cannot be disciplinarily sanctioned.

First aid (Art. 45): employer takes necessary measures based on nature of activity and company size. Designated workers receive adequate training.

D.M. 388/2003 — Company classification:
• Group A: activities with particular risks or >5 workers exposed → 16h training + triennial update (6h)
• Group B: >3 workers, not in A → 12h + triennial update (4h)
• Group C: ≤3 workers, not in A → 6h + triennial update (2h)

Evacuation plan: must indicate evacuation routes, assembly points, emergency staff, procedures to notify rescue services.`
   },

   curr:{it:`PROGRAMMA UFFICIALE MODULO A — UNITÀ DIDATTICA 6
(Accordo Stato-Regioni 26/01/2006 — Durata: 2 ore)

━━━ CONTENUTI FORMATIVI OBBLIGATORI ━━━

1. MISURE DI EMERGENZA (Art. 43)
Il DL deve predisporre un piano di gestione delle emergenze che comprende:
• Misure di pronto soccorso
• Misure di lotta antincendio
• Misure di evacuazione dei lavoratori
• Il piano deve essere adeguato alla natura dell'attività e alle dimensioni aziendali
• Deve prevedere i rapporti con i servizi pubblici di emergenza (118, VVF, ecc.)

2. DESIGNAZIONE DEGLI ADDETTI ALLE EMERGENZE (Art. 43 c.1)
• Il DL designa preventivamente i lavoratori incaricati di:
  - Attuazione misure di prevenzione incendi
  - Evacuazione e salvataggio
  - Primo soccorso
  - Gestione delle emergenze in genere
• Questi lavoratori NON possono rifiutare la designazione se non per giustificato motivo
• Devono essere in numero sufficiente e formati adeguatamente

3. DIRITTO DI ABBANDONO DEL POSTO DI LAVORO (Art. 44)
• Il lavoratore che abbandona il posto di lavoro in caso di pericolo grave, immediato e non evitabile:
  - NON può subire pregiudizio alcuno
  - NON può ricevere sanzioni disciplinari
  - NON può essere licenziato per questo motivo
• L'esonero vale anche se il lavoratore si è avvalso dei propri DPI
• Il pericolo deve essere: GRAVE + IMMEDIATO + NON EVITABILE

4. PRIMO SOCCORSO — D.M. 388/2003
Classificazione delle aziende per il primo soccorso:

GRUPPO A (attività a rischio elevato):
• Industrie insalubri di 1ª classe (art. 216 Testo Unico Sanitario)
• Industrie con >5 lavoratori esposti a rischi cancerogeni, biologici o chimici
• Industrie estrattive e cave
• Lavori in sotterraneo
• Formazione: 16 ore articolate in 3 moduli + aggiornamento 6h ogni 3 anni

GRUPPO B (aziende con >3 lavoratori non in Gruppo A):
• La maggior parte delle aziende manifatturiere medie
• Formazione: 12 ore + aggiornamento 4h ogni 3 anni

GRUPPO C (aziende con ≤3 lavoratori non in Gruppo A):
• Micro-imprese, studi professionali, commercio al dettaglio piccolo
• Formazione: 6 ore + aggiornamento 2h ogni 3 anni

5. CONTENUTO DELLA FORMAZIONE PER IL PRIMO SOCCORSO
Modulo 1 — Allertare il sistema di soccorso:
• Riconoscimento delle emergenze
• Come allertare il 118
• Informazioni da fornire al soccorso

Modulo 2 — Riconoscimento e intervento nelle emergenze:
• Arresto cardiaco e RCP (rianimazione cardio-polmonare)
• Utilizzo del defibrillatore automatico (DAE)
• Ostruzione delle vie aeree (manovra di Heimlich)
• Perdita di conoscenza
• Emorragie e ferite

Modulo 3 (solo Gruppo A) — Formazione complementare:
• Traumi e fratture
• Ustioni e congelamenti
• Intossicazioni e avvelenamenti
• Shock
• Lesioni agli occhi

6. IL PIANO DI EMERGENZA ED EVACUAZIONE
Deve contenere:
• Le vie di esodo e le uscite di emergenza (con planimetrie)
• I punti di raccolta
• I nominativi e le funzioni degli addetti alle emergenze
• Le procedure per dare l'allarme
• Le procedure per avvisare i soccorsi (118, VVF)
• Le procedure di evacuazione (ordine, percorsi, tempi)
• Modalità di prova periodica (almeno 1 volta l'anno)

7. PRESIDI SANITARI OBBLIGATORI (D.M. 388/2003)
• Aziende Gruppo A e B: CASSETTA DI PRONTO SOCCORSO completa
• Aziende Gruppo C (≤3 lavoratori): PACCHETTO DI MEDICAZIONE
• Contenuto minimo: guanti sterili, lacci emostatici, disinfettante, garze, cerotti, termometro, forbici, ecc.
• Il datore di lavoro garantisce la manutenzione e l'integrazione periodica dei presidi

━━━ COLLEGAMENTO CON SETTORI SPECIFICI ━━━
🏭 Logistica/Magazzino: tipicamente Gruppo A o B (dipende dal numero di lavoratori e dalla presenza di sostanze pericolose). Rischi tipici di emergenza: ribaltamento carrello elevatore, caduta scaffali, incendio pallet, schiacciamento da carichi. Piano di evacuazione fondamentale per la geometria dei magazzini (corsie, porte sezionali, ecc.).
🏗️ Cantieri: Gruppo A obbligatorio; il piano di emergenza deve aggiornato ad ogni variazione del cantiere.
🏥 Sanità: Gruppo A; presidi aggiuntivi per emergenze biologiche e radiologiche.`, en:`OFFICIAL CURRICULUM MODULE A — TEACHING UNIT 6
(State-Regions Agreement 26/01/2006 — Duration: 2 hours)

━━━ MANDATORY TRAINING CONTENT ━━━

1. EMERGENCY MEASURES (Art. 43)
The employer must set up an emergency management plan covering:
• First aid measures
• Fire-fighting measures
• Worker evacuation measures
• The plan must be suited to the nature of the activity and the company size
• It must provide for coordination with public emergency services (118, Fire Brigade, etc.)

2. DESIGNATING EMERGENCY WORKERS (Art. 43 c.1)
• The employer designates in advance the workers responsible for:
  - Implementing fire prevention measures
  - Evacuation and rescue
  - First aid
  - Emergency management in general
• These workers CANNOT refuse the designation without justified reason
• They must be sufficient in number and adequately trained

3. RIGHT TO LEAVE THE WORKPLACE (Art. 44)
• A worker who leaves the workplace in case of serious, immediate and unavoidable danger:
  - CANNOT suffer any prejudice
  - CANNOT receive disciplinary sanctions
  - CANNOT be dismissed for this reason
• The exemption also applies if the worker has used their PPE
• The danger must be: SERIOUS + IMMEDIATE + UNAVOIDABLE

4. FIRST AID — D.M. 388/2003
Company classification for first aid:

GROUP A (high-risk activities):
• First-class hazardous industries (Art. 216 Consolidated Health Act)
• Industries with >5 workers exposed to carcinogenic, biological or chemical risks
• Extractive industries and quarries
• Underground works
• Training: 16 hours in 3 modules + 6h update every 3 years

GROUP B (companies with >3 workers not in Group A):
• Most medium-sized manufacturing companies
• Training: 12 hours + 4h update every 3 years

GROUP C (companies with ≤3 workers not in Group A):
• Micro-enterprises, professional practices, small retail
• Training: 6 hours + 2h update every 3 years

5. FIRST AID TRAINING CONTENT
Module 1 — Alerting the emergency services:
• Recognising emergencies
• How to call 118
• Information to provide to emergency services

Module 2 — Recognising and managing emergencies:
• Cardiac arrest and CPR (cardiopulmonary resuscitation)
• Use of automated external defibrillator (AED)
• Airway obstruction (Heimlich manoeuvre)
• Loss of consciousness
• Bleeding and wounds

Module 3 (Group A only) — Supplementary training:
• Trauma and fractures
• Burns and frostbite
• Poisoning and intoxication
• Shock
• Eye injuries

6. THE EMERGENCY AND EVACUATION PLAN
Must contain:
• Evacuation routes and emergency exits (with floor plans)
• Assembly points
• Names and roles of emergency workers
• Alarm-raising procedures
• Procedures for notifying emergency services (118, Fire Brigade)
• Evacuation procedures (order, routes, timing)
• Periodic drill procedures (at least once a year)

7. MANDATORY FIRST AID SUPPLIES (D.M. 388/2003)
• Group A and B companies: full FIRST AID KIT
• Group C companies (≤3 workers): FIRST AID PACK
• Minimum contents: sterile gloves, tourniquets, disinfectant, gauze, plasters, thermometer, scissors, etc.
• The employer ensures periodic maintenance and restocking of supplies

━━━ SECTOR-SPECIFIC CONNECTIONS ━━━
🏭 Logistics/Warehouse: typically Group A or B (depends on number of workers and presence of hazardous substances). Typical emergency risks: forklift overturning, shelving collapse, pallet fire, crush injuries. Evacuation plan critical for warehouse geometry (aisles, sectional doors, etc.).
🏗️ Construction: Group A mandatory; emergency plan must be updated at every site change.
🏥 Healthcare: Group A; additional provisions for biological and radiological emergencies.`},

   sum:{
     it:`Sorveglianza sanitaria (Art. 41): obbligatoria solo nei casi previsti dalla legge (esposizione a rumore, vibrazioni, agenti chimici/biologici, MMC, VDT, lavoro notturno, ecc.). Non è universale.

Tipologie di visite mediche:
• Preventive: prima dell'assunzione o del cambio mansione
• Periodiche: per controllare lo stato di salute e l'idoneità nel tempo
• Su richiesta del lavoratore: se correlate ai rischi professionali (a giudizio del MC)
• In occasione del cambio mansione
• Alla cessazione del rapporto: per agenti cancerogeni e biologici

Giudizi di idoneità (Art. 41 c.6):
• Idoneo alla mansione specifica
• Idoneo con prescrizioni/limitazioni (temporanee o permanenti)
• Inidoneo temporaneo
• Inidoneo permanente

Ricorso (Art. 41 c.9): contro il giudizio del MC, sia il lavoratore che il DL possono ricorrere all'organo di vigilanza territorialmente competente entro 30 giorni.

Nomina MC (Art. 39): nominato dal DL quando è prevista la sorveglianza sanitaria. La cartella sanitaria e di rischio è riservata: il lavoratore ne può richiedere copia alla cessazione del rapporto.`,
     en:`Health surveillance (Art. 41): mandatory only in legally required cases (exposure to noise, vibration, chemical/biological agents, MMC, VDT, night work, etc.). Not universal.

Types of medical visits:
• Preventive: before hiring or job change
• Periodic: to monitor health status and fitness over time
• Upon worker request: if related to professional risks (at MC's judgment)
• Upon job change
• At end of employment: for carcinogenic and biological agents

Fitness judgments (Art. 41 c.6):
• Fit for specific duty
• Partially fit with restrictions/limitations (temporary or permanent)
• Temporarily unfit
• Permanently unfit

Appeal (Art. 41 c.9): against the MC's judgment, both worker and employer can appeal to the territorial supervisory authority within 30 days.

MC appointment (Art. 39): appointed by employer when health surveillance is required. Health and risk records are confidential: worker may request copy upon leaving.`
   },

   curr:{it:`PROGRAMMA UFFICIALE MODULO A — UNITÀ DIDATTICA 7
(Accordo Stato-Regioni 26/01/2006 — Durata: 3 ore)

━━━ CONTENUTI FORMATIVI OBBLIGATORI ━━━

1. LA SORVEGLIANZA SANITARIA — DEFINIZIONE E OBBLIGATORIETÀ (Art. 41)
• Insieme degli atti medici finalizzati alla tutela dello stato di salute e sicurezza
• È obbligatoria SOLO nei casi espressamente previsti dalla normativa
• NON è obbligatoria per tutti i lavoratori indiscriminatamente
• Esposizioni che obbligano alla sorveglianza sanitaria:
  - Rumore (LEX > 80 dB(A) — valore inferiore d'azione)
  - Vibrazioni (HAV > 2,5 m/s² o WBV > 0,5 m/s²)
  - Agenti chimici pericolosi
  - Agenti cancerogeni e mutageni
  - Agenti biologici
  - Movimentazione manuale dei carichi
  - Videoterminali (>20h/settimana)
  - Lavoro notturno
  - Radiazioni ottiche artificiali

2. TIPOLOGIE DI VISITE MEDICHE (Art. 41 c.2)
• Preventiva: prima dell'assunzione o dell'adibizione alla mansione
  → stabilisce l'idoneità del lavoratore alla mansione specifica
• Periodica: per controllare lo stato di salute nel tempo e l'idoneità continua
  → frequenza stabilita dal MC in base al rischio (di norma annuale, biennale o quinquennale)
• Su richiesta del lavoratore: se il MC la giudica correlata ai rischi professionali
• In occasione del cambio della mansione
• Alla cessazione del rapporto di lavoro: obbligatoria solo per agenti cancerogeni e biologici
  → il lavoratore riceve copia della cartella sanitaria e di rischio alla cessazione

3. GIUDIZI DI IDONEITÀ (Art. 41 c.6)
Il MC può emettere 4 tipi di giudizio:
1. IDONEO alla mansione specifica: nessuna limitazione
2. IDONEO CON PRESCRIZIONI/LIMITAZIONI:
   - Temporanee: per un periodo definito (es. convalescenza)
   - Permanenti: limitazioni strutturali (es. no carichi >15 kg, no turno notturno)
3. INIDONEO TEMPORANEO: per un periodo definito, poi rivalutazione
4. INIDONEO PERMANENTE: non può svolgere quella mansione in alcun modo

• Il giudizio viene comunicato per iscritto sia al DL che al lavoratore
• ⚠️ In caso di inidoneità permanente, il DL deve adibire il lavoratore ad altra mansione

4. RICORSO AVVERSO IL GIUDIZIO DEL MC (Art. 41 c.9)
• Sia il lavoratore che il DL possono fare ricorso
• L'organo competente è l'Organo di Vigilanza territorialmente competente (ASL/AUSL)
• Termine: entro 30 giorni dalla comunicazione del giudizio
• L'organo di vigilanza può confermare, modificare o annullare il giudizio

5. LA CARTELLA SANITARIA E DI RISCHIO (Art. 25 c.1 lett. c)
• Istituita e aggiornata dal MC per ogni lavoratore soggetto a sorveglianza
• È RISERVATA: il DL non può accedervi senza il consenso del lavoratore
• Il MC consegna al DL una relazione scritta sui risultati della sorveglianza (forma anonima aggregata)
• Il lavoratore può richiedere copia della propria cartella in qualsiasi momento
• Alla cessazione del rapporto: copia obbligatoria al lavoratore + comunicazione all'INAIL

6. NOMINA DEL MEDICO COMPETENTE (Art. 39)
• Nominato dal DL quando è prevista la sorveglianza sanitaria
• Requisiti: specializzazione in medicina del lavoro, o titoli equipollenti
• Può essere dipendente aziendale o consulente esterno
• Deve comunicare il proprio nominativo all'ASL
• Non può essere nominato il medico di base del lavoratore (conflitto di interesse)

7. COMPITI DEL MEDICO COMPETENTE (Art. 25)
• Collaborare con il DL e l'RSPP alla valutazione dei rischi
• Programmare ed effettuare la sorveglianza sanitaria
• Istituire e aggiornare le cartelle sanitarie e di rischio
• Consegnare al DL la relazione annuale (anonima) sull'andamento della sorveglianza
• Comunicare per iscritto i giudizi di idoneità al DL e al lavoratore
• Visitare gli ambienti di lavoro almeno una volta l'anno
• Partecipare alla riunione periodica (Art. 35)
• Comunicare le malattie professionali all'INAIL

━━━ COLLEGAMENTO CON SETTORI SPECIFICI ━━━
🏭 Logistica/Magazzino: sorveglianza obbligatoria per MMC (rachide), rumore (carrelli elevatori, nastri trasportatori), WBV per i carrellisti. Visita periodica solitamente annuale o biennale.
🏗️ Cantieri: silice cristallina, solventi, rumore, vibrazioni HAV (martelli pneumatici) → tutti richiedono sorveglianza.
🏥 Sanità: agenti biologici, radiazioni, stress → sorveglianza intensa e frequente.
🚛 Trasporti: vibrazione WBV per autotrasportatori, sorveglianza per guida notturna.`, en:`OFFICIAL CURRICULUM MODULE A — TEACHING UNIT 7
(State-Regions Agreement 26/01/2006 — Duration: 4 hours)

━━━ MANDATORY TRAINING CONTENT ━━━

1. HEALTH SURVEILLANCE — GENERAL PRINCIPLES (Art. 41)
• Mandatory when specifically provided for by D.Lgs. 81/08 or other legislative provisions
• May also be requested by the worker themselves
• Carried out by the Occupational Physician (MC) appointed by the employer

2. TYPES OF MEDICAL EXAMINATIONS (Art. 41 c.2)
a) PRE-EMPLOYMENT EXAMINATION: before assigning tasks involving health surveillance — establishes initial fitness
b) PERIODIC EXAMINATION: establishes fitness over time — frequency set by the MC or law
c) AFTER ABSENCE FROM WORK: absence >60 days for any reason — before return to work
d) AT THE WORKER'S REQUEST: if health deterioration may be linked to occupational risk
e) PRIOR TO DISMISSAL AND UPON TERMINATION: where specifically provided for by law
f) AT CHANGE OF ROLE: when the worker changes tasks involving health surveillance

3. FITNESS JUDGMENT (Art. 41 c.6)
The MC issues a judgment of:
• FITNESS: worker can carry out the task without restrictions
• FITNESS WITH PRESCRIPTIONS: fit for the task with specific limitations or adaptations
• TEMPORARY UNFITNESS: temporarily unfit for the specific task (with indication of duration)
• PERMANENT UNFITNESS: permanently unfit for the specific task

4. APPEAL AGAINST FITNESS JUDGMENT
• The worker OR the employer may appeal within 30 days
• Appeal to the competent authority (ASL — Local Health Authority)
• The appeal does not suspend the judgment

5. HEALTH AND RISK RECORDS (Art. 25 c.1)
• Established and updated by the MC for each worker
• Contain: medical examinations, exposure data, fitness judgments
• Strictly confidential — accessible only to the worker and the MC
• Kept for at least 10 years after work ends (40 years for carcinogen exposure)

6. MANDATORY HEALTH SURVEILLANCE CASES
Health surveillance is mandatory for exposure to:
• Chemical agents above action values (noise, vibrations, chemical substances)
• Biological agents (Group 2, 3 or 4 pathogens)
• Ionising radiation (under D.Lgs. 230/1995)
• Lead, asbestos (residual monitoring)
• Carcinogenic and mutagenic substances
• Night work (Art. 41 c.1)

7. BIOLOGICAL RISK (Title X, Art. 266-286)
• Classification of biological agents in 4 groups by risk
• Group 1: low individual and collective risk
• Group 2: moderate individual risk, low collective risk (e.g. Salmonella, Hepatitis B)
• Group 3: high individual risk, low collective risk (e.g. HIV, TB, SARS-CoV-2)
• Group 4: high individual and collective risk, no available therapy (e.g. Ebola)
• Measures: containment, appropriate PPE, health surveillance, vaccination where available

8. CARCINOGENIC AND MUTAGENIC AGENTS (Title IX, Art. 233-245)
• Substitution obligation: replace with less hazardous substances where technically possible
• Minimise exposure to the lowest level technically achievable
• Periodic biological monitoring
• 40-year retention of health records

━━━ SECTOR-SPECIFIC CONNECTIONS ━━━
🏭 Logistics/Warehouse: health surveillance mandatory for: noise >85dB (forklift beeps, loading/unloading noise), whole-body vibrations (forklift operators — Art. 202), manual handling of loads (Art. 167-168).
🏗️ Construction: silica, asbestos (in remediation), vibrations from power tools.
🏥 Healthcare: biological risk Group 2/3, ionising radiation, anaesthetic gases, night work.
🏢 Offices: surveillance for VDT workers (>20h/week at screen) — periodic eye examination.`},

   sum:{
     it:`Il Titolo II (Art. 62-68) stabilisce i requisiti minimi per i luoghi di lavoro.

Requisiti principali (Allegato IV):
• Altezza minima: 3 m (2,70 m per uffici; 2,50 m con deroga prefettizia)
• Cubatura minima: 10 m³ per lavoratore
• Superficie minima: 2 m² per lavoratore
• Illuminazione: naturale preferibile; artificiale integrativa se necessario
• Temperatura: adeguata alla stagione e al tipo di lavoro; protezione da eccessi

Vie di circolazione (Allegato IV):
• Larghezza minima per pedoni: 80 cm
• Corridoi con traffico misto pedoni+veicoli: larghezza adeguata ai mezzi + margine sicurezza
• Separazione obbligatoria tra percorsi pedonali e corsie veicoli

Specifico per magazzini (contesto logistico):
• Segnalazione a terra delle corsie pedonali (colore giallo)
• Protezioni agli angoli e strutture scaffali (bugnature, protezioni laterali)
• Sistemi di ancoraggio e fissaggio delle scaffalature al suolo
• Vie di uscita sgombere, segnalate, sempre accessibili dall'interno`,
     en:`Title II (Art. 62-68) sets minimum requirements for workplaces.

Main requirements (Annex IV):
• Minimum height: 3m (2.70m for offices; 2.50m with prefecture exemption)
• Minimum volume: 10 m³ per worker
• Minimum surface area: 2 m² per worker
• Lighting: natural preferred; supplementary artificial if needed
• Temperature: appropriate for season and work type; protection from extremes

Circulation routes (Annex IV):
• Minimum width for pedestrians: 80cm
• Mixed pedestrian+vehicle corridors: width adequate for vehicles + safety margin
• Mandatory separation between pedestrian routes and vehicle lanes

Specific to warehouses (logistics context):
• Ground marking of pedestrian lanes (yellow color)
• Corner and shelf structure protection (rubber guards, lateral guards)
• Shelf anchoring and fixing systems to floor
• Emergency exits clear, signposted, always accessible from inside`

   curr:{it:`PROGRAMMA UFFICIALE MODULO B — UNITÀ SPECIFICA
Settore: GENERICO (tutti i settori — con note specifiche)
Argomento: Luoghi di Lavoro
(Accordo Stato-Regioni 26/01/2006 — Durata variabile per settore ATECO)

━━━ CONTENUTI FORMATIVI ━━━

1. DEFINIZIONE DI LUOGO DI LAVORO (Art. 62)
• I luoghi destinati a ospitare posti di lavoro, ubicati all'interno dell'azienda o dell'unità produttiva
• Comprende: qualsiasi altro luogo accessibile al lavoratore nell'ambito del proprio lavoro
• Esclusi: mezzi di trasporto, cantieri temporanei o mobili, industrie estrattive

2. REQUISITI MINIMI — ALLEGATO IV DEL D.LGS. 81/08

DIMENSIONI:
• Altezza minima dei locali: 3,00 m
• Riduzione a 2,70 m per gli uffici e locali destinati a ufficio
• Ulteriore riduzione a 2,50 m con autorizzazione dell'organo di vigilanza (prefettura)
• Cubatura minima: 10 m³ per lavoratore
• Superficie minima: 2 m² per lavoratore

ILLUMINAZIONE:
• Preferenza per l'illuminazione naturale (finestre, lucernari)
• Integrazione con illuminazione artificiale quando insufficiente
• Illuminazione di sicurezza obbligatoria per le vie di esodo (autonomia minima 1h)
• Livelli minimi lux per tipo di attività (norma UNI EN 12464)

TEMPERATURA:
• Adeguata alla stagione e al tipo di lavoro svolto
• Protezione contro le correnti d'aria e le temperature eccessive
• Posti di lavoro all'aperto: protezioni adeguate contro intemperie e freddo

AERAZIONE:
• Ricambio d'aria sufficiente per evitare gas nocivi e odori
• Impianti di aerazione devono essere facilmente controllabili e pulibili

PAVIMENTI:
• Stabili, antisdrucciolevoli, privi di cavità o buche pericolose
• Mantenuti in condizioni di sicurezza
• Raccolta delle acque reflue con sistemi idonei

3. VIE DI CIRCOLAZIONE E USCITE (Allegato IV)
• Larghezza minima per percorsi pedonali: 80 cm (preferibilmente 120 cm)
• Corridoi con traffico misto pedoni + veicoli: larghezza sufficiente per i veicoli + margine di sicurezza laterale
• Separazione obbligatoria tra percorsi pedonali e corsie di transito veicolare (segnatura a terra)
• Le vie di circolazione esterne devono essere segnalate e sgombre

4. VIE E USCITE DI EMERGENZA (Allegato IV)
• Sempre sgombre da ostacoli in qualsiasi momento
• Apribili dall'interno senza chiave (maniglione antipanico o dispositivo equivalente)
• Segnalate con segnaletica di salvataggio (sfondo verde, simbolo bianco)
• Illuminate anche in caso di mancanza di energia
• Porte scorrevoli e girevoli: NON possono essere vie di emergenza
• Numero sufficiente in rapporto alle dimensioni e all'affollamento

5. PORTE E PORTONI (Allegato IV)
• Le porte apribili nei due sensi devono essere trasparenti o avere pannello visivo
• I portoni che si aprono verso il basso o a vaivole devono avere sistema di blocco
• Porte per i pedoni obbligatorie accanto ai portoni industriali se i portoni non sono sicuri per i pedoni
• I portoni a movimento meccanico devono avere sistema di arresto di emergenza

6. SCALE FISSE E PORTALI
• Larghezza minima 80 cm
• Corrimano obbligatorio su entrambi i lati se larghezza >1,20 m
• Gradini di altezza uniforme e pedata antisdrucciolevole
• Protezione contro caduta da altezze >2 m (parapetti)

7. SERVIZI IGIENICI E LOCALI DI RIPOSO
• Numero minimo WC: 1 ogni 10 lavoratori
• Separati per sesso se >10 lavoratori
• Refettorio o locale mensa: obbligatorio se i lavoratori non possono consumare i pasti sul posto di lavoro
• Docce obbligatorie: lavori che espongono a sostanze pericolose, polverose o sporche

━━━ NOTE PER SETTORI SPECIFICI ━━━
🏭 LOGISTICA/MAGAZZINO (applicazione diretta):
• Corsie pedonali segnate a terra in GIALLO (larghezza minima 80 cm, preferibilmente 100 cm)
• Corsia carrelli separata dalle corsie pedonali con segnatura continua
• Protezioni agli angoli delle scaffalature (bugnature, paraurti in acciaio o PVC)
• Scaffalature ancorate al suolo o alle pareti — obbligatorio
• Accesso ai reparti di carico/scarico: solo personale autorizzato
• Banchine di carico con paracolpi e allineatori per camion
• Altezza utile del magazzino: verificare rispetto al tipo di stoccaggio (alto scaffale vs bulk)
• Sistemi antincendio: sprinkler o estintori ogni 200 m² (D.M. 10/03/1998)

🏗️ CANTIERI EDILI: si applica il Titolo IV + norme specifiche cantieri (recinzioni, vie di accesso, parapetti).
🏢 UFFICI: focus su postazioni VDT, illuminazione, ergonomia, ventilazione.
🏭 INDUSTRIA MANIFATTURIERA: focus su segregazione macchinari, vie di transito sicure, sistemi di aspirazione.
🏥 SANITÀ: locali con requisiti speciali (filtri HEPA, pressioni differenziali, UTA dedicate).

━━━ RIFERIMENTI NORMATIVI ━━━
• D.Lgs. 81/2008, Art. 62-68 e Allegato IV
• D.M. 10/03/1998 (prevenzione incendi)
• Norma UNI EN 12464 (illuminazione luoghi di lavoro)
• D.P.R. 303/1956 (igiene del lavoro — ancora valido in alcune disposizioni)`, en:`OFFICIAL CURRICULUM MODULE B — SPECIFIC UNIT
Sector: GENERIC (all sectors — with sector-specific notes)
Topic: Workplaces
(State-Regions Agreement 26/01/2006 — Duration varies by ATECO sector)

━━━ TRAINING CONTENT ━━━

1. DEFINITION OF WORKPLACE (Art. 62)
• Premises intended to house workstations, located within the company or productive unit
• Includes: any other place accessible to the worker in the course of their work
• Excluded: means of transport, building sites, extractive industries, fishing vessels, domestic service

2. REQUIREMENTS FOR INDOOR WORKPLACES (Title II, Annex IV)
STABILITY AND SOLIDITY:
• Floors, walls and ceilings must be solid and stable
• Minimum load capacity specified in the structural calculations

DIMENSIONS AND AIR VOLUME:
• Minimum floor height: 3m (2.7m for existing premises)
• Minimum 10 m³ air per worker in non-physically demanding work
• Minimum 3.33 m² per worker (floor area)

LIGHTING:
• Adequate natural and/or artificial lighting
• Emergency lighting for sudden blackouts
• Illuminance appropriate to the task (minimum 200 lux for general work)

FLOORING:
• Must be flat, non-slippery and free of bumps
• In good state of repair and easy to clean
• Traffic lanes clearly marked and free of obstructions

TEMPERATURE AND MICROCLIMATE:
• Comfortable temperature for the type of work (18–26°C depending on activity)
• Adequate ventilation (natural or mechanical)
• Protection from draughts

3. TRAFFIC ROUTES AND EMERGENCY EXITS (Art. 63, Annex IV)
• Pedestrian and vehicle routes must be clearly separated
• Routes must be wide enough: ≥1m for pedestrians, ≥2.5m for forklifts
• Emergency exits: always free, clearly marked, opening outwards
• Maximum distance from emergency exit: generally ≤30m (with exceptions for large buildings)

4. OUTDOOR WORKPLACES
• Protection from adverse weather where possible
• Adequate lighting for night work
• Prevention of falls from height and rolling objects

5. SANITARY FACILITIES AND WELFARE (Annex IV)
• Changing rooms: separate for men and women where practicable
• Toilets: at least 1 per 10 workers
• Washbasins with hot and cold water, liquid soap, paper towels
• Canteen or meal area (depending on company size)
• Rest areas separate from the work area

6. SPECIFIC WAREHOUSE/LOGISTICS REQUIREMENTS
• Clear marking of vehicle and pedestrian routes (yellow/white marking)
• Clear and permanent signage of maximum shelf load capacity
• Adequate height clearance for forklifts
• Adequate lighting of all aisles (minimum 200 lux)
• Emergency lighting on all evacuation routes
• Fire detection and suppression systems (sprinklers in warehouses)

━━━ SECTOR-SPECIFIC CONNECTIONS ━━━
🏭 Logistics/Warehouse: key points — floor markings, route separation, shelf stability, fall risk from height (mezzanines, platforms), ventilation in closed warehouses with combustion engine forklifts (carbon monoxide risk).
🏗️ Construction: temporary sites with specific provisions (Title IV).
🏥 Healthcare: specific biological containment zones, pressurised environments.
🚛 Transport: cab environments regulated by specific sector provisions.

━━━ LEGAL REFERENCES ━━━
• D.Lgs. 81/2008, Title II, Art. 62-68, Annex IV
• D.M. 10/03/1998 (fire safety criteria)
• D.P.R. 547/1955 (partially still in force for specific situations)`},

   arts:['Art. 167','Art. 168','Art. 169','Art. 170','Art. 171'],
   sum:{
     it:`Definizione MMC (Art. 167): operazioni di trasporto o sostegno di un carico con le mani o con la forza del corpo: sollevamento, deposizione, spinta, traino, portamento, spostamento.

Rischio principale: sovraccarico biomeccanico del rachide → rachialgia, ernie discali, patologie muscolo-scheletriche. Tra i disturbi professionali più diffusi nel settore logistica.

Metodo NIOSH — Peso limite raccomandato in condizioni ideali (Allegato XXXIII):
• Uomini adulti: 25 kg
• Donne adulte: 20 kg
• Lavoratori <18 anni: 15 kg (indipendentemente dal sesso)

I coefficienti moltiplicativi NIOSH (altezza di presa, dislocazione verticale, asimmetria, frequenza, tipo di presa, distanza orizzontale) sono tutti ≤ 1: riducono il peso limite al diminuire delle condizioni ideali.

Obblighi del DL (Art. 168):
• Valutare i rischi tenendo conto di: caratteristiche del carico, sforzo fisico richiesto, caratteristiche dell'ambiente, esigenze dell'attività
• Adottare misure organizzative (rotazione, pause)
• Fornire ausili meccanici (transpallet, carrelli, ecc.)
• Garantire formazione e informazione`,
     en:`MMC definition (Art. 167): operations of transporting or supporting a load by hand or bodily force: lifting, lowering, pushing, pulling, carrying, moving.

Main risk: biomechanical spinal overload → lower back pain, disc herniation, musculoskeletal disorders. Among the most common occupational disorders in logistics.

NIOSH Method — Recommended weight limit in ideal conditions (Annex XXXIII):
• Adult males: 25 kg
• Adult females: 20 kg
• Workers <18 years: 15 kg (regardless of gender)

NIOSH multiplicative coefficients (grip height, vertical displacement, asymmetry, frequency, grip type, horizontal distance) are all ≤ 1: they reduce the weight limit as conditions deviate from ideal.

Employer obligations (Art. 168):
• Assess risks considering: load characteristics, physical effort required, environmental characteristics, activity requirements
• Adopt organizational measures (rotation, breaks)
• Provide mechanical aids (pallet trucks, trolleys, etc.)
• Ensure training and information`
   },
