   title:{it:'Videoterminali (VDT)',en:'Display Screen Equipment (DSE)',fa:'صفحه‌نمایش‌ها'},
   sub:{it:'Titolo VII · Art. 172-179 · Tutela della vista e della postura',en:'Title VII · Art. 172-179 · Eye and posture protection'},
   arts:['Art. 172','Art. 173','Art. 174','Art. 175','Art. 176','Art. 177'],
   sum:{
     it:`Videoterminale (Art. 172): qualsiasi interfaccia alfanumerica o grafica, indipendentemente dal tipo di procedimento usato per la visualizzazione.

Lavoratore VDT (Art. 173 c.1 lett. c): chi usa abitualmente un'attrezzatura munita di VDT per almeno 20 ore settimanali, dedotte le pause di legge.

Obblighi del DL (Art. 174):
• Analisi dei posti di lavoro per valutare i rischi per la vista, i problemi fisici e la postura
• Adottare misure per eliminare o ridurre i rischi riscontrati
• Informare i lavoratori sulle misure applicate e sulla corretta organizzazione del lavoro

Pause e interruzioni (Art. 175): dopo ogni 2 ore continuative al VDT il lavoratore ha diritto a una pausa di 15 minuti. Le pause possono essere stabilite dalla contrattazione collettiva; in alternativa si applica il regime di legge. Le pause NON sono recuperabili.

Sorveglianza sanitaria (Art. 176):
• Visita preventiva (prima dell'adibizione) e visita periodica ogni 5 anni (ogni 2 anni per lavoratori >50 anni o con rischio elevato)
• Il MC valuta l'idoneità alla mansione specifica
• Lavoratori con problemi visivi: diritto a esame oculistico a cura del DL

Requisiti del posto di lavoro (Allegato XXXIV):
• Schermo: orientabile e inclinabile, assenza di riflessi, caratteri stabili e leggibili
• Tastiera: separata dallo schermo, inclinabile, superficie opaca
• Piano di lavoro: dimensioni adeguate, superficie a bassa riflessione, altezza regolabile
• Sedia: regolabile in altezza, schienale regolabile, poggiapiedi se necessario
• Illuminazione: 300-500 lux, evitare abbagliamenti e riflessi sullo schermo`,
     en:`Display Screen (Art. 172): any alphanumeric or graphic interface, regardless of display technology.

DSE Worker (Art. 173 c.1 lett. c): anyone who habitually uses DSE for at least 20 hours per week, excluding legal breaks.

Employer obligations (Art. 174):
• Workstation analysis to assess risks to sight, physical problems and posture
• Adopt measures to eliminate or reduce identified risks
• Inform workers on measures applied and correct work organization

Breaks (Art. 175): after every 2 continuous hours at DSE, worker has the right to a 15-minute break. Breaks may be set by collective bargaining; otherwise the statutory regime applies. Breaks are NOT recoverable.

Health surveillance (Art. 176):
• Preventive visit (before assignment) and periodic visit every 5 years (every 2 years for workers >50 or with elevated risk)
• MC evaluates fitness for specific duty
• Workers with visual problems: right to eye examination at employer's expense

Workstation requirements (Annex XXXIV):
• Screen: tiltable and swivelling, no reflections, stable readable characters
• Keyboard: separate from screen, tiltable, matt surface
• Work surface: adequate dimensions, low-reflection surface, adjustable height
• Chair: height-adjustable, adjustable backrest, footrest if needed
• Lighting: 300-500 lux, avoid glare and reflections on screen`
   },
   kp:{
     it:['Lavoratore VDT = chi usa VDT abitualmente ≥20h/settimana (pause escluse)','Art. 175: pausa obbligatoria di 15 min ogni 2h consecutive al VDT — NON recuperabile','Sorveglianza sanitaria: ogni 5 anni (ogni 2 anni per over 50 o rischio elevato)','Il DL è tenuto a sostenere i costi di visita oculistica se il MC lo indica','Allegato XXXIV: illuminazione ottimale 300-500 lux, sedia e piano regolabili'],
     en:['DSE worker = habitual use ≥20h/week (breaks excluded)','Art. 175: mandatory 15-min break every 2 consecutive hours at DSE — NOT recoverable','Health surveillance: every 5 years (every 2 years for over-50s or elevated risk)','Employer bears cost of eye examination if MC indicates it','Annex XXXIV: optimal lighting 300-500 lux, adjustable chair and desk']
   },
   quiz:[
     {q:{it:'Chi è considerato "lavoratore VDT" ai sensi del D.Lgs. 81/08?',en:'Who is considered a "DSE worker" under D.Lgs. 81/08?'},
      opts:{it:['Chi usa il PC almeno 1 ora al giorno','Chi usa abitualmente un VDT per ≥20h settimanali, pause escluse','Qualsiasi lavoratore con un computer sulla scrivania','Chi usa il VDT in lavoro straordinario'],en:['Anyone using PC at least 1 hour/day','Anyone habitually using DSE for ≥20h/week, breaks excluded','Any worker with a computer on their desk','Anyone using DSE in overtime']},
      ans:1,exp:{it:'Art. 173 c.1 lett. c: lavoratore VDT è chi usa abitualmente un\'attrezzatura munita di VDT per almeno 20 ore settimanali, dedotte le interruzioni previste dalla normativa.',en:'Art. 173 c.1 lett. c: DSE worker is anyone who habitually uses DSE equipment for at least 20 hours per week, excluding legally required breaks.'}},
     {q:{it:'La pausa obbligatoria al VDT è di:',en:'The mandatory break at DSE is:'},
      opts:{it:['10 minuti ogni ora','15 minuti ogni 2 ore consecutive','30 minuti ogni 4 ore','20 minuti ogni 3 ore'],en:['10 minutes every hour','15 minutes every 2 consecutive hours','30 minutes every 4 hours','20 minutes every 3 hours']},
      ans:1,exp:{it:'Art. 175: dopo ogni 2 ore consecutive di lavoro al VDT il lavoratore ha diritto a 15 minuti di pausa. Le pause non sono recuperabili e possono essere disciplinate dalla contrattazione collettiva.',en:'Art. 175: after every 2 consecutive hours at DSE the worker is entitled to a 15-minute break. Breaks are not recoverable and may be regulated by collective bargaining.'}},
     {q:{it:'Con quale frequenza si effettua la visita medica periodica per i lavoratori VDT (caso generale)?',en:'How often is the periodic medical visit for DSE workers (general case)?'},
      opts:{it:['Ogni anno','Ogni 2 anni','Ogni 5 anni','Ogni 3 anni'],en:['Every year','Every 2 years','Every 5 years','Every 3 years']},
      ans:2,exp:{it:'Art. 176: la visita periodica è ogni 5 anni per i lavoratori VDT in generale. Diventa ogni 2 anni per i lavoratori oltre i 50 anni di età o per quelli con rischio visivo elevato valutato dal MC.',en:'Art. 176: periodic visit every 5 years for DSE workers in general. It becomes every 2 years for workers over 50 or those with elevated visual risk as assessed by MC.'}},
     {q:{it:'I requisiti del posto di lavoro VDT sono contenuti in:',en:'DSE workstation requirements are contained in:'},
      opts:{it:['Art. 28 del D.Lgs. 81/08','Allegato XXXIV del D.Lgs. 81/08','D.M. 388/2003','Allegato XXV del D.Lgs. 81/08'],en:['Art. 28 of D.Lgs. 81/08','Annex XXXIV of D.Lgs. 81/08','D.M. 388/2003','Annex XXV of D.Lgs. 81/08']},
      ans:1,exp:{it:'L\'Allegato XXXIV del D.Lgs. 81/08 stabilisce i requisiti minimi del posto di lavoro VDT: schermo orientabile, tastiera separata, piano di lavoro adeguato, sedia regolabile, illuminazione 300-500 lux.',en:'Annex XXXIV of D.Lgs. 81/08 sets the minimum requirements for DSE workstations: tiltable screen, separate keyboard, adequate work surface, adjustable chair, lighting 300-500 lux.'}}
   ]},

{id:'C2',cat:'C',order:2,icon:'⚗️',hrs:4,
   title:{it:'Agenti Chimici Pericolosi',en:'Hazardous Chemical Agents',fa:'عوامل شیمیایی خطرناک'},
   sub:{it:'Titolo IX Capo I · Art. 221-232 · VLE, valutazione, misure',en:'Title IX Chapter I · Art. 221-232 · OEL, assessment, measures'},
   arts:['Art. 221','Art. 222','Art. 223','Art. 224','Art. 225','Art. 226','Art. 228','Art. 229'],
   sum:{
     it:`Agente chimico pericoloso (Art. 222): qualsiasi agente chimico classificato come pericoloso ai sensi del Regolamento CLP (Reg. CE 1272/2008), o che pur non classificato può presentare rischi per la sicurezza e la salute dei lavoratori a causa delle sue proprietà chimico-fisiche, chimiche o tossicologiche.

Valutazione del rischio chimico (Art. 223): il DL deve valutare tutti i rischi derivanti da agenti chimici presenti sul luogo di lavoro, prendendo in considerazione:
• Proprietà pericolose dell'agente (schede SDS)
• Livelli, tipo e durata dell'esposizione
• Valori limite di esposizione professionale (VLEP/OEL) — Allegato XXXVIII
• Effetti delle misure preventive e protettive già adottate
• Risultati della sorveglianza sanitaria disponibili

Gerarchia delle misure (Art. 224):
1. Eliminazione/sostituzione con agente meno pericoloso
2. Misure di prevenzione e protezione collettiva (ventilazione, confinamento)
3. Misure organizzative (riduzione tempi di esposizione, rotazione)
4. DPI (ultima risorsa — guanti, respiratori, occhiali)

Rischio basso (Art. 224 c.2): se la valutazione evidenzia che i rischi sono bassi e le misure adottate sono sufficienti, non è necessaria la sorveglianza sanitaria né la redazione di una valutazione documentata specifica (sufficiente indicazione nel DVR).

Valori limite di esposizione professionale (VLEP): valori di concentrazione nell'aria che, se non superati, non causano effetti nocivi. Distinti in:
• TLV-TWA (Time Weighted Average): valore medio ponderato su 8 ore
• TLV-STEL (Short Term Exposure Limit): valore limite di breve durata (15 minuti)
• TLV-C (Ceiling): valore che non deve mai essere superato

Schede SDS (Safety Data Sheet): obbligatorie per tutti gli agenti chimici pericolosi; articolate in 16 sezioni secondo il Regolamento REACH (CE 1907/2006).`,
     en:`Hazardous chemical agent (Art. 222): any chemical agent classified as hazardous under CLP Regulation (EC 1272/2008), or which though not classified may present risks to workers' health and safety due to its physico-chemical, chemical or toxicological properties.

Chemical risk assessment (Art. 223): employer must assess all risks from chemical agents present at workplace, considering:
• Hazardous properties of agent (SDS sheets)
• Levels, type and duration of exposure
• Occupational Exposure Limit Values (OELs) — Annex XXXVIII
• Effects of prevention and protection measures already in place
• Available health surveillance results

Measures hierarchy (Art. 224):
1. Elimination/substitution with less hazardous agent
2. Collective prevention and protection measures (ventilation, containment)
3. Organizational measures (reduced exposure time, job rotation)
4. PPE (last resort — gloves, respirators, goggles)

Low risk (Art. 224 c.2): if assessment shows risks are low and measures are sufficient, health surveillance is not required, nor specific documented assessment (indication in DVR is sufficient).

OEL values: air concentration values that, if not exceeded, do not cause harmful effects. Distinguished into:
• TLV-TWA (Time Weighted Average): 8-hour time-weighted average
• TLV-STEL (Short Term Exposure Limit): 15-minute short-term limit
• TLV-C (Ceiling): value that must never be exceeded

SDS (Safety Data Sheets): mandatory for all hazardous chemicals; structured in 16 sections per REACH Regulation (EC 1907/2006).`
   },
   kp:{
     it:['Art. 222: agente chimico pericoloso = classificato CLP o con proprietà tossicologiche/fisico-chimiche pericolose','Art. 223: la valutazione usa i VLEP (Allegato XXXVIII): TWA (8h), STEL (15 min), Ceiling (mai superare)','Gerarchia: eliminazione → sostituzione → protezione collettiva → DPI','Art. 224 c.2: rischio basso = nessuna sorveglianza sanitaria specifica obbligatoria','SDS (scheda dati sicurezza): 16 sezioni obbligatorie per ogni sostanza pericolosa (Reg. REACH)'],
     en:['Art. 222: hazardous chemical agent = CLP classified or with dangerous toxicological/physico-chemical properties','Art. 223: assessment uses OELs (Annex XXXVIII): TWA (8h), STEL (15 min), Ceiling (never exceed)','Hierarchy: elimination → substitution → collective protection → PPE','Art. 224 c.2: low risk = no specific mandatory health surveillance','SDS (Safety Data Sheet): 16 mandatory sections for each hazardous substance (REACH Reg.)']
   },
   quiz:[
     {q:{it:'Il valore TLV-TWA rappresenta:',en:'The TLV-TWA value represents:'},
      opts:{it:['Il valore che non deve MAI essere superato','La concentrazione media ponderata su 8 ore lavorative','Il limite per esposizioni brevi di 15 minuti','Il valore massimo per sostanze cancerogene'],en:['The value that must NEVER be exceeded','The time-weighted average concentration over 8 working hours','The limit for short-term 15-minute exposures','The maximum value for carcinogenic substances']},
      ans:1,exp:{it:'Il TLV-TWA (Time Weighted Average) è la concentrazione media ponderata nel tempo su 8 ore lavorative giornaliere e 40 ore settimanali. Il TLV-C è quello che non deve mai essere superato, mentre il TLV-STEL vale per esposizioni brevi (15 min).',en:'TLV-TWA (Time Weighted Average) is the time-weighted average concentration over 8 daily working hours and 40 weekly hours. TLV-C must never be exceeded, while TLV-STEL applies to short-term 15-min exposures.'}},
     {q:{it:'Quando si può escludere la sorveglianza sanitaria per agenti chimici (Art. 224)?',en:'When can health surveillance be excluded for chemical agents (Art. 224)?'},
      opts:{it:['Mai, è sempre obbligatoria','Quando il rischio è basso e le misure adottate sono sufficienti','Solo per le ditte con meno di 10 dipendenti','Quando il DL lo decide autonomamente'],en:['Never, it is always mandatory','When risk is low and measures in place are sufficient','Only for companies with fewer than 10 employees','When the employer decides autonomously']},
      ans:1,exp:{it:'Art. 224 c.2: se la valutazione dimostra che i rischi sono bassi per la sicurezza e irrilevanti per la salute, il DL non è tenuto a effettuare la sorveglianza sanitaria specifica né una valutazione documentale approfondita.',en:'Art. 224 c.2: if assessment shows risks are low for safety and negligible for health, employer is not required to perform specific health surveillance or detailed documented assessment.'}},
     {q:{it:'La scheda SDS (Safety Data Sheet) è strutturata in:',en:'The SDS (Safety Data Sheet) is structured in:'},
      opts:{it:['8 sezioni','12 sezioni','16 sezioni','20 sezioni'],en:['8 sections','12 sections','16 sections','20 sections']},
      ans:2,exp:{it:'Il Regolamento REACH (CE 1907/2006) stabilisce che la SDS deve essere articolata in 16 sezioni standard obbligatorie, contenenti informazioni su identificazione, composizione, pericoli, misure di pronto soccorso, antincendio, DPI, ecc.',en:'REACH Regulation (EC 1907/2006) establishes that the SDS must be structured in 16 mandatory standard sections, containing information on identification, composition, hazards, first aid measures, fire-fighting, PPE, etc.'}},
     {q:{it:'Nella gerarchia delle misure per il rischio chimico, i DPI si trovano:',en:'In the hierarchy of measures for chemical risk, PPE is placed:'},
      opts:{it:['Al primo posto','Al secondo posto, dopo eliminazione','All\'ultimo posto, dopo eliminazione, sostituzione e protezione collettiva','Al terzo posto, prima della protezione collettiva'],en:['First','Second, after elimination','Last, after elimination, substitution and collective protection','Third, before collective protection']},
      ans:2,exp:{it:'Art. 224: la gerarchia prevede 1) Eliminazione/sostituzione, 2) Misure di protezione collettiva (ventilazione, confinamento), 3) Misure organizzative, 4) DPI. I DPI sono sempre l\'ultima opzione.',en:'Art. 224: the hierarchy requires 1) Elimination/substitution, 2) Collective protection measures (ventilation, containment), 3) Organizational measures, 4) PPE. PPE is always the last option.'}}
   ]},

{id:'C3',cat:'C',order:3,icon:'☢️',hrs:3,
   title:{it:'Agenti Cancerogeni e Mutageni',en:'Carcinogenic & Mutagenic Agents',fa:'عوامل سرطان‌زا و جهش‌زا'},
   sub:{it:'Titolo IX Capo II · Art. 233-245 · D.Lgs. 135/2024',en:'Title IX Chapter II · Art. 233-245 · D.Lgs. 135/2024'},
   arts:['Art. 233','Art. 234','Art. 235','Art. 236','Art. 237','Art. 238','Art. 239','Art. 240','Art. 241','Art. 242','Art. 243','Art. 244','Art. 245'],
   sum:{
     it:`Agente cancerogeno (Art. 234): sostanza o miscela classificata come cancerogena di categoria 1A o 1B dal Regolamento CLP (Reg. CE 1272/2008), oppure qualsiasi sostanza, miscela o procedimento indicato nell'Allegato XLII del D.Lgs. 81/08.

Agente mutageno: sostanza classificata come mutagena di categoria 1A o 1B dal Regolamento CLP. Il D.Lgs. 135/2024 ha esteso la tutela alle sostanze reprotossiche (tossiche per la riproduzione).

Principio cardine: la sostituzione è obbligatoria (Art. 235). Il DL DEVE evitare o ridurre l'uso di agenti cancerogeni ricorrendo, ove tecnicamente possibile, a sostanze, miscele o processi che non siano pericolosi o lo siano meno. Non è facoltativo.

Valutazione del rischio (Art. 236): obbligatoria e documentata in tutti i casi. Deve includere:
• Tipo, livello, durata dell'esposizione
• Valore limite di esposizione (VLE) — Allegato XLIII (aggiornato da D.Lgs. 135/2024)
• Misure preventive e protettive adottate
• Numero di lavoratori esposti o potenzialmente esposti

Misure specifiche (Art. 237-239):
• Limitare al minimo il numero dei lavoratori esposti
• Progettare i processi lavorativi in modo da evitare la formazione e la dispersione
• Misurare i valori di esposizione con metodologie validate (UNI EN 482)
• Registro degli esposti: ogni lavoratore esposto a cancerogeni deve essere iscritto nel registro degli esposti tenuto dal DL (Art. 243)

Sorveglianza sanitaria (Art. 242): obbligatoria per tutti i lavoratori esposti, senza eccezioni. La cartella sanitaria è conservata per 40 anni dalla fine dell'esposizione. Al termine del rapporto di lavoro, il DL informa il lavoratore del diritto alla sorveglianza sanitaria anche dopo la cessazione.

D.Lgs. 135/2024: ha modificato 22 articoli del Titolo IX e introdotto il nuovo Allegato XLIII-BIS sul piombo e i suoi composti ionici, recependo la Direttiva UE 2022/431.`,
     en:`Carcinogenic agent (Art. 234): substance or mixture classified as carcinogenic category 1A or 1B under CLP Regulation (EC 1272/2008), or any substance, mixture or process listed in Annex XLII of D.Lgs. 81/08.

Mutagenic agent: substance classified as mutagenic category 1A or 1B under CLP. D.Lgs. 135/2024 extended protection to reprotoxic substances.

Key principle: substitution is mandatory (Art. 235). The employer MUST avoid or reduce use of carcinogenic agents by using, where technically possible, substances, mixtures or processes that are not or are less hazardous. This is not optional.

Risk assessment (Art. 236): mandatory and documented in all cases. Must include:
• Type, level, duration of exposure
• Exposure Limit Value (ELV) — Annex XLIII (updated by D.Lgs. 135/2024)
• Prevention and protection measures adopted
• Number of workers exposed or potentially exposed

Specific measures (Art. 237-239):
• Minimize number of exposed workers
• Design work processes to avoid formation and dispersal
• Measure exposure values with validated methods (UNI EN 482)
• Register of exposed workers: each worker exposed to carcinogens must be entered in register kept by employer (Art. 243)

Health surveillance (Art. 242): mandatory for ALL exposed workers, without exceptions. Health records kept for 40 years after end of exposure. At end of employment, employer informs worker of right to health surveillance even after leaving.

D.Lgs. 135/2024: modified 22 articles of Title IX and introduced new Annex XLIII-BIS on lead and its ionic compounds, transposing EU Directive 2022/431.`
   },
   kp:{
     it:['Art. 234: cancerogeno = classificato CLP cat. 1A/1B o elencato in Allegato XLII','Art. 235: la sostituzione con agente meno pericoloso è OBBLIGATORIA (non facoltativa)','Art. 243: registro degli esposti obbligatorio — la cartella sanitaria si conserva 40 anni','Art. 242: sorveglianza sanitaria obbligatoria per TUTTI gli esposti senza eccezioni','D.Lgs. 135/2024: aggiorna Allegato XLIII e introduce Allegato XLIII-BIS (piombo)'],
     en:['Art. 234: carcinogen = CLP classified cat. 1A/1B or listed in Annex XLII','Art. 235: substitution with less hazardous agent is MANDATORY (not optional)','Art. 243: register of exposed workers mandatory — health records kept 40 years','Art. 242: health surveillance mandatory for ALL exposed workers without exceptions','D.Lgs. 135/2024: updates Annex XLIII and introduces Annex XLIII-BIS (lead)']
   },
   quiz:[
     {q:{it:'Per gli agenti cancerogeni, la sostituzione con agente meno pericoloso è (Art. 235):',en:'For carcinogenic agents, substitution with a less hazardous agent (Art. 235) is:'},
      opts:{it:['Facoltativa, se il DL lo ritiene opportuno','Obbligatoria ove tecnicamente possibile','Consigliata ma non imposta dalla legge','Obbligatoria solo per aziende >50 dipendenti'],en:['Optional, if the employer deems it appropriate','Mandatory where technically possible','Recommended but not legally required','Mandatory only for companies >50 employees']},
      ans:1,exp:{it:'Art. 235: il DL DEVE evitare l\'uso di agenti cancerogeni ricorrendo, ove tecnicamente possibile, ad agenti o processi meno pericolosi. La sostituzione è un obbligo di legge, non una facoltà.',en:'Art. 235: employer MUST avoid use of carcinogenic agents by using, where technically possible, less hazardous agents or processes. Substitution is a legal obligation, not an option.'}},
     {q:{it:'Per quanti anni deve essere conservata la cartella sanitaria dei lavoratori esposti a cancerogeni?',en:'For how many years must health records of workers exposed to carcinogens be kept?'},
      opts:{it:['10 anni','20 anni','40 anni','Per tutta la vita'],en:['10 years','20 years','40 years','For lifetime']},
      ans:2,exp:{it:'Art. 242 e Art. 243: la cartella sanitaria e di rischio dei lavoratori esposti a cancerogeni deve essere conservata per almeno 40 anni dalla cessazione dell\'esposizione, a causa della lunga latenza delle malattie tumorali.',en:'Art. 242 and Art. 243: health and risk records of workers exposed to carcinogens must be kept for at least 40 years after end of exposure, due to the long latency period of tumour diseases.'}},
     {q:{it:'Il D.Lgs. 135/2024 ha modificato il Titolo IX del D.Lgs. 81/08 per recepire:',en:'D.Lgs. 135/2024 amended Title IX of D.Lgs. 81/08 to transpose:'},
      opts:{it:['Direttiva UE 2018/957','Direttiva UE 2022/431 (agenti cancerogeni e mutageni)','Regolamento REACH aggiornato','Direttiva Macchine 2006/42/CE'],en:['EU Directive 2018/957','EU Directive 2022/431 (carcinogenic and mutagenic agents)','Updated REACH Regulation','Machinery Directive 2006/42/EC']},
      ans:1,exp:{it:'Il D.Lgs. 135 del 4 settembre 2024 ha recepito la Direttiva UE 2022/431, modificando 22 articoli del Titolo IX e introducendo il nuovo Allegato XLIII-BIS relativo al piombo e ai suoi composti ionici.',en:'D.Lgs. 135 of 4 September 2024 transposed EU Directive 2022/431, amending 22 articles of Title IX and introducing the new Annex XLIII-BIS on lead and its ionic compounds.'}},
     {q:{it:'Cosa deve contenere obbligatoriamente il registro degli esposti ad agenti cancerogeni (Art. 243)?',en:'What must the register of workers exposed to carcinogens mandatorily contain (Art. 243)?'},
      opts:{it:['Solo il nome del lavoratore','Attività svolta, agente cancerogeno, livello di esposizione, periodo di esposizione','Solo i valori di esposizione misurati','Dati anagrafici e contratto di lavoro'],en:['Only the worker\'s name','Activity performed, carcinogenic agent, exposure level, exposure period','Only measured exposure values','Personal data and employment contract']},
      ans:1,exp:{it:'Art. 243: il registro degli esposti deve riportare per ogni lavoratore: l\'attività lavorativa svolta, l\'agente cancerogeno o mutageno utilizzato, il livello di esposizione accertato e il periodo di esposizione. Il registro è inviato all\'INAIL e all\'organo di vigilanza.',en:'Art. 243: the register of exposed workers must record for each worker: the work activity performed, the carcinogenic or mutagenic agent used, the ascertained exposure level and the exposure period. The register is sent to INAIL and the supervisory authority.'}}
   ]},

{id:'C4',cat:'C',order:4,icon:'😰',hrs:3,
   title:{it:'Stress Lavoro-Correlato',en:'Work-Related Stress',fa:'استرس مرتبط با کار'},
   sub:{it:'Art. 28 · Accordo Europeo 2004 · Metodo INAIL',en:'Art. 28 · European Agreement 2004 · INAIL Method'},
   arts:['Art. 28','Art. 29'],
   sum:{
     it:`Obbligo normativo (Art. 28 c.1): la valutazione dei rischi deve riguardare TUTTI i rischi, incluso "quello collegato allo stress lavoro-correlato, secondo i contenuti dell'Accordo europeo dell'8 ottobre 2004".

Definizione (Accordo Europeo 8/10/2004): lo stress è una condizione accompagnata da sofferenze o disfunzioni fisiche, psicologiche o sociali, che si producono quando le persone non si sentono in grado di rispondere alle richieste o alle aspettative nei loro confronti.

Indicatori di stress (Accordo 2004):
• Indicatori sentinella: elevato assenteismo, turn-over elevato, elevato numero di infortuni e incidenti, conflitti interpersonali frequenti, ricorsi frequenti al MC
• Fattori di contenuto del lavoro: carico di lavoro, orario, ambiente fisico, autonomia, varietà dei compiti
• Fattori di contesto del lavoro: cultura organizzativa, ruolo nella struttura, sviluppo di carriera, relazioni interpersonali, interfaccia casa-lavoro

Metodo di valutazione INAIL (Circolare Min. Lavoro 18/11/2010 + aggiornamento 2017):
FASE 1 — Valutazione preliminare (obbligatoria per tutti):
  • 4 gruppi di indicatori oggettivi e verificabili: eventi sentinella, fattori di contenuto del lavoro, fattori di contesto del lavoro, comportamenti/stili di vita
  • Se il risultato è BASSO: si adottano misure di miglioramento e si monitora nel tempo
  • Se il risultato è MEDIO o ALTO: si procede obbligatoriamente alla Fase 2

FASE 2 — Valutazione approfondita (solo se necessario):
  • Coinvolgimento diretto dei lavoratori tramite questionari validati e/o focus group
  • Identificazione delle azioni correttive specifiche

Soggetti coinvolti: RSPP, MC (obbligatorio il suo coinvolgimento nella valutazione), RLS/RLST, eventualmente consulenti psicologi del lavoro.

Differenza fondamentale: lo stress non è una malattia ma un rischio da valutare e gestire come tutti gli altri rischi prevenzionistici.`,
     en:`Legal obligation (Art. 28 c.1): risk assessment must cover ALL risks, including "that connected to work-related stress, according to the contents of the European Agreement of 8 October 2004".

Definition (European Agreement 8/10/2004): stress is a condition accompanied by physical, psychological or social suffering or dysfunctions, which arise when people feel unable to meet demands or expectations placed on them.

Stress indicators (Agreement 2004):
• Sentinel indicators: high absenteeism, high turnover, high number of accidents and incidents, frequent interpersonal conflicts, frequent appeals to MC
• Work content factors: workload, working hours, physical environment, autonomy, task variety
• Work context factors: organizational culture, role in structure, career development, interpersonal relations, home-work interface

INAIL assessment method (Min. of Labour Circular 18/11/2010 + 2017 update):
PHASE 1 — Preliminary assessment (mandatory for all):
  • 4 groups of objective and verifiable indicators: sentinel events, work content factors, work context factors, behaviours/lifestyles
  • If result is LOW: improvement measures adopted and monitored over time
  • If result is MEDIUM or HIGH: Phase 2 is mandatory

PHASE 2 — In-depth assessment (only if necessary):
  • Direct worker involvement through validated questionnaires and/or focus groups
  • Identification of specific corrective actions

Persons involved: RSPP, MC (involvement in assessment is mandatory), RLS/RLST, possibly occupational psychology consultants.

Key distinction: stress is not a disease but a risk to be assessed and managed like all other preventive risks.`
   },
   kp:{
     it:['Art. 28: lo stress lavoro-correlato è un rischio obbligatorio da valutare nel DVR per TUTTE le aziende','La valutazione segue il metodo INAIL in 2 fasi: preliminare (tutti) + approfondita (se rischio ≥ medio)','Indicatori sentinella: assenteismo, infortuni, turn-over, conflitti, ricorsi al MC','Il MC deve essere coinvolto nella valutazione dello stress (non è facoltativo)','Stress non è malattia: è un rischio da prevenire come tutti gli altri'],
     en:['Art. 28: work-related stress is a mandatory risk to assess in DVR for ALL companies','Assessment follows INAIL 2-phase method: preliminary (all) + in-depth (if risk ≥ medium)','Sentinel indicators: absenteeism, accidents, turnover, conflicts, appeals to MC','MC must be involved in stress assessment (not optional)','Stress is not a disease: it is a risk to prevent like all others']
   },
   quiz:[
     {q:{it:'La valutazione del rischio da stress lavoro-correlato è obbligatoria:',en:'Work-related stress risk assessment is mandatory:'},
      opts:{it:['Solo per aziende con >50 dipendenti','Solo in settori ad alto rischio psicosociale','Per tutte le aziende, senza distinzione di dimensione o settore','Solo se i lavoratori la richiedono tramite RLS'],en:['Only for companies with >50 employees','Only in high psychosocial risk sectors','For all companies, regardless of size or sector','Only if workers request it through RLS']},
      ans:2,exp:{it:'Art. 28 c.1: la valutazione dei rischi include obbligatoriamente lo stress lavoro-correlato per TUTTE le aziende e tutti i lavoratori, senza soglie dimensionali o settoriali.',en:'Art. 28 c.1: risk assessment mandatorily includes work-related stress for ALL companies and all workers, without size or sector thresholds.'}},
     {q:{it:'Nel metodo INAIL, la Fase 2 (valutazione approfondita) è obbligatoria quando:',en:'In the INAIL method, Phase 2 (in-depth assessment) is mandatory when:'},
      opts:{it:['Sempre, per tutte le aziende','Solo quando il DL lo decide','Il risultato della Fase 1 è MEDIO o ALTO','Solo su richiesta dell\'organo di vigilanza'],en:['Always, for all companies','Only when the employer decides','Phase 1 result is MEDIUM or HIGH','Only upon request of the supervisory authority']},
      ans:2,exp:{it:'Il metodo INAIL prevede che la Fase 1 (preliminare) sia obbligatoria per tutti. La Fase 2 (coinvolgimento diretto dei lavoratori con questionari e focus group) scatta obbligatoriamente solo se la Fase 1 rileva un livello di rischio MEDIO o ALTO.',en:'The INAIL method requires Phase 1 (preliminary) to be mandatory for all. Phase 2 (direct worker involvement with questionnaires and focus groups) becomes mandatory only when Phase 1 detects a MEDIUM or HIGH risk level.'}},
     {q:{it:'Quale accordo definisce i contenuti minimi della valutazione stress lavoro-correlato?',en:'Which agreement defines the minimum contents of work-related stress assessment?'},
      opts:{it:['Accordo Stato-Regioni 21/12/2011','Accordo Europeo dell\'8 ottobre 2004','D.M. 388/2003','Circolare INAIL n. 71/2003'],en:['State-Regions Agreement 21/12/2011','European Agreement of 8 October 2004','D.M. 388/2003','INAIL Circular no. 71/2003']},
      ans:1,exp:{it:'Art. 28 c.1 del D.Lgs. 81/08 rimanda espressamente all\'Accordo europeo dell\'8 ottobre 2004 come riferimento per la valutazione del rischio da stress lavoro-correlato. Il metodo pratico è poi quello INAIL del 2010/2017.',en:'Art. 28 c.1 of D.Lgs. 81/08 expressly refers to the European Agreement of 8 October 2004 as the reference for work-related stress risk assessment. The practical method is then the INAIL one from 2010/2017.'}},
     {q:{it:'Quali sono gli indicatori sentinella dello stress lavoro-correlato?',en:'What are the sentinel indicators of work-related stress?'},
      opts:{it:['Solo i dati sugli infortuni','Assenteismo, turn-over, infortuni, conflitti e ricorsi frequenti al MC','Risultati dei questionari anonimi ai lavoratori','Solo i dati sulla sorveglianza sanitaria'],en:['Only accident data','Absenteeism, turnover, accidents, conflicts and frequent MC appeals','Results of anonymous worker questionnaires','Only health surveillance data']},
      ans:1,exp:{it:'Gli indicatori sentinella sono dati aziendali oggettivi: indici di assenteismo, turn-over del personale, infortuni e incidenti mancati (near-miss), conflitti interpersonali e ricorsi frequenti al medico competente. Sono la base della Fase 1 della valutazione.',en:'Sentinel indicators are objective company data: absenteeism rates, staff turnover, accidents and near-misses, interpersonal conflicts and frequent appeals to the occupational physician. They form the basis of Phase 1 of the assessment.'}}
   ]},

{id:'C5',cat:'C',order:5,icon:'⚖️',hrs:3,
   title:{it:'Sanzioni e Infortuni — Notifica INAIL',en:'Penalties & Accidents — INAIL Notification',fa:'جریمه‌ها و حوادث — اطلاع‌رسانی INAIL'},
   sub:{it:'Titolo XII · Art. 55-60 · Art. 53-54 · Registro infortuni',en:'Title XII · Art. 55-60 · Art. 53-54 · Accident register'},
   arts:['Art. 53','Art. 54','Art. 55','Art. 56','Art. 57','Art. 58','Art. 59','Art. 60'],
   sum:{
     it:`SANZIONI — Titolo XII (Art. 55-60)

Il sistema sanzionatorio del D.Lgs. 81/08 è articolato su tre livelli:

1. DATORE DI LAVORO e DIRIGENTE (Art. 55-56):
• Arresto da 3 a 6 mesi o ammenda da €2.740 a €7.014: mancata elaborazione del DVR, mancata nomina RSPP, mancata designazione addetti emergenze
• Arresto da 2 a 4 mesi o ammenda da €1.096 a €4.384: violazioni in materia di sorveglianza sanitaria, formazione, DPI
• Le sanzioni si raddoppiano se il datore non ha provveduto alla valutazione dei rischi entro i termini prescritti dopo una diffida degli organi di vigilanza

2. PREPOSTO (Art. 56):
• Arresto fino a 2 mesi o ammenda da €491 a €1.474: mancata vigilanza sull'uso dei DPI, mancato intervento in caso di pericolo grave

3. LAVORATORE (Art. 59):
• Arresto fino a 1 mese o ammenda da €219 a €657: mancato utilizzo di DPI forniti, mancata osservanza delle disposizioni impartite dal DL/preposto

Prescrizione obbligatoria (Art. 20 D.Lgs. 758/1994): in caso di violazione della normativa, l'organo di vigilanza (ASL/INL) può emettere una prescrizione con termine per la regolarizzazione. Se il DL adempie e paga 1/4 dell'ammenda entro il termine, il reato si estingue (oblazione).

INFORTUNI E MALATTIE PROFESSIONALI (Art. 53-54):

Denuncia/comunicazione all'INAIL:
• Infortuni con prognosi >3 giorni (escluso quello dell'evento): comunicazione entro 48 ore dal ricevimento del certificato medico
• Infortuni mortali o con pericolo di morte: comunicazione entro 24 ore
• Malattie professionali: comunicazione entro 48 ore dal certificato medico

Registro degli infortuni (Art. 53 c.6): a partire dal D.Lgs. 151/2015 (Jobs Act), il registro cartaceo degli infortuni è stato abolito. Gli infortuni con assenza >1 giorno sono comunicati all'INAIL tramite il sistema informatico; quelli con assenza 1 giorno (escluso quello dell'evento) sono riportati esclusivamente nel registro del datore di lavoro.

Organi di vigilanza (Art. 13-14): ASL (Azienda Sanitaria Locale) e INL (Ispettorato Nazionale del Lavoro). Per settori specifici: Vigili del Fuoco (antincendio), ISPRA (rischi ambientali).`,
     en:`PENALTIES — Title XII (Art. 55-60)

The D.Lgs. 81/08 penalty system is structured on three levels:

1. EMPLOYER and MANAGER (Art. 55-56):
• Arrest 3 to 6 months or fine €2,740 to €7,014: failure to prepare DVR, failure to appoint RSPP, failure to designate emergency staff
• Arrest 2 to 4 months or fine €1,096 to €4,384: violations on health surveillance, training, PPE
• Penalties double if employer has not carried out risk assessment within prescribed deadlines after supervisory authority notice

2. SUPERVISOR (Art. 56):
• Arrest up to 2 months or fine €491 to €1,474: failure to supervise PPE use, failure to intervene in serious danger

3. WORKER (Art. 59):
• Arrest up to 1 month or fine €219 to €657: failure to use provided PPE, non-compliance with instructions from employer/supervisor

Mandatory prescription (Art. 20 D.Lgs. 758/1994): in case of violation, the supervisory authority (ASL/INL) may issue a prescription with a deadline for regularization. If the employer complies and pays 1/4 of the fine within the deadline, the offence is extinguished (oblation).

ACCIDENTS AND OCCUPATIONAL DISEASES (Art. 53-54):

Report/notification to INAIL:
• Accidents with prognosis >3 days (excluding event day): notification within 48 hours of receiving medical certificate
• Fatal accidents or with risk of death: notification within 24 hours
• Occupational diseases: notification within 48 hours of medical certificate

Accident register (Art. 53 c.6): from D.Lgs. 151/2015 (Jobs Act), the paper accident register was abolished. Accidents with absence >1 day are communicated to INAIL via computer system; those with 1-day absence (excluding event day) are recorded only in the employer's register.

Supervisory authorities (Art. 13-14): ASL (Local Health Authority) and INL (National Labour Inspectorate). For specific sectors: Fire Brigade (fire prevention), ISPRA (environmental risks).`
   },
   kp:{
     it:['Art. 55: DVR mancante = arresto 3-6 mesi o ammenda €2.740-7.014 per DL e dirigente','Art. 59: il lavoratore che non usa i DPI rischia arresto fino a 1 mese o ammenda €219-657','Infortuni mortali o con pericolo di morte: comunicazione INAIL entro 24 ore','Infortuni con prognosi >3 giorni: comunicazione INAIL entro 48 ore dal certificato medico','Prescrizione (D.Lgs. 758/1994): adempimento + pagamento 1/4 ammenda → reato si estingue'],
     en:['Art. 55: missing DVR = arrest 3-6 months or fine €2,740-7,014 for employer and manager','Art. 59: worker failing to use PPE risks arrest up to 1 month or fine €219-657','Fatal accidents or with risk of death: INAIL notification within 24 hours','Accidents with prognosis >3 days: INAIL notification within 48 hours of medical certificate','Prescription (D.Lgs. 758/1994): compliance + payment of 1/4 fine → offence extinguished']
   },
   quiz:[
     {q:{it:'Entro quanto tempo deve essere comunicato all\'INAIL un infortunio mortale?',en:'Within what time must a fatal accident be reported to INAIL?'},
      opts:{it:['12 ore dall\'evento','24 ore dall\'evento','48 ore dal certificato medico','72 ore dall\'evento'],en:['12 hours from event','24 hours from event','48 hours from medical certificate','72 hours from event']},
      ans:1,exp:{it:'Art. 54 c.1: gli infortuni mortali o con pericolo di morte devono essere comunicati all\'INAIL (e all\'Autorità di Pubblica Sicurezza) entro 24 ore dall\'evento, anche telefonicamente o via web.',en:'Art. 54 c.1: fatal accidents or those with risk of death must be notified to INAIL (and Public Security Authority) within 24 hours of the event, including by telephone or web.'}},
     {q:{it:'Qual è la sanzione per il datore di lavoro che non ha elaborato il DVR (Art. 55)?',en:'What is the penalty for an employer who has not prepared the DVR (Art. 55)?'},
      opts:{it:['Solo ammenda da €500 a €1.500','Arresto da 3 a 6 mesi o ammenda da €2.740 a €7.014','Sospensione dell\'attività automatica','Diffida obbligatoria prima di qualunque sanzione'],en:['Fine only from €500 to €1,500','Arrest 3 to 6 months or fine from €2,740 to €7,014','Automatic activity suspension','Mandatory notice before any sanction']},
      ans:1,exp:{it:'Art. 55 c.1 lett. a: la mancata elaborazione del DVR è sanzionata con l\'arresto da tre a sei mesi o con l\'ammenda da €2.740 a €7.014. È una delle sanzioni più gravi del sistema sanzionatorio.',en:'Art. 55 c.1 lett. a: failure to prepare DVR is sanctioned with arrest from three to six months or fine from €2,740 to €7,014. It is one of the most severe penalties in the system.'}},
     {q:{it:'Cosa succede se il DL adempie alla prescrizione dell\'organo di vigilanza e paga 1/4 dell\'ammenda (D.Lgs. 758/1994)?',en:'What happens if the employer complies with the supervisory authority\'s prescription and pays 1/4 of the fine (D.Lgs. 758/1994)?'},
      opts:{it:['Riceve una riduzione del 50% della pena','Il reato si estingue (oblazione)','Viene rinviato a giudizio penale','Deve comunque pagare l\'intera ammenda'],en:['Receives 50% penalty reduction','The offence is extinguished (oblation)','Is referred to criminal trial','Must still pay the full fine']},
      ans:1,exp:{it:'Il meccanismo della prescrizione (D.Lgs. 758/1994) prevede che se il DL regolarizza la violazione entro il termine e paga il quarto del massimo dell\'ammenda, l\'organo di vigilanza riferisce all\'autorità giudiziaria che il reato è estinto per oblazione. Non c\'è processo penale.',en:'The prescription mechanism (D.Lgs. 758/1994) provides that if the employer regularizes the violation within the deadline and pays one quarter of the maximum fine, the supervisory authority reports to the judicial authority that the offence has been extinguished through oblation. There is no criminal trial.'}},
     {q:{it:'Quale organo di vigilanza ha competenza generale sul D.Lgs. 81/08?',en:'Which supervisory authority has general jurisdiction over D.Lgs. 81/08?'},
      opts:{it:['Solo i Vigili del Fuoco','INAIL e INPS','ASL (Azienda Sanitaria Locale) e INL (Ispettorato Nazionale del Lavoro)','Solo il Ministero del Lavoro'],en:['Only the Fire Brigade','INAIL and INPS','ASL (Local Health Authority) and INL (National Labour Inspectorate)','Only the Ministry of Labour']},
      ans:2,exp:{it:'Art. 13: la vigilanza sull\'applicazione del D.Lgs. 81/08 è esercitata dalla ASL (per gli aspetti igienico-sanitari e tecnici) e dall\'INL (Ispettorato Nazionale del Lavoro, per i profili lavoristici). Per settori speciali vi sono competenze specifiche (VVF per antincendio, ISPRA per ambiente).',en:'Art. 13: supervision of D.Lgs. 81/08 application is exercised by ASL (for health, hygiene and technical aspects) and INL (National Labour Inspectorate, for labour law aspects). For special sectors there are specific jurisdictions (Fire Brigade for fire prevention, ISPRA for environment).'}}
   ]},

{id:'C6',cat:'C',order:6,icon:'📅',hrs:2,
   title:{it:'Accordo Stato-Regioni 2025 (Novità Formazione)',en:'State-Regions Agreement 2025 (Training Update)',fa:'توافق‌نامه دولت-مناطق ۲۰۲۵'},
   sub:{it:'Accordo 59/CSR/2025 · Aggiornamento formazione obbligatoria',en:'Agreement 59/CSR/2025 · Mandatory training update'},
   arts:['Art. 37'],
   sum:{
     it:`L'Accordo Stato-Regioni 59/CSR/2025 ridefinisce i contenuti, le modalità e la durata della formazione obbligatoria in materia di salute e sicurezza sul lavoro, aggiornando e sostituendo progressivamente l'Accordo del 21/12/2011.

Principali novità:

1. FORMAZIONE LAVORATORI — ore invariate, contenuti aggiornati:
• Rischio basso: 4h generali + 4h specifiche = 8h totali
• Rischio medio: 4h + 8h = 12h totali
• Rischio alto: 4h + 12h = 16h totali
• Aggiornamento: ogni 5 anni (6h)

2. PREPOSTI — rafforzamento del ruolo:
• La normativa (D.L. 146/2021 conv. L. 215/2021) ha modificato l'Art. 19: il preposto è ora tenuto a una formazione specifica obbligatoria con aggiornamento periodico anche quando cambia mansione
• Formazione: percorso lavoratori + 6h specifiche (aggiornamento: 6h ogni 5 anni)

3. DIRIGENTI — aggiornata:
• 16h totali (invariate): struttura modulare aggiornata nei contenuti
• Aggiornamento ogni 5 anni: 6h

4. DATORI DI LAVORO — RSPP in proprio:
• Formazione aggiornata nei contenuti per i DL che svolgono direttamente il ruolo di RSPP (Art. 34)
• Obbligo di aggiornamento periodico

5. MODALITÀ DI EROGAZIONE:
• E-learning ammesso per i moduli generali (teorici)
• Formazione pratica/specifica DEVE avvenire in presenza (non ammessa FAD per le parti pratiche)
• Piattaforme di e-learning devono essere certificate e garantire la tracciabilità

6. DOCENTI E FORMATORI:
• Requisiti aggiornati per i formatori in materia di SSL
• Registrazione delle attività formative obbligatoria

Nota importante: le date di entrata in vigore delle singole disposizioni dell'Accordo 2025 sono scaglionate; verificare sempre la versione aggiornata del decreto attuativo.`,
     en:`The State-Regions Agreement 59/CSR/2025 redefines the contents, methods and duration of mandatory occupational health and safety training, progressively updating and replacing the Agreement of 21/12/2011.

Key changes:

1. WORKER TRAINING — hours unchanged, updated contents:
• Low risk: 4h general + 4h specific = 8h total
• Medium risk: 4h + 8h = 12h total
• High risk: 4h + 12h = 16h total
• Update: every 5 years (6h)

2. SUPERVISORS — strengthened role:
• Legislation (D.L. 146/2021 conv. L. 215/2021) amended Art. 19: supervisor now required to undergo specific mandatory training with periodic update even when changing role
• Training: worker path + 6h specific (update: 6h every 5 years)

3. MANAGERS — updated:
• 16h total (unchanged): updated modular content structure
• Update every 5 years: 6h

4. EMPLOYERS — acting as RSPP:
• Updated content training for employers acting directly as RSPP (Art. 34)
• Mandatory periodic update requirement

5. DELIVERY METHODS:
• E-learning permitted for general (theoretical) modules
• Practical/specific training MUST be in-person (distance learning not permitted for practical parts)
• E-learning platforms must be certified and ensure traceability

6. TRAINERS AND INSTRUCTORS:
• Updated requirements for OSH trainers
• Mandatory recording of training activities

Important note: entry into force dates for individual provisions of the 2025 Agreement are staggered; always check the updated version of the implementing decree.`
   },
   kp:{
     it:['Accordo 59/CSR/2025: aggiorna l\'Accordo 2011 su contenuti, modalità e formatori SSL','Ore di formazione lavoratori invariate: basso=8h, medio=12h, alto=16h; aggiornamento 6h/5anni','E-learning ammesso per moduli teorici; le parti pratiche DEVONO essere in presenza','D.L. 146/2021: il preposto ha obbligo rafforzato di formazione specifica periodica','Le date di entrata in vigore sono scaglionate — verificare sempre la versione aggiornata'],
     en:['Agreement 59/CSR/2025: updates 2011 Agreement on contents, methods and OSH trainers','Worker training hours unchanged: low=8h, medium=12h, high=16h; update 6h/5years','E-learning allowed for theoretical modules; practical parts MUST be in-person','D.L. 146/2021: supervisor has strengthened mandatory periodic specific training','Entry into force dates are staggered — always check updated version']
   },
   quiz:[
     {q:{it:'L\'Accordo Stato-Regioni 59/CSR/2025 aggiorna quale precedente accordo sulla formazione?',en:'The State-Regions Agreement 59/CSR/2025 updates which previous training agreement?'},
      opts:{it:['Accordo del 26/01/2006','Accordo del 21/12/2011','Accordo del 22/02/2012','Accordo del 07/07/2016'],en:['Agreement of 26/01/2006','Agreement of 21/12/2011','Agreement of 22/02/2012','Agreement of 07/07/2016']},
      ans:1,exp:{it:'L\'Accordo 59/CSR/2025 aggiorna e sostituisce progressivamente l\'Accordo Stato-Regioni del 21/12/2011, che aveva ridefinito la formazione obbligatoria per lavoratori, preposti, dirigenti e datori di lavoro RSPP.',en:'Agreement 59/CSR/2025 progressively updates and replaces the State-Regions Agreement of 21/12/2011, which had redefined mandatory training for workers, supervisors, managers and employer-RSPPs.'}},
     {q:{it:'Riguardo all\'e-learning nell\'Accordo 2025, quale affermazione è corretta?',en:'Regarding e-learning in the 2025 Agreement, which statement is correct?'},
      opts:{it:['Tutta la formazione può essere erogata in e-learning','L\'e-learning è vietato per tutta la formazione SSL','E-learning ammesso per moduli teorici; parti pratiche obbligatoriamente in presenza','L\'e-learning è ammesso solo per il modulo di aggiornamento'],en:['All training can be delivered via e-learning','E-learning is prohibited for all OSH training','E-learning allowed for theoretical modules; practical parts must be in-person','E-learning allowed only for the update module']},
      ans:2,exp:{it:'L\'Accordo 2025 conferma che l\'e-learning è ammissibile per i moduli a contenuto teorico/generale. Le parti pratiche e quelle specifiche per mansione devono essere erogate obbligatoriamente in presenza fisica, per garantire l\'efficacia dell\'apprendimento pratico.',en:'The 2025 Agreement confirms that e-learning is permissible for modules with theoretical/general content. Practical parts and those specific to the job role must be delivered mandatorily in physical presence, to ensure the effectiveness of practical learning.'}},
     {q:{it:'Il D.L. 146/2021 (conv. L. 215/2021) ha rafforzato gli obblighi formativi di quale figura?',en:'D.L. 146/2021 (conv. L. 215/2021) strengthened the training obligations of which figure?'},
      opts:{it:['RSPP','Medico Competente','Preposto','RLS'],en:['RSPP','Occupational Physician','Supervisor (preposto)','RLS']},
      ans:2,exp:{it:'Il D.L. 146/2021 ha modificato l\'Art. 37 del D.Lgs. 81/08 rafforzando gli obblighi formativi del preposto: la formazione specifica è ora obbligatoria con aggiornamento periodico anche in caso di cambio di mansione, e deve avvenire prima dell\'assunzione della funzione.',en:'D.L. 146/2021 amended Art. 37 of D.Lgs. 81/08 strengthening the supervisor\'s training obligations: specific training is now mandatory with periodic update even when changing role, and must take place before taking on the function.'}},
     {q:{it:'Nell\'Accordo 2025, quante ore di aggiornamento sono previste ogni 5 anni per i lavoratori?',en:'In the 2025 Agreement, how many update hours are required every 5 years for workers?'},
      opts:{it:['4 ore','6 ore','8 ore','10 ore'],en:['4 hours','6 hours','8 hours','10 hours']},
      ans:1,exp:{it:'L\'aggiornamento periodico per i lavoratori è di 6 ore ogni 5 anni, indipendentemente dal livello di rischio (basso, medio, alto). La stessa durata di 6 ore si applica anche ai preposti e ai dirigenti per l\'aggiornamento quinquennale.',en:'The periodic update for workers is 6 hours every 5 years, regardless of risk level (low, medium, high). The same 6-hour duration also applies to supervisors and managers for the five-year update.'}}
   ]}

function ProgressBar({value, max, color=C.gold, h=6}) {
  const pct = max > 0 ? Math.min(100, (value/max)*100) : 0;
  return (
    <div style={{background:C.border, borderRadius:99, height:h, overflow:'hidden'}}>
      <div style={{width:`${pct}%`, height:'100%', background:color, borderRadius:99, transition:'width .4s ease'}}/>
    </div>
  );
}

// Simple markdown-ish renderer for asterisk bold and bullet points
function MarkdownText({text, color=C.text}) {
  const lines = text.split('\n');
  return (
    <div style={{color, fontFamily:'Georgia, serif', lineHeight:1.75, fontSize:14}}>
      {lines.map((line, i) => {
        if (!line.trim()) return <div key={i} style={{height:8}}/>;
        const parts = line.split(/\*\*(.*?)\*\*/g);
        const isBullet = line.trim().startsWith('•');
        const isH = line.startsWith('##') || line.match(/^[A-Z].+:$/);
        const content = parts.map((p, j) => j % 2 === 1 ? <strong key={j} style={{color:C.goldText, fontWeight:600}}>{p}</strong> : p);
        if (isBullet) return <div key={i} style={{paddingLeft:16, marginBottom:3, display:'flex', gap:8}}><span style={{color:C.gold, flexShrink:0}}>•</span><span>{content}</span></div>;
        if (isH) return <div key={i} style={{color:C.goldText, fontWeight:700, marginTop:12, marginBottom:4, fontSize:13, letterSpacing:.5, textTransform:'uppercase'}}>{content}</div>;
        return <div key={i} style={{marginBottom:2}}>{content}</div>;
      })}
    </div>
  );
}

  if (view === 'results' && mod && quiz) {
    const pct = quiz.score / mod.quiz.length;
    const grade = pct >= .75 ? {l:lang==='en'?'Excellent!':'Eccellente!',c:C.green,i:'🏆'} : pct >= .5 ? {l:lang==='en'?'Good':'Bene',c:C.gold,i:'⭐'} : {l:lang==='en'?'Keep studying':'Continua a studiare',c:C.red,i:'📚'};

    return (
      <div style={{background:C.bg, minHeight:'100vh', color:C.text, fontFamily:"'IBM Plex Sans', sans-serif", display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:24}}>
        <div style={{background:C.card, borderRadius:16, padding:40, maxWidth:480, width:'100%', textAlign:'center', border:`1px solid ${C.border}`}}>
          <div style={{fontSize:56, marginBottom:16}}>{grade.i}</div>
          <div style={{fontFamily:"'Cinzel', serif", fontSize:24, color:C.white, marginBottom:4}}>{grade.l}</div>
          <div style={{color:C.muted, fontSize:13, marginBottom:24}}>{mod.id} — {mod.title[lang]||mod.title.it}</div>
          
          <div style={{display:'flex', justifyContent:'center', gap:32, marginBottom:24}}>
            <div>
              <div style={{fontFamily:"'Cinzel', serif", fontSize:36, fontWeight:700, color:grade.c}}>{quiz.score}/{mod.quiz.length}</div>
              <div style={{fontSize:11, color:C.muted, textTransform:'uppercase', letterSpacing:1}}>{lang==='en'?'Correct':'Corrette'}</div>
            </div>
            <div>
              <div style={{fontFamily:"'Cinzel', serif", fontSize:36, fontWeight:700, color:C.goldText}}>+{quiz.xpEarned}</div>
              <div style={{fontSize:11, color:C.muted, textTransform:'uppercase', letterSpacing:1}}>XP</div>
            </div>
          </div>

          <div style={{marginBottom:24}}>
            <ProgressBar value={quiz.score} max={mod.quiz.length} color={grade.c} h={8}/>
          </div>

          <div style={{display:'flex', gap:10, flexDirection:'column'}}>
            <button onClick={()=>setView('study')} className="btn-hover"
              style={{background:catColor(mod.cat), color:C.bg, border:'none', borderRadius:8, padding:'11px', fontSize:13, fontWeight:700, cursor:'pointer'}}>
              {lang==='en'?'📖 Back to Module':'📖 Torna al Modulo'}
            </button>
            <button onClick={startQuiz} className="btn-hover"
              style={{background:C.card, color:C.text, border:`1px solid ${C.border}`, borderRadius:8, padding:'11px', fontSize:13, cursor:'pointer'}}>
              {lang==='en'?'🔄 Retry Quiz':'🔄 Riprova il Quiz'}
            </button>
            <button onClick={()=>setView('home')} className="btn-hover"
              style={{background:'transparent', color:C.muted, border:'none', padding:'8px', fontSize:12, cursor:'pointer'}}>
              ← {lang==='en'?'All Modules':'Tutti i Moduli'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ── VIEW: GLOSSARY ──
  if (view === 'glossary') {
    const l = lang === 'en' ? 'en' : 'it';
    return (
      <div style={{background:C.bg, minHeight:'100vh', color:C.text, fontFamily:"'IBM Plex Sans', sans-serif"}}>
        <div style={{background:C.surface, borderBottom:`1px solid ${C.border}`, padding:'12px 20px', display:'flex', alignItems:'center', gap:12}}>
          <button onClick={()=>setView('home')} className="btn-hover"
            style={{background:'transparent', border:`1px solid ${C.border}`, color:C.muted, borderRadius:6, padding:'5px 12px', fontSize:12, cursor:'pointer'}}>
            ← Home
          </button>
          <div style={{fontFamily:"'Cinzel', serif", fontSize:14, letterSpacing:2, color:C.gold}}>
            📖 GLOSSARIO — Termini Chiave D.Lgs. 81/08
          </div>
        </div>
        <div style={{padding:24, maxWidth:720, margin:'0 auto'}}>
          <div style={{marginBottom:16, color:C.muted, fontSize:12}}>
            {lang==='en'?`${GLOSSARY.length} key terms`:`${GLOSSARY.length} termini chiave`}
          </div>
          {GLOSSARY.map(g => (
            <div key={g.term} className="gls-row" style={{borderRadius:8, padding:'12px 16px', marginBottom:8, border:`1px solid ${C.border}`, display:'flex', gap:16, alignItems:'flex-start'}}>
              <div style={{background:C.gold+'22', border:`1px solid ${C.gold}44`, borderRadius:6, padding:'3px 10px', fontSize:11, color:C.goldText, fontFamily:'monospace', fontWeight:700, flexShrink:0, minWidth:80, textAlign:'center'}}>
                {g.term}
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600, color:C.white, fontSize:14, marginBottom:2}}>{g[l]}</div>
                {lang!=='fa' && lang!=='en' && <div style={{color:C.muted, fontSize:12}}>{g.en}</div>}
                {lang!=='fa' && <div style={{color:C.dim, fontSize:11, marginTop:2, direction:'rtl', fontFamily:'Tahoma', textAlign:'right'}}>{g.fa}</div>}
                {lang==='fa' && <div style={{color:C.muted, fontSize:11}}>{g.it}</div>}
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return <div style={{background:C.bg, minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', color:C.text}}>Loading...</div>;
}

    const domNode = document.getElementById("root");
    const root = ReactDOM.createRoot(domNode);
    root.render(React.createElement(App));
  </script>
</body>
</html>
