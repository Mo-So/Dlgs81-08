   curr:{it:`PROGRAMMA UFFICIALE MODULO B — UNITÀ SPECIFICA
Settore: GENERICO (applicabile a tutti i settori)
Argomento: Stress Lavoro-Correlato
(Art. 28 D.Lgs. 81/08 — Accordo Europeo 8/10/2004 — Metodo INAIL)

━━━ CONTENUTI FORMATIVI ━━━

1. DEFINIZIONE DI STRESS LAVORO-CORRELATO
• Accordo Europeo 8 ottobre 2004 (recepito in Italia il 09/06/2008):
  "Uno stato che si accompagna a malessere e disfunzioni fisiche, psicologiche o sociali e che consegue dal fatto che le persone non si sentono in grado di rispondere alle richieste o alle aspettative nei loro confronti"
• Non è una malattia, ma può causare malattia se l'esposizione è intensa e prolungata
• È un rischio lavorativo valutabile e gestibile come gli altri rischi

2. OBBLIGATORIETÀ DELLA VALUTAZIONE (Art. 28 c.1)
• La valutazione del rischio stress lavoro-correlato è OBBLIGATORIA per tutti i DL
• Rientra nella valutazione globale dei rischi (DVR)
• Deve essere effettuata con la partecipazione dell'RLS

3. INDICATORI DI STRESS LAVORO-CORRELATO (Metodo INAIL 2017)
Il metodo INAIL si articola in due livelli:
LIVELLO 1 — Valutazione preliminare (OBBLIGATORIA):
a) Indicatori oggettivi aziendali (eventi sentinella):
   • Indici infortunistici
   • Assenze per malattia
   • Turnover del personale
   • Procedimenti e sanzioni disciplinari
   • Segnalazioni di molestie o violenze
b) Fattori di contenuto del lavoro:
   • Ambiente e attrezzature di lavoro
   • Carichi/ritmi di lavoro
   • Orario di lavoro
c) Fattori di contesto del lavoro:
   • Ruolo nell'ambito dell'organizzazione
   • Autonomia decisionale/controllo
   • Sviluppo di carriera, retribuzione
   • Rapporti interpersonali sul lavoro
   • Interfaccia casa-lavoro

LIVELLO 2 — Valutazione approfondita (solo se il Livello 1 indica rischio non trascurabile):
• Valutazione della percezione soggettiva dei lavoratori (questionari validati)
• Focus group, interviste semistrutturate
• Elaborazione dei risultati e proposta di interventi

4. FATTORI DI RISCHIO DI STRESS
• Carico eccessivo o insufficiente di lavoro
• Mancanza di controllo sul proprio lavoro
• Scarsa partecipazione alle decisioni
• Ruolo ambiguo o conflittuale
• Comunicazione interna carente
• Lavoro a turni e notturno
• Violenza, molestie, mobbing
• Mancanza di supporto dal superiore o dai colleghi

5. CONSEGUENZE DELLO STRESS LAVORO-CORRELATO
Sulla salute del lavoratore:
• Fisiche: cefalea, disturbi cardiovascolari, gastrointestinali, immunologici
• Psicologiche: ansia, depressione, irritabilità, difficoltà di concentrazione
• Comportamentali: abuso di alcol/fumo, assenteismo, errori e incidenti

Sull'organizzazione:
• Aumento del tasso di assenteismo
• Riduzione della produttività
• Aumento degli infortuni (attenzione ridotta)
• Aumento del turnover

6. MISURE DI PREVENZIONE E GESTIONE
• Riorganizzazione del lavoro (carichi, ritmi, orari)
• Chiarificazione dei ruoli e delle responsabilità
• Miglioramento della comunicazione interna
• Percorsi di sviluppo professionale e formazione continua
• Supporto psicologico (EAP — Employee Assistance Program)
• Formazione dei manager sulla gestione dello stress

━━━ NOTE PER SETTORI SPECIFICI ━━━
🏭 LOGISTICA/MAGAZZINO: stress da picchi stagionali, turni notturni, ritmi imposti dai sistemi WMS, monotonia operativa.
📞 CALL CENTER: stress da contatto col pubblico, monitoraggio continuo, obiettivi di produttività rigidi.
🏥 SANITÀ: stress emotivo da contatto col dolore, turni pesanti, responsabilità vitali.
🏢 UFFICI: stress da scadenze, conflitti di ruolo, smart working e isolamento.`, en:`OFFICIAL CURRICULUM MODULE C — MANAGEMENT UNIT 4
(State-Regions Agreement 26/01/2006 — Duration: 4 hours — RSPP only)

━━━ TRAINING CONTENT ━━━

1. CIVIL AND CRIMINAL LIABILITY IN H&S
CRIMINAL LIABILITY:
• Culpable homicide (Art. 589 Criminal Code): in the event of a fatal accident due to H&S violations — up to 7 years' imprisonment
• Personal injuries through negligence (Art. 590 Criminal Code): in the event of serious/very serious injury — up to 3 years
• Administrative sanctions (Art. 55-60 D.Lgs. 81/08): fines and business closure

KEY PRINCIPLE: employer liability is based on the non-delegable nature of the duty of care

2. DELEGATION OF FUNCTIONS (Art. 16)
For a delegation to be legally effective:
• Must be made in WRITING
• Must be accepted in writing by the delegate
• The delegate must have professional competence and all necessary powers
• The delegate must have the financial autonomy needed to fulfil the delegated obligations
• The delegation must be made public within the company
• The delegating employer retains supervisory obligation over the delegate

IMPORTANT: the delegation of Art. 17 duties (DVR + RSPP) is not permitted

3. POSITION OF GUARANTEE (Art. 2087 Civil Code)
• The employer has an obligation to protect the physical integrity and moral wellbeing of workers
• Art. 2087 applies even beyond the specific H&S legislative requirements
• Interpretation of the courts: the employer must adopt ALL measures to prevent harm, including those not expressly provided for by law if reasonably foreseeable

4. RSPP'S LEGAL POSITION
• The RSPP is a CONSULTANT to the employer, not a guarantor
• The RSPP has no personal criminal liability for accidents (unless guilty of wilful misconduct or gross negligence)
• Important: the RSPP may be convicted if they failed to alert the employer to a known risk

5. RECENT CASE LAW ON H&S
Notable cases:
• Supreme Court: the employer is responsible even for risky behaviour by workers if the employer failed to train them adequately
• Organisational deficiency: accident caused by systemic shortcomings → employer and manager liable
• Extension to holding companies: parent company can be liable for safety in subsidiaries

6. ADMINISTRATIVE LIABILITY OF LEGAL ENTITIES (D.Lgs. 231/2001)
• The company itself (as a legal entity) may be held administratively liable for certain offences
• H&S offences (Art. 25-septies): included since 2007
• Applicable sanctions: fines (up to €1,549,370.69 for fatal accidents), business activity suspension, publication of the sentence
• Defence: adoption and effective implementation of a model pursuant to Art. 30 D.Lgs. 81/08

━━━ LEGAL REFERENCES ━━━
• D.Lgs. 81/2008, Art. 16, 55-60
• D.Lgs. 231/2001, Art. 25-septies
• Civil Code, Art. 2087
• Criminal Code, Art. 589-590
• Supreme Court case law on workplace safety`},

   sum:{
     it:`SANZIONI — Titolo XII (Art. 55-60)

Il sistema sanzionatorio del D.Lgs. 81/08 è articolato su tre livelli:

1. DATORE DI LAVORO e DIRIGENTE (Art. 55-56):
• Arresto da 3 a 6 mesi o ammenda da €2.740 a €7.014: mancata elaborazione del DVR, mancata nomina RSPP, mancata designazione addetti emergenze
• Arresto da 2 a 4 mesi o ammenda da €1.096 a €4.384: violazioni in materia di sorveglianza sanitaria, formazione, DPI
• Le sanzioni si raddoppiano se il datore non ha provveduto alla valutazione dei rischi entro i termini prescritti dopo una diffida degli organi di vigilanza

2. PREPOSTO (Art. 56):
• Arresto fino a 2 mesi o ammenda da €491 a €1.474: mancata vigilanza sull'uso dei DPI, mancato intervento in caso di pericolo grave

3. LAVORATORE (Art. 59):
• Arresto fino a 1 mese o ammenda da €219 a €657: mancato utilizzo di DPI forniti, mancata osservanza delle disposizioni impartite dal DL/preposto

Prescrizione obbligatoria (Art. 20 D.Lgs. 758/1994): in caso di violazione della normativa, l'organo di vigilanza (ASL/INL) può emettere una prescrizione con termine per la regolarizzazione. Se il DL adempie e paga 1/4 dell'ammenda entro il termine, il reato si estingue (oblazione).

INFORTUNI E MALATTIE PROFESSIONALI (Art. 53-54):

Denuncia/comunicazione all'INAIL:
• Infortuni con prognosi >3 giorni (escluso quello dell'evento): comunicazione entro 48 ore dal ricevimento del certificato medico
• Infortuni mortali o con pericolo di morte: comunicazione entro 24 ore
• Malattie professionali: comunicazione entro 48 ore dal certificato medico

Registro degli infortuni (Art. 53 c.6): a partire dal D.Lgs. 151/2015 (Jobs Act), il registro cartaceo degli infortuni è stato abolito. Gli infortuni con assenza >1 giorno sono comunicati all'INAIL tramite il sistema informatico; quelli con assenza 1 giorno (escluso quello dell'evento) sono riportati esclusivamente nel registro del datore di lavoro.

Organi di vigilanza (Art. 13-14): ASL (Azienda Sanitaria Locale) e INL (Ispettorato Nazionale del Lavoro). Per settori specifici: Vigili del Fuoco (antincendio), ISPRA (rischi ambientali).`,
     en:`PENALTIES — Title XII (Art. 55-60)

The D.Lgs. 81/08 penalty system is structured on three levels:

1. EMPLOYER and MANAGER (Art. 55-56):
• Arrest 3 to 6 months or fine €2,740 to €7,014: failure to prepare DVR, failure to appoint RSPP, failure to designate emergency staff
• Arrest 2 to 4 months or fine €1,096 to €4,384: violations on health surveillance, training, PPE
• Penalties double if employer has not carried out risk assessment within prescribed deadlines after supervisory authority notice

2. SUPERVISOR (Art. 56):
• Arrest up to 2 months or fine €491 to €1,474: failure to supervise PPE use, failure to intervene in serious danger

3. WORKER (Art. 59):
• Arrest up to 1 month or fine €219 to €657: failure to use provided PPE, non-compliance with instructions from employer/supervisor

Mandatory prescription (Art. 20 D.Lgs. 758/1994): in case of violation, the supervisory authority (ASL/INL) may issue a prescription with a deadline for regularization. If the employer complies and pays 1/4 of the fine within the deadline, the offence is extinguished (oblation).

ACCIDENTS AND OCCUPATIONAL DISEASES (Art. 53-54):

Report/notification to INAIL:
• Accidents with prognosis >3 days (excluding event day): notification within 48 hours of receiving medical certificate
• Fatal accidents or with risk of death: notification within 24 hours
• Occupational diseases: notification within 48 hours of medical certificate

Accident register (Art. 53 c.6): from D.Lgs. 151/2015 (Jobs Act), the paper accident register was abolished. Accidents with absence >1 day are communicated to INAIL via computer system; those with 1-day absence (excluding event day) are recorded only in the employer's register.

Supervisory authorities (Art. 13-14): ASL (Local Health Authority) and INL (National Labour Inspectorate). For specific sectors: Fire Brigade (fire prevention), ISPRA (environmental risks).`

   curr:{it:`PROGRAMMA UFFICIALE MODULO B — UNITÀ SPECIFICA
Settore: GENERICO (applicabile a tutti i settori)
Argomento: Sanzioni, Infortuni e Notifica INAIL
(Titolo I Capo III D.Lgs. 81/08 — Art. 55-61 e Art. 51-54 — D.Lgs. 38/2000)

━━━ CONTENUTI FORMATIVI ━━━

1. IL SISTEMA SANZIONATORIO DEL D.LGS. 81/08 (Art. 55-61)
Tre tipi di sanzioni:
• PENALI: arresto o ammenda (per le violazioni più gravi)
• AMMINISTRATIVE: sanzione pecuniaria amministrativa (per violazioni meno gravi)
• CIVILI: risarcimento del danno al lavoratore infortunato o malato

Principali sanzioni penali per il Datore di Lavoro:
• Mancata redazione DVR: arresto fino a 6 mesi o ammenda da €2.000 a €5.000
• Mancata designazione RSPP: ammenda da €1.500 a €6.000
• Mancata formazione dei lavoratori: arresto fino a 4 mesi o ammenda da €1.315 a €5.370
• Mancata nomina MC quando obbligatorio: ammenda da €1.000 a €4.500
• Mancata attuazione delle misure di prevenzione: arresto fino a 18 mesi

Principali sanzioni per i lavoratori (Art. 59):
• Violazione dell'obbligo di usare i DPI: sanzione amministrativa pecuniaria da €50 a €300
• Mancata partecipazione alla formazione: sanzione amministrativa pecuniaria da €50 a €300

2. LA PRESCRIZIONE OBBLIGATORIA (Art. 20-25 D.Lgs. 758/1994)
• L'organo di vigilanza può impartire al DL una prescrizione per eliminare la violazione
• Termine concesso per adempiere (solitamente 30-90 giorni)
• Se il DL adempie entro il termine: pagamento di 1/4 dell'ammenda massima → estinzione del reato
• Se non adempie: procedimento penale ordinario

3. LA DELEGA DI FUNZIONI (Art. 16)
Perché la delega sia valida:
• Deve risultare da atto scritto con data certa
• Il delegato deve possedere i requisiti di professionalità e di esperienza necessari
• La delega deve attribuire i poteri di organizzazione, gestione e controllo richiesti
• La delega deve attribuire al delegato l'autonomia di spesa necessaria
• L'atto di delega deve essere accettato per iscritto dal delegato
• La delega deve essere adeguatamente pubblicizzata
⚠️ La delega NON esime il DL dalla responsabilità di sorvegliare il delegato

4. LA SORVEGLIANZA E L'ISPEZIONE (Art. 51-54)
Organi di vigilanza:
• ASL / AUSL: vigilanza in quasi tutti i settori
• INAIL: vigilanza su sicurezza nei cantieri e certe industrie
• Ministero del Lavoro: coordinamento nazionale
• VVF: antincendio
• ARPA: rischi ambientali

Poteri degli ispettori:
• Accesso libero ai luoghi di lavoro (senza preavviso)
• Esame di documenti (DVR, registro infortuni, cartelle sanitarie anonime)
• Prelievo di campioni (aria, materiali)
• Diffida, prescrizione, disposizione, sospensione dell'attività lavorativa

5. INFORTUNI SUL LAVORO — DEFINIZIONE E NOTIFICA (Art. 53)
Infortunio sul lavoro: evento traumatico causato da causa violenta in occasione di lavoro, che provoca lesioni fisiche (inabilità temporanea assoluta >3 giorni, invalidità permanente o morte).

Obblighi del Datore di Lavoro:
• Registro degli infortuni: tenuto per tutti gli infortuni (anche quelli che non superano i 3 giorni)
• Denuncia all'INAIL: obbligatoria per infortuni con prognosi >3 giorni, o mortali
  - Entro 2 giorni dalla ricezione del certificato medico (per infortuni non mortali)
  - Entro 24 ore in caso di infortuni mortali o con pericolo di morte
• Denuncia all'ASL: per infortuni mortali, entro 24 ore
• Il MEDICO che referta l'infortunio ha anche lui l'obbligo di notifica

6. MALATTIE PROFESSIONALI — NOTIFICA
• Il MC che rileva una malattia professionale deve denunciarla all'INAIL
• Il DL deve trasmettere all'INAIL la denuncia entro 5 giorni dalla ricezione del certificato

7. L'INAIL — ASSICURAZIONE OBBLIGATORIA (D.Lgs. 38/2000)
• L'assicurazione INAIL è obbligatoria per tutti i lavoratori dipendenti
• Copre: infortuni sul lavoro + malattie professionali
• Premio assicurativo: pagato dal DL (in base al settore ATECO e al salario)
• Prestazioni INAIL: indennizzo economico, rendita per invalidità, cure riabilitative, protesi

━━━ NOTE PER SETTORI SPECIFICI ━━━
🏭 LOGISTICA/MAGAZZINO: infortuni da carrelli elevatori e MMC — spesso gravi → obbligo denuncia INAIL immediata. Registro infortuni sempre aggiornato.
🏗️ CANTIERI: settore con il più alto tasso di infortuni gravi e mortali. Ispezioni frequenti da ASL e INL.
🏥 SANITÀ: punture da ago infetto — classificate come infortuni biologici.
🚛 TRASPORTI: incidenti stradali in itinere e in occasione di lavoro.`, en:`OFFICIAL CURRICULUM MODULE C — MANAGEMENT UNIT 5
(State-Regions Agreement 26/01/2006 — Duration: 4 hours — RSPP only)

━━━ TRAINING CONTENT ━━━

1. ERGONOMICS AND WORK ORGANISATION
• Ergonomics: science that adapts work to the person (not the person to the work)
• Objective: prevent musculoskeletal disorders, fatigue, work-related stress
• Three areas of ergonomics:
  - Physical ergonomics: postures, manual handling, repetitive movements
  - Cognitive ergonomics: mental workload, attention, stress, decision-making
  - Organisational ergonomics: shift work, rest breaks, teamwork

2. WORK-RELATED STRESS (Art. 28, State-Regions Agreement 17/11/2010)
• The DVR must include a risk assessment for work-related stress
• Mandatory methodology: two-step approach
  STEP 1 — Preliminary assessment (mandatory):
  - Sentinel events (absence rates, accidents, turnover, disciplinary procedures)
  - Subjective assessment questionnaire (validated)
  - Results classified: low, medium, high risk
  STEP 2 — In-depth assessment (if medium/high risk in Step 1):
  - Focus groups, individual interviews
  - Organisational analysis

3. NIGHT WORK AND SHIFT WORK (D.Lgs. 66/2003)
• Night work: at least 3 hours between midnight and 5am
• Night workers: at least 3 hours of night work per night for at least 80 days a year
• Maximum night work: 8 hours in a 24h period
• Health surveillance: mandatory for night workers (pre-assignment + periodic)
• Transfer to day work: if the MC deems it medically necessary

4. VDT — VIDEO DISPLAY TERMINALS (Title VII, Art. 172-179)
• VDT workers: those who use screens for >20 hours per week
• Obligations:
  - Ergonomic workstation assessment (screen, keyboard, mouse, chair, lighting)
  - Health surveillance (periodic eye examinations)
  - Mandatory break of 15 minutes every 2 hours of screen use
  - Optional corrective glasses if needed for VDT work

5. MICROCLIMATE AND ENVIRONMENT
Parameters to assess:
• Air temperature (operative temperature): 18-26°C depending on activity
• Relative humidity: 40-60%
• Air velocity: <0.15 m/s for sedentary work, <0.25 m/s for light work
• Radiant temperature (hot work surfaces)
Assessment tool: PMV-PPD Index (Fanger) — reference ISO 7730

6. WORKPLACE DESIGN FOR PREVENTION
Principles of prevention through design:
• Material flow: linear layout, no crossing of pathways
• Workstation height: adjustable for standing/seated transitions
• Storage: racks at heights reachable without ladders (belt-level rule)
• Lighting: uniform without glare, minimum 300 lux for detail work
• Anti-fatigue mats: for prolonged standing work (logistics, assembly)

━━━ LEGAL REFERENCES ━━━
• D.Lgs. 81/2008, Title VII (VDT), Title VI (MMC), Art. 28 (stress)
• D.Lgs. 66/2003 (working hours and night work)
• State-Regions Agreement 17/11/2010 (work-related stress assessment)
• ISO 7730 (thermal comfort), ISO 9241 (ergonomics of VDT systems)`},

   sum:{
     it:`L'Accordo Stato-Regioni 59/CSR/2025 ridefinisce i contenuti, le modalità e la durata della formazione obbligatoria in materia di salute e sicurezza sul lavoro, aggiornando e sostituendo progressivamente l'Accordo del 21/12/2011.

Principali novità:

1. FORMAZIONE LAVORATORI — ore invariate, contenuti aggiornati:
• Rischio basso: 4h generali + 4h specifiche = 8h totali
• Rischio medio: 4h + 8h = 12h totali
• Rischio alto: 4h + 12h = 16h totali
• Aggiornamento: ogni 5 anni (6h)

2. PREPOSTI — rafforzamento del ruolo:
• La normativa (D.L. 146/2021 conv. L. 215/2021) ha modificato l'Art. 19: il preposto è ora tenuto a una formazione specifica obbligatoria con aggiornamento periodico anche quando cambia mansione
• Formazione: percorso lavoratori + 6h specifiche (aggiornamento: 6h ogni 5 anni)

3. DIRIGENTI — aggiornata:
• 16h totali (invariate): struttura modulare aggiornata nei contenuti
• Aggiornamento ogni 5 anni: 6h

4. DATORI DI LAVORO — RSPP in proprio:
• Formazione aggiornata nei contenuti per i DL che svolgono direttamente il ruolo di RSPP (Art. 34)
• Obbligo di aggiornamento periodico

5. MODALITÀ DI EROGAZIONE:
• E-learning ammesso per i moduli generali (teorici)
• Formazione pratica/specifica DEVE avvenire in presenza (non ammessa FAD per le parti pratiche)
• Piattaforme di e-learning devono essere certificate e garantire la tracciabilità

6. DOCENTI E FORMATORI:
• Requisiti aggiornati per i formatori in materia di SSL
• Registrazione delle attività formative obbligatoria

Nota importante: le date di entrata in vigore delle singole disposizioni dell'Accordo 2025 sono scaglionate; verificare sempre la versione aggiornata del decreto attuativo.`,
     en:`The State-Regions Agreement 59/CSR/2025 redefines the contents, methods and duration of mandatory occupational health and safety training, progressively updating and replacing the Agreement of 21/12/2011.

Key changes:

1. WORKER TRAINING — hours unchanged, updated contents:
• Low risk: 4h general + 4h specific = 8h total
• Medium risk: 4h + 8h = 12h total
• High risk: 4h + 12h = 16h total
• Update: every 5 years (6h)

2. SUPERVISORS — strengthened role:
• Legislation (D.L. 146/2021 conv. L. 215/2021) amended Art. 19: supervisor now required to undergo specific mandatory training with periodic update even when changing role
• Training: worker path + 6h specific (update: 6h every 5 years)

3. MANAGERS — updated:
• 16h total (unchanged): updated modular content structure
• Update every 5 years: 6h

4. EMPLOYERS — acting as RSPP:
• Updated content training for employers acting directly as RSPP (Art. 34)
• Mandatory periodic update requirement

5. DELIVERY METHODS:
• E-learning permitted for general (theoretical) modules
• Practical/specific training MUST be in-person (distance learning not permitted for practical parts)
• E-learning platforms must be certified and ensure traceability

6. TRAINERS AND INSTRUCTORS:
• Updated requirements for OSH trainers
• Mandatory recording of training activities

Important note: entry into force dates for individual provisions of the 2025 Agreement are staggered; always check the updated version of the implementing decree.`

   curr:{it:`PROGRAMMA UFFICIALE — AGGIORNAMENTO NORMATIVO 2025
Argomento: Accordo Stato-Regioni 59/CSR/2025 — Nuova Formazione SSL
(Aggiornamento dell'Accordo Stato-Regioni 21/12/2011)

━━━ CONTENUTI DELL'AGGIORNAMENTO ━━━

1. CONTESTO E MOTIVAZIONE DEL NUOVO ACCORDO
• L'Accordo Stato-Regioni 59/CSR/2025 aggiorna e sostituisce progressivamente l'Accordo del 21/12/2011
• Motivazione: aggiornamento delle metodologie formative, recepimento del D.L. 146/2021 (sul preposto) e allineamento con le nuove tecnologie (e-learning)
• Entrata in vigore: scaglionata per categoria di lavoratori — verificare sempre la versione aggiornata del decreto attuativo

2. LAVORATORI — MONTE ORE INVARIATO, CONTENUTI AGGIORNATI
• Rischio basso: 4h generali + 4h specifiche = 8h totali
• Rischio medio: 4h generali + 8h specifiche = 12h totali
• Rischio alto: 4h generali + 12h specifiche = 16h totali
• Aggiornamento: ogni 5 anni — 6h (invariato)
• Novità: aggiornamento dei contenuti dei moduli generali e specifici

3. PREPOSTI — RUOLO RAFFORZATO (D.L. 146/2021 conv. L. 215/2021)

  - Il preposto è ora OBBLIGATO a seguire specifica formazione periodica

  - Periodicità aggiornamento: ogni 5 anni (6h)
• L'Accordo 2025 definisce i contenuti aggiornati per la formazione del preposto

4. DIRIGENTI — CONTENUTI AGGIORNATI

• Aggiornamento ogni 5 anni: 6h
• Nuova struttura modulare aggiornata nei contenuti

5. DATORI DI LAVORO CHE SVOLGONO I COMPITI DI RSPP (Art. 34)

6. MODALITÀ DI EROGAZIONE — E-LEARNING

8. ATTESTATI E RICONOSCIMENTO

• I nuovi attestati seguono il format aggiornato dall'Accordo 2025
• Il Libretto Formativo del Cittadino può essere aggiornato con i nuovi attestati

━━━ NOTE PER SETTORI SPECIFICI ━━━
🏭 Tutti i settori: l'aggiornamento quinquennale è ora rafforzato e obbligatorio senza eccezioni.
🏭 LOGISTICA/MAGAZZINO: i preposti (capi turno, responsabili di reparto) devono adeguarsi ai nuovi obblighi di formazione specifica previsti dal D.L. 146/2021.
🏗️ CANTIERI: alta attenzione al ruolo del preposto (capocantiere) — aggiornamento obbligatorio.

━━━ RIFERIMENTI NORMATIVI ━━━
• Accordo Stato-Regioni 59/CSR/2025
• D.L. 21 ottobre 2021, n. 146, convertito con modificazioni dalla L. 215/2021
• D.Lgs. 81/2008, Art. 34, 37, 19
• Accordo Stato-Regioni 21/12/2011 (in fase di sostituzione progressiva)`, en:`OFFICIAL CURRICULUM MODULE C — MANAGEMENT UNIT 6
(State-Regions Agreement 26/01/2006 — Duration: 4 hours — RSPP only)

━━━ TRAINING CONTENT ━━━

1. FIRE PREVENTION AND FIRE SAFETY
• D.M. 10/03/1998 (Fire Safety Criteria): assessment of fire risk and classification
• D.M. 03/08/2015 (Fire Prevention Code — CPI): new integrated approach
• Fire risk levels:
  - LOW: small offices, shops, low-occupancy businesses
  - MEDIUM: manufacturing companies, multi-storey buildings, public premises
  - HIGH: hospitals, high-density occupancy buildings, chemical industries

2. FIRE TRIANGLE AND PRINCIPLES OF FIRE-FIGHTING
The fire triangle: FUEL + OXYGEN + IGNITION SOURCE
Types of fire:
• Class A: solid materials (wood, paper, textiles) — water, foam, dry powder
• Class B: flammable liquids (petrol, acetone, oils) — foam, CO2, dry powder
• Class C: flammable gases (LPG, methane) — dry powder, closure of the source
• Class D: reactive metals (sodium, lithium) — specific agents only
• Class E (or F): electrical equipment — CO2, dry powder (NEVER water)
• Class F: cooking oils and fats — specific K class agents

3. FIRE SAFETY CERTIFICATES (CPI)
• Issued by the Local Fire Brigade Command
• Mandatory for activities listed in D.P.R. 151/2011 (3 categories by risk level)
• Validity: 5 years (or 10 years for category A activities)
• Subject to periodic renewal and inspection by the Fire Brigade

4. EMERGENCY AND EVACUATION PLAN
Mandatory elements:
• Identification of all exit routes and emergency exits
• Identification of assembly points
• List of emergency workers with specific tasks
• Procedures for raising the alarm and notifying emergency services
• Procedures for assisting persons with reduced mobility
• Frequency of evacuation drills (at least 1 per year)

5. EXPLOSIVE ATMOSPHERES — ATEX (Title XI, Art. 287-297)
• ATEX: areas where explosive atmospheres may form (mixtures of flammable gases/dust with air)
• Zoning:
  - Zone 0/20: explosive atmosphere continuously present
  - Zone 1/21: explosive atmosphere likely under normal operating conditions
  - Zone 2/22: explosive atmosphere unlikely but possible
• Requirements: ATEX-certified equipment, ATEX document, worker training

6. SPECIFIC FIRE RISK IN LOGISTICS/WAREHOUSES
Main risks:
• Pallets and packaging (highly flammable)
• Battery charging stations (hydrogen gas emissions)
• Combustion-engine forklifts (fuel)
• Hazardous goods storage (ADR categories)
Required measures:
• Sprinkler systems above a certain size
• Smoke detection systems
• Segregation of incompatible hazardous materials
• Specific fire evacuation plan (geometry of aisles and exits)

━━━ LEGAL REFERENCES ━━━
• D.M. 10/03/1998 (Fire Safety Criteria)
• D.M. 03/08/2015 (Fire Prevention Code)
• D.P.R. 151/2011 (activities subject to fire safety controls)
• D.Lgs. 81/2008, Title XI, Art. 287-297 (ATEX)
• EU Dir. 1999/92/EC (ATEX for workers)`},

const catColor = (cat) => cat === 'A' ? C.catA : cat === 'B' ? C.catB : C.catC;

function ProgressBar({value, max, color=C.gold, h=6}) {
  const pct = max > 0 ? Math.min(100, (value/max)*100) : 0;
  return (
    <div style={{background:C.border, borderRadius:99, height:h, overflow:'hidden'}}>
      <div style={{width:`${pct}%`, height:'100%', background:color, borderRadius:99, transition:'width .4s ease'}}/>
    </div>
  );
}

// Simple markdown-ish renderer for asterisk bold and bullet points
function MarkdownText({text, color=C.text}) {
  const lines = text.split('\n');
  return (
    <div style={{color, fontFamily:'Georgia, serif', lineHeight:1.75, fontSize:14}}>
      {lines.map((line, i) => {
        if (!line.trim()) return <div key={i} style={{height:8}}/>;
        const parts = line.split(/\*\*(.*?)\*\*/g);
        const isBullet = line.trim().startsWith('•');
        const isH = line.startsWith('##') || line.match(/^[A-Z].+:$/);
        const content = parts.map((p, j) => j % 2 === 1 ? <strong key={j} style={{color:C.goldText, fontWeight:600}}>{p}</strong> : p);
        if (isBullet) return <div key={i} style={{paddingLeft:16, marginBottom:3, display:'flex', gap:8}}><span style={{color:C.gold, flexShrink:0}}>•</span><span>{content}</span></div>;
        if (isH) return <div key={i} style={{color:C.goldText, fontWeight:700, marginTop:12, marginBottom:4, fontSize:13, letterSpacing:.5, textTransform:'uppercase'}}>{content}</div>;
        return <div key={i} style={{marginBottom:2}}>{content}</div>;
      })}
    </div>
  );
}

function App() {
  const [view, setView]   = useState('home');  // home | study | quiz | results | glossary
  const [mod, setMod]     = useState(null);
  const [lang, setLang]   = useState('it');
  const [tab, setTab]     = useState('summary');
  const [quiz, setQuiz]   = useState(null);
  const [progress, setProgress] = useState({xp:0, done:{}, best:{}});
  const [expandCurr, setExpandCurr] = useState(false);

  // Load saved progress
  useEffect(() => {
    window.storage?.get('dlgs81_v1').then(r => {
      if (r) try { setProgress(JSON.parse(r.value)); } catch(e) {}
    }).catch(()=>{});
    // font injection
    const l = document.createElement('link');
    l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap';
    document.head.appendChild(l);
  }, []);

  const save = (p) => window.storage?.set('dlgs81_v1', JSON.stringify(p)).catch(()=>{});

  const openModule = (m) => { setMod(m); setTab('summary'); setView('study'); setExpandCurr(false); };

  const startQuiz = () => {
    setQuiz({idx:0, selected:null, revealed:false, answers:[], finished:false, score:0, xpEarned:0});
    setView('quiz');
  };

  const selectAnswer = (i) => {
    if (quiz.revealed) return;
    setQuiz(q => ({...q, selected:i, revealed:true}));
  };

  const nextQ = () => {
    const newAnswers = [...quiz.answers, quiz.selected];
    const isLast = quiz.idx + 1 >= mod.quiz.length;
    if (isLast) {
      const score = newAnswers.filter((a, i) => a === mod.quiz[i].ans).length;
      const pct = score / mod.quiz.length;
      const xp = Math.round(pct * 50) + 10;
      setProgress(prev => {
        const next = {
          xp: prev.xp + xp,
          done: {...prev.done, [mod.id]: true},
          best: {...prev.best, [mod.id]: Math.max(prev.best[mod.id]||0, score)}
        };

          <div style={{display:'flex', justifyContent:'center', gap:32, marginBottom:24}}>
            <div>
              <div style={{fontFamily:"'Cinzel', serif", fontSize:36, fontWeight:700, color:grade.c}}>{quiz.score}/{mod.quiz.length}</div>
              <div style={{fontSize:11, color:C.muted, textTransform:'uppercase', letterSpacing:1}}>{lang==='en'?'Correct':'Corrette'}</div>
            </div>
            <div>
              <div style={{fontFamily:"'Cinzel', serif", fontSize:36, fontWeight:700, color:C.goldText}}>+{quiz.xpEarned}</div>
              <div style={{fontSize:11, color:C.muted, textTransform:'uppercase', letterSpacing:1}}>XP</div>
            </div>
          </div>

          <div style={{marginBottom:24}}>
            <ProgressBar value={quiz.score} max={mod.quiz.length} color={grade.c} h={8}/>
          </div>

          <div style={{display:'flex', gap:10, flexDirection:'column'}}>
            <button onClick={()=>setView('study')} className="btn-hover"
              style={{background:catColor(mod.cat), color:C.bg, border:'none', borderRadius:8, padding:'11px', fontSize:13, fontWeight:700, cursor:'pointer'}}>
              {lang==='en'?'📖 Back to Module':'📖 Torna al Modulo'}
            </button>
            <button onClick={startQuiz} className="btn-hover"
              style={{background:C.card, color:C.text, border:`1px solid ${C.border}`, borderRadius:8, padding:'11px', fontSize:13, cursor:'pointer'}}>
              {lang==='en'?'🔄 Retry Quiz':'🔄 Riprova il Quiz'}
            </button>
            <button onClick={()=>setView('home')} className="btn-hover"
              style={{background:'transparent', color:C.muted, border:'none', padding:'8px', fontSize:12, cursor:'pointer'}}>
              ← {lang==='en'?'All Modules':'Tutti i Moduli'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ── VIEW: GLOSSARY ──
  if (view === 'glossary') {
    const l = lang === 'en' ? 'en' : 'it';
    return (
      <div style={{background:C.bg, minHeight:'100vh', color:C.text, fontFamily:"'IBM Plex Sans', sans-serif"}}>
        <div style={{background:C.surface, borderBottom:`1px solid ${C.border}`, padding:'12px 20px', display:'flex', alignItems:'center', gap:12}}>
          <button onClick={()=>setView('home')} className="btn-hover"
            style={{background:'transparent', border:`1px solid ${C.border}`, color:C.muted, borderRadius:6, padding:'5px 12px', fontSize:12, cursor:'pointer'}}>
            ← Home
          </button>
          <div style={{fontFamily:"'Cinzel', serif", fontSize:14, letterSpacing:2, color:C.gold}}>
            📖 GLOSSARIO — Termini Chiave D.Lgs. 81/08
          </div>
        </div>
        <div style={{padding:24, maxWidth:720, margin:'0 auto'}}>
          <div style={{marginBottom:16, color:C.muted, fontSize:12}}>
            {lang==='en'?`${GLOSSARY.length} key terms`:`${GLOSSARY.length} termini chiave`}
          </div>
          {GLOSSARY.map(g => (
            <div key={g.term} className="gls-row" style={{borderRadius:8, padding:'12px 16px', marginBottom:8, border:`1px solid ${C.border}`, display:'flex', gap:16, alignItems:'flex-start'}}>
              <div style={{background:C.gold+'22', border:`1px solid ${C.gold}44`, borderRadius:6, padding:'3px 10px', fontSize:11, color:C.goldText, fontFamily:'monospace', fontWeight:700, flexShrink:0, minWidth:80, textAlign:'center'}}>
                {g.term}
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600, color:C.white, fontSize:14, marginBottom:2}}>{g[l]}</div>
                {lang!=='fa' && lang!=='en' && <div style={{color:C.muted, fontSize:12}}>{g.en}</div>}
                {lang!=='fa' && <div style={{color:C.dim, fontSize:11, marginTop:2, direction:'rtl', fontFamily:'Tahoma', textAlign:'right'}}>{g.fa}</div>}
                {lang==='fa' && <div style={{color:C.muted, fontSize:11}}>{g.it}</div>}
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return <div style={{background:C.bg, minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', color:C.text}}>Loading...</div>;
}

    const domNode = document.getElementById("root");
    const root = ReactDOM.createRoot(domNode);
    root.render(React.createElement(App));
  </script>
</body>
</html>
