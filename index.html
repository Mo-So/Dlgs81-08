{id:'A1',cat:'A',order:1,icon:'⚖️',hrs:3,
 title:{it:'Quadro Normativo',en:'Legislative Framework'},
 sub:{it:'D.Lgs. 81/08 · Struttura e campo di applicazione',en:'D.Lgs. 81/08 · Structure and scope'},
 arts:['Art. 1','Art. 2','Art. 3','Art. 17'],
 sum:{it:`Il D.Lgs. 81/2008 (Testo Unico SSL) è in vigore dal 15/05/2008. Ha abrogato il D.Lgs. 626/1994 e unificato oltre 20 normative previgenti.

Campo di applicazione (Art. 3): tutti i settori privati e pubblici, tutte le tipologie di rischio, senza esclusioni di categoria.

Principio guida: massima sicurezza tecnologicamente fattibile. Il Datore di Lavoro (DL) è il principale soggetto obbligato.

Art. 17 — Obblighi NON delegabili del DL:
• Valutazione di tutti i rischi e redazione del DVR
• Designazione dell'RSPP

Tutti gli altri obblighi (formazione, DPI, emergenze) possono essere delegati ai dirigenti per iscritto.`,
   en:`D.Lgs. 81/2008 (Consolidated H&S Law) entered into force 15/05/2008. It repealed D.Lgs. 626/1994 and consolidated 20+ previous regulations.

Scope (Art. 3): all private and public sectors, all risk types — no category exclusions.

Guiding principle: maximum technologically feasible safety. The Employer is the primary duty-holder.

Art. 17 — NON-delegable employer duties:
• Risk assessment of all risks + drafting DVR
• Designation of the RSPP

All other duties (training, PPE, emergencies) may be formally delegated to managers.`},

    en:['D.Lgs. 81/08 repeals 626/94 and consolidates all previous H&S legislation','Applies to all sectors and all risk types without exception','Art. 2 defines: employer, manager, supervisor, worker, RSPP, RLS, MC','Principle: maximum technologically feasible safety','Art. 17: DVR + RSPP designation = the 2 only NON-delegable duties']},

  {q:{it:'Il D.Lgs. 81/08 si applica a:',en:'D.Lgs. 81/08 applies to:'},opts:{it:['Solo privati con >15 dipendenti','Solo settori ad alto rischio','Tutti i settori pub. e priv., tutte le tipologie di rischio','Solo lavoratori subordinati'],en:['Only private employers with >15 employees','Only high-risk sectors','All public and private sectors, all risk types','Only employed workers']},ans:2,exp:{it:'Art. 3: il decreto si applica a tutti i settori privati e pubblici e a tutte le tipologie di rischio senza eccezioni di categoria lavorativa.',en:'Art. 3: applies to all private and public sectors and all risk types, without worker category exceptions.'}},
  {q:{it:"Chi è il 'preposto' secondo Art. 2?",en:"Who is the 'preposto' (supervisor) per Art. 2?"},opts:{it:["Chi dirige l'impresa","Chi rappresenta i lavoratori per la sicurezza","Chi sovrintende l'attività e vigila sull'attuazione degli obblighi","Chi effettua la sorveglianza sanitaria"],en:['Who manages the company','Who represents workers for safety','Who supervises work and monitors compliance','Who performs health surveillance']},ans:2,exp:{it:"Il preposto (Art. 2) è chi sovrintende l'attività lavorativa, verifica l'attuazione degli obblighi e ha il dovere di interrompere l'attività in caso di pericolo grave.",en:'The preposto (Art. 2) supervises work activity, monitors compliance, and has the duty to stop work in case of serious danger.'}}

{id:'A2',cat:'A',order:2,icon:'👥',hrs:4,
 title:{it:'Figure della Sicurezza',en:'Safety Roles & Duties'},
 sub:{it:'RSPP, RLS, MC, DL, Dirigente, Preposto — Art. 17-20, 31-34, 50',en:'RSPP, RLS, MC, Employer, Manager, Supervisor — Art. 17-20, 31-34, 50'},
 arts:['Art. 17','Art. 18','Art. 19','Art. 20','Art. 31','Art. 34','Art. 50'],
 sum:{it:`Datore di Lavoro (Art. 17-18): obblighi NON delegabili = DVR + nomina RSPP. Obblighi delegabili: formazione, DPI, misure di prevenzione, sorveglianza sanitaria, emergenze.

Dirigente (Art. 18): attua le direttive del DL organizzando le risorse. Ha gli stessi obblighi del DL in quanto applicabili alla sua funzione.

Preposto (Art. 19): sovrintende l'attività lavorativa, verifica l'uso dei DPI, segnala non conformità al DL/dirigente. DEVE interrompere l'attività in caso di pericolo grave e immediato — senza attendere autorizzazione.

RSPP (Art. 31-33): coadiuva il DL nella valutazione dei rischi. Nominato dal DL. Formazione: Mod. A (28h) + B (settoriale) + C (24h, solo per RSPP).

Art. 34: il DL può svolgere direttamente i compiti di RSPP (aziende ≤30 add. in certi settori, previo Mod. A+B).

RLS (Art. 50): eletto/designato dai lavoratori. Diritti: accesso ai luoghi di lavoro, consultazione DVR, riunione periodica, ricorso alle autorità. Nessun potere sanzionatorio.

Medico Competente (Art. 25, 41): sorveglianza sanitaria, collaborazione alla valutazione dei rischi, giudizi di idoneità alla mansione specifica.`,
   en:`Employer (Art. 17-18): NON-delegable = DVR + RSPP appointment. Delegable: training, PPE, prevention measures, health surveillance, emergencies.

Manager (Art. 18): implements employer directives by organizing resources. Same applicable obligations as employer.

Supervisor (Art. 19): supervises work, verifies PPE use, reports non-conformities. MUST stop work in case of serious and immediate danger — without waiting for authorization.

RSPP (Art. 31-33): assists employer in risk assessment. Appointed by employer. Training: Mod. A (28h) + B (sector-specific) + C (24h, RSPP only).

Art. 34: employer can directly act as RSPP (companies ≤30 workers in some sectors, after completing Mod. A+B).

RLS (Art. 50): elected/designated by workers. Rights: access all workplaces, consult DVR, periodic meeting, appeal to authorities. No sanctioning power.

Occupational Physician (Art. 25, 41): health surveillance, risk assessment collaboration, fitness-for-duty judgments.`},
 kp:{it:['Art. 17: DVR + nomina RSPP = i 2 soli obblighi NON delegabili del DL',"Art. 19: il preposto DEVE (non solo può) interrompere l'attività in caso di pericolo grave immediato","Art. 31: il SPP (Servizio Prevenzione e Protezione) è obbligatorio in ogni azienda","Art. 34: il DL può fare l'RSPP personalmente (aziende piccole, con formazione adeguata)","Art. 50: l'RLS è eletto dai lavoratori e ha accesso al DVR e a tutti i luoghi di lavoro"],
    en:['Art. 17: DVR + RSPP designation = the 2 only NON-delegable duties','Art. 19: supervisor MUST (not only can) stop work in case of serious and immediate danger','Art. 31: SPP (Prevention and Protection Service) mandatory in every company','Art. 34: employer can personally act as RSPP (small companies, with proper training)','Art. 50: RLS elected by workers and has access to DVR and all workplaces']},
 quiz:[
  {q:{it:"L'RSPP viene nominato da:",en:'The RSPP is appointed by:'},opts:{it:['I lavoratori tramite elezione','Il datore di lavoro','Il medico competente',"L'ASL territoriale"],en:['Workers through election','The employer','The occupational physician','The local health authority']},ans:1,exp:{it:"Art. 17: la designazione dell'RSPP è un obbligo NON delegabile del DL. Il DL nomina l'RSPP, previa consultazione con l'RLS.",en:"Art. 17: RSPP designation is a NON-delegable employer duty. Employer appoints the RSPP after consulting the RLS."}},
  {q:{it:"Il preposto (Art. 19) può interrompere l'attività lavorativa:",en:'The supervisor (Art. 19) can stop work:'},opts:{it:['Solo se autorizzato per iscritto dal DL','Sempre, a propria discrezione','In caso di pericolo grave e immediato, senza attendere autorizzazione','Solo dopo consulto con il medico competente'],en:['Only if authorized in writing by employer','Always, at their own discretion','In case of serious and immediate danger, without waiting for authorization','Only after consulting the occupational physician']},ans:2,exp:{it:"Art. 19: il preposto ha il DOVERE di interrompere l'attività in caso di pericolo grave e immediato. Non è necessaria alcuna autorizzazione preventiva.",en:'Art. 19: supervisor has the DUTY to stop work in case of serious and immediate danger. No prior authorization needed.'}},
  {q:{it:"La formazione obbligatoria per l'RSPP comprende:",en:'Mandatory training for RSPP includes:'},opts:{it:['Solo Modulo A (28h)','Modulo A + B specifico per settore',"Modulo A + B + C (quest'ultimo solo per RSPP)",'Nessuna formazione specifica, basta esperienza'],en:['Module A only (28h)','Module A + B (sector-specific)','Module A + B + C (latter for RSPP only)','No specific training, experience sufficient']},ans:2,exp:{it:"D.Lgs. 81/08 + Accordo S-R 2006: RSPP = Mod. A (28h) + Mod. B (12-68h, settore ATECO) + Mod. C (24h). L'ASPP non deve seguire il Mod. C.",en:'D.Lgs. 81/08 + S-R Agreement 2006: RSPP = Mod. A (28h) + Mod. B (12-68h, ATECO sector) + Mod. C (24h). ASPP does not need Mod. C.'}},
  {q:{it:"L'RLS ha il diritto di:",en:'The RLS has the right to:'},opts:{it:['Redigere il DVR al posto del DL','Accedere a tutti i luoghi di lavoro e consultare il DVR','Comminare sanzioni ai lavoratori inadempienti','Nominare e revocare il medico competente'],en:['Draft DVR in place of employer','Access all workplaces and consult the DVR','Issue sanctions to non-compliant workers','Appoint and revoke the occupational physician']},ans:1,exp:{it:"Art. 50: l'RLS può accedere a tutti i luoghi di lavoro, consultare il DVR, ricevere informazioni sui rischi, partecipare alla riunione periodica. Non ha poteri sanzionatori.",en:'Art. 50: RLS can access all workplaces, consult DVR, receive risk information, participate in periodic meeting. No sanctioning powers.'}}
 ]},

{id:'A3',cat:'A',order:3,icon:'📋',hrs:4,
 title:{it:'Valutazione dei Rischi e DVR',en:'Risk Assessment & DVR'},
 sub:{it:'Art. 28-29 · Contenuti, firme, aggiornamento, DUVRI',en:'Art. 28-29 · Contents, signatures, updating, DUVRI'},
 arts:['Art. 26','Art. 28','Art. 29'],
 sum:{it:`Valutazione dei Rischi (Art. 28): il DL deve valutare TUTTI i rischi per salute e sicurezza — inclusi rischi particolari: stress lavoro-correlato, lavoratrici gestanti, differenze di genere/età/provenienza.

Contenuti DVR (Art. 28 c.2):
• Relazione sulla valutazione di tutti i rischi
• Misure di prevenzione e protezione adottate
• Programma di miglioramento nel tempo
• Procedure per l'attuazione delle misure
• Nominativi di RSPP, RLS, MC
• Mansioni che espongono a rischi specifici

Redazione e firma (Art. 29): DVR firmato da DL + RSPP + MC (ove nominato), con data certa. La firma dell'RLS non è richiesta per la validità. Nuove imprese: DVR entro 90 giorni dall'avvio.

Aggiornamento: modifiche significative al processo produttivo, infortuni significativi, indicazione della sorveglianza sanitaria.

DUVRI (Art. 26): obbligatorio in tutti i contratti di appalto/subappalto quando le attività di più imprese interferiscono nello stesso luogo di lavoro.`,
   en:`Risk Assessment (Art. 28): employer must assess ALL health and safety risks — including specific risks: work-related stress, pregnant workers, gender/age/origin differences.

DVR contents (Art. 28 c.2):
• Report on assessment of all risks
• Prevention and protection measures adopted
• Improvement program over time
• Implementation procedures for measures
• Names of RSPP, RLS, MC
• Roles exposing workers to specific risks

Drafting and signing (Art. 29): DVR signed by employer + RSPP + MC (where appointed), with certified date. RLS signature not required for validity. New companies: DVR within 90 days of starting.

Update: significant production process changes, significant accidents, health surveillance indication.

DUVRI (Art. 26): mandatory in all outsourcing/subcontracting contracts when multiple companies' activities interfere in the same workplace.`},
 kp:{it:['La VdR deve coprire TUTTI i rischi: fisici, chimici, biologici, organizzativi, stress, differenze di genere/età','DVR firmato da: DL + RSPP + MC (ove nominato) — la firma RLS non è richiesta',"Nuove imprese: DVR entro 90 giorni dall'avvio dell'attività",'DUVRI (Art. 26): obbligatorio in contratti appalto/subappalto con interferenze tra imprese','Il DVR va aggiornato in caso di modifiche significative, infortuni rilevanti o indicazione del MC'],
    en:['Risk assessment must cover ALL risks: physical, chemical, biological, organizational, stress, gender/age differences','DVR signed by: employer + RSPP + MC (where appointed) — RLS signature not required','New companies: DVR within 90 days of starting activity','DUVRI (Art. 26): mandatory in outsourcing/subcontracting with multi-company interferences','DVR updated for significant changes, relevant accidents, or MC indication']},
 quiz:[
  {q:{it:'Il DVR deve essere firmato da:',en:'The DVR must be signed by:'},opts:{it:['Solo dal datore di lavoro','DL, RSPP e RLS','DL, RSPP e MC (ove nominato)',"Da tutti i lavoratori dell'azienda"],en:['Employer only','Employer, RSPP and RLS','Employer, RSPP and MC (where appointed)','All company workers']},ans:2,exp:{it:"Art. 28: il DVR deve recare data certa e la firma del DL, RSPP e MC (ove nominato). La firma dell'RLS non è richiesta per la validità del documento.",en:'Art. 28: DVR must bear certified date and signatures of employer, RSPP and MC (where appointed). RLS signature not required for document validity.'}},
  {q:{it:'Il DVR deve essere aggiornato in caso di:',en:'DVR must be updated when:'},opts:{it:['Ogni nuovo assunto','Ogni 3 anni per legge','Modifiche al processo produttivo, infortuni significativi, indicazione sorveglianza sanitaria',"Solo su richiesta dell'ASL"],en:['Each new hire','Every 3 years by law','Production changes, significant accidents, health surveillance indication','Only on ASL request']},ans:2,exp:{it:"Art. 29 c.3: il DVR va aggiornato in caso di modifiche significative al processo/organizzazione, infortuni rilevanti, o quando la sorveglianza sanitaria ne evidenzia la necessità.",en:'Art. 29 c.3: DVR updated for significant changes to process/organization, relevant accidents, or when health surveillance indicates the need.'}},
  {q:{it:'Cosa deve obbligatoriamente contenere il DVR oltre alla valutazione dei rischi?',en:'What must DVR mandatorily contain beyond the risk assessment?'},opts:{it:['CV di tutti i lavoratori','Programma di miglioramento e nominativi RSPP/RLS/MC','Contratti assicurativi INAIL','Planimetria aziendale in scala'],en:['CVs of all workers','Improvement program and names of RSPP/RLS/MC','INAIL insurance contracts','Scaled company floor plan']},ans:1,exp:{it:'Art. 28 c.2: il DVR deve contenere misure di prevenzione adottate, programma di miglioramento, procedure di attuazione, nominativi di RSPP/RLS/MC, mansioni a rischio specifico.',en:'Art. 28 c.2: DVR must contain prevention measures, improvement program, implementation procedures, names of RSPP/RLS/MC, roles with specific risks.'}},
  {q:{it:'Il DUVRI è obbligatorio:',en:'DUVRI is mandatory:'},opts:{it:['Aziende >50 dipendenti','Contratti appalto/subappalto con interferenze tra attività di più imprese','Solo nei cantieri temporanei e mobili','Acquisto di nuovi macchinari'],en:['Companies >50 employees','Outsourcing/subcontracting with multi-company activity interferences','Only in temporary construction sites','Purchase of new machinery']},ans:1,exp:{it:'Art. 26: il DUVRI è redatto dal DL committente per eliminare/ridurre i rischi da interferenze tra attività di diverse imprese nello stesso luogo di lavoro.',en:'Art. 26: DUVRI drafted by client employer to eliminate/reduce risks from interferences between different companies in the same workplace.'}}
 ]},

{id:'A4',cat:'A',order:4,icon:'🎓',hrs:3,
 title:{it:'Formazione e Informazione',en:'Training & Information'},
 sub:{it:'Art. 36-37 · Accordo Stato-Regioni 21/12/2011',en:'Art. 36-37 · State-Regions Agreement 21/12/2011'},
 arts:['Art. 36','Art. 37'],
 sum:{it:`Informazione (Art. 36): ogni lavoratore deve ricevere informazioni su rischi aziendali e specifici della propria mansione, procedure di emergenza/PS/antincendio, nominativi di RSPP/MC/RLS.

Formazione (Art. 37): formazione sufficiente e adeguata. Deve avvenire durante l'orario di lavoro, senza oneri economici per i lavoratori. Occasioni obbligatorie: assunzione, cambio mansione, nuove attrezzature, nuove sostanze pericolose.

Accordo Stato-Regioni 21/12/2011:
• Lavoratori rischio basso: 4h generali + 4h specifiche = 8h totali
• Lavoratori rischio medio: 4h + 8h = 12h totali
• Lavoratori rischio alto: 4h + 12h = 16h totali
• Preposti: percorso lavoratori + 8h specifiche aggiuntive
• Dirigenti: 16h (mod. A 6h + mod. B 10h)
• Aggiornamento obbligatorio: ogni 5 anni (6h per lavoratori e preposti)`,
   en:`Information (Art. 36): each worker must receive information on company and job-specific risks, emergency/first aid/fire procedures, names of RSPP/MC/RLS.

Training (Art. 37): sufficient and adequate training. Must occur during working hours, at no cost to workers. Mandatory occasions: hiring, job change, new equipment, new hazardous substances.

State-Regions Agreement 21/12/2011:
• Workers low risk: 4h general + 4h specific = 8h total
• Workers medium risk: 4h + 8h = 12h total
• Workers high risk: 4h + 12h = 16h total
• Supervisors: worker path + 8 additional specific hours
• Managers: 16h (mod. A 6h + mod. B 10h)
• Mandatory update: every 5 years (6h for workers and supervisors)`},
 kp:{it:['Informazione ≠ Formazione: info = comunicare rischi; formazione = sviluppare competenze operative','Art. 37 c.12: formazione durante orario di lavoro, senza costi per i lavoratori','Accordo 2011: rischio basso=8h, medio=12h, alto=16h (4h generali sempre incluse)','Preposti: percorso lavoratori + 8h aggiuntive specifiche per la funzione','Aggiornamento ogni 5 anni obbligatorio per lavoratori, preposti e dirigenti'],
    en:['Information ≠ Training: info = communicating risks; training = developing operational competencies','Art. 37 c.12: training during working hours, at no cost to workers','Agreement 2011: low=8h, medium=12h, high=16h (4h general always included)','Supervisors: worker path + 8 additional specific hours for the role','Mandatory update every 5 years for workers, supervisors and managers']},
 quiz:[
  {q:{it:'Un lavoratore esposto a rischio ALTO deve ricevere almeno:',en:'A HIGH-risk worker must receive at least:'},opts:{it:['8 ore (4+4)','12 ore (4+8)','16 ore (4+12)','24 ore'],en:['8 hours (4+4)','12 hours (4+8)','16 hours (4+12)','24 hours']},ans:2,exp:{it:'Accordo S-R 21/12/2011: rischio basso=4+4=8h, medio=4+8=12h, alto=4+12=16h. Le 4h generali sono comuni a tutti i livelli.',en:'Agreement 21/12/2011: low=4+4=8h, medium=4+8=12h, high=4+12=16h. The 4h general are common to all risk levels.'}},
  {q:{it:"L'aggiornamento della formazione è obbligatorio ogni:",en:'Training update is mandatory every:'},opts:{it:['2 anni','3 anni','5 anni','10 anni'],en:['2 years','3 years','5 years','10 years']},ans:2,exp:{it:'Accordo S-R 21/12/2011: aggiornamento ogni 5 anni per lavoratori (6h), preposti (6h) e dirigenti (6h).',en:'Agreement 21/12/2011: update every 5 years for workers (6h), supervisors (6h) and managers (6h).'}},
  {q:{it:'La formazione aggiuntiva specifica per il PREPOSTO è di:',en:'Additional specific training for SUPERVISORS is:'},opts:{it:['4 ore','6 ore','8 ore','16 ore'],en:['4 hours','6 hours','8 hours','16 hours']},ans:2,exp:{it:'Il preposto deve seguire il percorso lavoratori (in base al rischio) + 8h aggiuntive specifiche per la funzione di preposto.',en:'Supervisor must complete worker path (based on risk level) + 8 additional specific hours for the supervisory role.'}},
  {q:{it:'La formazione dei lavoratori deve avvenire:',en:'Worker training must take place:'},opts:{it:['Anche fuori orario su richiesta del DL','Durante l\'orario di lavoro, senza oneri per il lavoratore','Solo online con piattaforme certificate','In qualsiasi momento a discrezione del DL'],en:['Also outside hours at employer request','During working hours, at no cost to worker','Only online through certified platforms','At any time at employer discretion']},ans:1,exp:{it:'Art. 37 c.12: la formazione deve avvenire durante l\'orario di lavoro e non può comportare oneri economici a carico dei lavoratori.',en:'Art. 37 c.12: training must take place during working hours and cannot involve financial costs for workers.'}}
 ]},

{id:'A5',cat:'A',order:5,icon:'🦺',hrs:3,
 title:{it:'DPI e Segnaletica di Sicurezza',en:'PPE & Safety Signage'},
 sub:{it:'Art. 74-79 (Titolo III) · Art. 161-166 (Titolo V)',en:'Art. 74-79 (Title III) · Art. 161-166 (Title V)'},
 arts:['Art. 74','Art. 76','Art. 77','Art. 78','Art. 161'],
 sum:{it:`DPI (Art. 74): qualsiasi attrezzatura destinata ad essere indossata dal lavoratore per proteggerlo da uno o più rischi.

Gerarchia delle misure di prevenzione — i DPI sono SEMPRE l'ultima opzione:
1. Eliminazione del rischio alla fonte
2. Sostituzione con agenti meno pericolosi
3. Misure di protezione collettiva (recinzioni, aspiratori, ecc.)
4. DPI — solo se le precedenti misure sono insufficienti

Categorie DPI (Art. 76):
• Categoria I: rischi minimi (guanti giardinaggio, occhiali sole) — autodichiarazione fabbricante
• Categoria II: rischi intermedi (caschi, occhiali protettivi, guanti lavoro) — esame CE di tipo
• Categoria III: rischi gravi/mortali (imbracature, respiratori, anticaduta) — esame CE di tipo + sorveglianza produzione

Obblighi DL (Art. 77): fornire DPI adeguati al rischio specifico, marcati CE, istruire i lavoratori, garantire manutenzione.
Obblighi lavoratori (Art. 78): usare correttamente i DPI, averne cura, segnalare difetti al DL o preposto.

Segnaletica (Titolo V, Allegato XXV):
• Divieto: sfondo BIANCO, simbolo nero, banda/bordo ROSSO
• Avvertimento: triangolo GIALLO, simbolo nero
• Prescrizione: sfondo BLU, simbolo bianco
• Salvataggio/emergenza: sfondo VERDE, simbolo bianco`,
   en:`PPE (Art. 74): any equipment designed to be worn by workers to protect from one or more risks.

Prevention measures hierarchy — PPE is ALWAYS the last option:
1. Risk elimination at source
2. Substitution with less hazardous agents
3. Collective protection measures (barriers, extractors, etc.)
4. PPE — only if previous measures are insufficient

PPE Categories (Art. 76):
• Category I: minimal risks (garden gloves, sunglasses) — manufacturer self-declaration
• Category II: intermediate risks (helmets, safety glasses, work gloves) — EC type-examination
• Category III: serious/fatal risks (harnesses, respirators, fall arrest) — EC type-exam + production surveillance

Employer obligations (Art. 77): provide PPE suited to specific risk, CE-marked, train workers, ensure maintenance.
Worker obligations (Art. 78): use PPE correctly, take care of it, report defects to employer or supervisor.

Signage (Title V, Annex XXV):
• Prohibition: WHITE background, black symbol, RED border/band
• Warning: YELLOW triangle, black symbol
• Mandatory: BLUE background, white symbol
• Rescue/emergency: GREEN background, white symbol`},
 kp:{it:["I DPI sono l'ULTIMA misura nella gerarchia: dopo eliminazione, sostituzione, protezione collettiva",'Categoria III (rischi gravi/mortali): richiede esame CE di tipo + sorveglianza della produzione','Art. 77: il DL fornisce DPI adeguati e marcati CE; garantisce formazione e manutenzione','Art. 78: il lavoratore usa correttamente i DPI e segnala qualsiasi difetto','Segnali: divieto=rosso, avvertimento=giallo, prescrizione=blu, salvataggio=verde'],
    en:['PPE is the LAST measure in hierarchy: after elimination, substitution, collective protection','Category III (serious/fatal risks): requires EC type-examination + production surveillance','Art. 77: employer provides adequate CE-marked PPE; ensures training and maintenance','Art. 78: worker correctly uses PPE and reports any defects','Signs: prohibition=red, warning=yellow, mandatory=blue, rescue=green']},
 quiz:[
  {q:{it:'Nella gerarchia delle misure di prevenzione, i DPI si trovano:',en:'In the prevention hierarchy, PPE is placed:'},opts:{it:["Al primo posto, più efficaci","Al secondo posto, dopo l'eliminazione","All'ultimo posto, dopo eliminazione, sostituzione e protezione collettiva","Al terzo posto, prima della protezione collettiva"],en:['First, most effective','Second, after elimination','Last, after elimination, substitution and collective protection','Third, before collective protection']},ans:2,exp:{it:'La gerarchia è: 1) Eliminazione, 2) Sostituzione, 3) Protezione collettiva, 4) DPI. I DPI proteggono solo il singolo lavoratore e non eliminano il rischio alla fonte.',en:'Hierarchy: 1) Elimination, 2) Substitution, 3) Collective protection, 4) PPE. PPE only protects the individual worker and does not eliminate the risk at source.'}},
  {q:{it:'I DPI di Categoria III (rischi gravi/mortali) richiedono:',en:'Category III PPE (serious/fatal risks) requires:'},opts:{it:['Solo marcatura CE autodichiarata dal fabbricante','Approvazione del Ministero del Lavoro','Esame CE di tipo da organismo notificato + sorveglianza della produzione',"Approvazione dell'INAIL"],en:['Only CE marking self-declared by manufacturer','Ministry of Labour approval','EC type-examination by notified body + production surveillance','INAIL approval']},ans:2,exp:{it:'I DPI di Cat. III (imbracature, respiratori, anticaduta, ecc.) richiedono esame CE di tipo da organismo notificato + sorveglianza della produzione. La sola autodichiarazione non è sufficiente.',en:'Category III PPE (harnesses, respirators, fall arrest, etc.) requires EC type-examination by notified body + production surveillance. Self-declaration alone is not sufficient.'}},
  {q:{it:'Quale colore contraddistingue i segnali di PRESCRIZIONE (obbligo)?',en:'Which color characterizes MANDATORY (prescription) safety signs?'},opts:{it:['Rosso','Giallo','Verde','Blu'],en:['Red','Yellow','Green','Blue']},ans:3,exp:{it:'I segnali di prescrizione hanno sfondo BLU con simbolo bianco. Rosso=divieto, Giallo=avvertimento, Verde=salvataggio.',en:'Mandatory signs have BLUE background with white symbol. Red=prohibition, Yellow=warning, Green=rescue.'}},
  {q:{it:"L'Art. 78 stabilisce che il lavoratore, rispetto ai DPI, deve:",en:'Art. 78 states that workers, regarding PPE, must:'},opts:{it:["Scegliere autonomamente i DPI più adatti","Usarli solo quando lo ritiene necessario","Usarli correttamente e segnalare al DL/preposto eventuali difetti","Acquistarli e farsi rimborsare dal DL"],en:['Independently choose most suitable PPE','Use them only when they deem necessary','Use them correctly and report defects to employer/supervisor','Buy them and get reimbursed by employer']},ans:2,exp:{it:'Art. 78: i lavoratori devono usare i DPI conformemente alla formazione ricevuta, averne cura, non apportarvi modifiche, e segnalare al DL/preposto difetti o guasti.',en:'Art. 78: workers must use PPE according to training received, take care of it, not modify it, and report defects or malfunctions to employer/supervisor.'}}
 ]},

{id:'A6',cat:'A',order:6,icon:'🚨',hrs:2,
 title:{it:'Emergenze e Pronto Soccorso',en:'Emergencies & First Aid'},
 sub:{it:'Art. 43-45 · D.M. 388/2003 · Piano di evacuazione',en:'Art. 43-45 · D.M. 388/2003 · Evacuation plan'},
 arts:['Art. 43','Art. 44','Art. 45'],
 sum:{it:`Misure di emergenza (Art. 43): il DL designa i lavoratori addetti all'antincendio, all'evacuazione e al pronto soccorso. Devono essere formati e in numero sufficiente.

Diritto di abbandono (Art. 44): il lavoratore che, in caso di pericolo grave, immediato e non evitabile, abbandona il posto di lavoro non può subire pregiudizio alcuno. Non può essere sanzionato disciplinarmente.

Primo soccorso (Art. 45): il DL adotta i provvedimenti necessari tenendo conto della natura dell'attività e delle dimensioni aziendali.

D.M. 388/2003 — Classificazione aziende:
• Gruppo A: attività con particolari rischi o >5 lavoratori esposti → 16h formazione + aggiornamento triennale (6h)
• Gruppo B: >3 lavoratori, non in A → 12h + aggiornamento triennale (4h)
• Gruppo C: ≤3 lavoratori, non in A → 6h + aggiornamento triennale (2h)

Piano di evacuazione: deve indicare vie di esodo, punti di raccolta, addetti alle emergenze, procedure per avvisare i soccorsi.`,
   en:`Emergency measures (Art. 43): employer designates workers assigned to fire-fighting, evacuation and first aid. They must be trained and sufficient in number.

Right to leave (Art. 44): a worker who, in case of serious, immediate and unavoidable danger, leaves the workplace cannot suffer any prejudice and cannot be disciplinarily sanctioned.

First aid (Art. 45): employer takes necessary measures based on nature of activity and company size.

D.M. 388/2003 — Company classification:
• Group A: activities with particular risks or >5 workers exposed → 16h training + triennial update (6h)
• Group B: >3 workers, not in A → 12h + triennial update (4h)
• Group C: ≤3 workers, not in A → 6h + triennial update (2h)

Evacuation plan: must indicate evacuation routes, assembly points, emergency staff, procedures to notify rescue services.`},
 kp:{it:["Art. 43: il DL nomina e forma gli addetti all'antincendio, evacuazione e PS in numero adeguato",'Art. 44: abbandono del posto per pericolo grave = nessuna sanzione disciplinare possibile','D.M. 388/2003: Gruppo A → 16h + ogni 3 anni 6h; B → 12h+4h; C → 6h+2h','Il piano di emergenza deve essere esposto e aggiornato periodicamente','Gli addetti PS del Gruppo A ricevono la formazione più completa (16h articolata in 3 moduli)'],
    en:['Art. 43: employer appoints and trains fire, evacuation and first aid workers in adequate numbers','Art. 44: leaving workplace due to serious danger = no disciplinary sanction possible','D.M. 388/2003: Group A → 16h + every 3 years 6h; B → 12h+4h; C → 6h+2h','Emergency plan must be posted and periodically updated','Group A first aid workers receive the most complete training (16h in 3 modules)']},
 quiz:[
  {q:{it:'Il D.M. 388/2003 classifica le aziende per il pronto soccorso in:',en:'D.M. 388/2003 classifies companies for first aid into:'},opts:{it:['Livelli 1-2-3','Classi I-II-III','Gruppi A-B-C','Fasce Alto-Medio-Basso rischio'],en:['Levels 1-2-3','Classes I-II-III','Groups A-B-C','High-Medium-Low risk bands']},ans:2,exp:{it:'D.M. 388/2003: Gruppo A (attività pericolose o >5 lavoratori esposti), Gruppo B (>3 lavoratori, non in A), Gruppo C (≤3 lavoratori, non in A).',en:'D.M. 388/2003: Group A (dangerous activities or >5 exposed workers), Group B (>3 workers, not in A), Group C (≤3 workers, not in A).'}},
  {q:{it:'Un lavoratore del Gruppo A deve ricevere formazione PS di:',en:'A Group A first aid worker must receive training of:'},opts:{it:['6 ore','12 ore','16 ore iniziali + 6h aggiornamento ogni 3 anni','24 ore senza aggiornamento'],en:['6 hours','12 hours','16 initial hours + 6h update every 3 years','24 hours with no update']},ans:2,exp:{it:'D.M. 388/2003: Gruppo A = 16h di formazione iniziale (3 moduli) + aggiornamento ogni 3 anni di 6h. Gruppo B = 12h+4h. Gruppo C = 6h+2h.',en:'D.M. 388/2003: Group A = 16h initial training (3 modules) + 6h update every 3 years. Group B = 12h+4h. Group C = 6h+2h.'}},
  {q:{it:'Chi designa i lavoratori addetti alla gestione delle emergenze?',en:'Who designates workers assigned to emergency management?'},opts:{it:['Il medico competente',"L'RLS",'Il datore di lavoro','I Vigili del Fuoco'],en:['The occupational physician','The RLS','The employer','The Fire Brigade']},ans:2,exp:{it:"Art. 43: il datore di lavoro designa preventivamente i lavoratori incaricati dell'attuazione delle misure di prevenzione incendi, evacuazione, salvataggio, primo soccorso e gestione dell'emergenza.",en:'Art. 43: employer preventively designates workers assigned to fire prevention, evacuation, rescue, first aid and emergency management.'}},
  {q:{it:'Secondo Art. 44, un lavoratore che abbandona il posto per pericolo grave può:',en:'Per Art. 44, a worker who leaves their post due to serious danger can:'},opts:{it:['Essere licenziato per abbandono del posto','Ricevere una sanzione disciplinare proporzionata','Non subire pregiudizio alcuno né sanzioni disciplinari','Essere sospeso temporaneamente dal lavoro'],en:['Be dismissed for abandoning post','Receive a proportionate disciplinary sanction','Suffer no prejudice or disciplinary sanction','Be temporarily suspended from work']},ans:2,exp:{it:"Art. 44 c.1: il lavoratore che abbandona il posto in caso di pericolo grave, immediato e non evitabile 'non può subire pregiudizio alcuno'. Nessuna sanzione disciplinare è possibile.",en:"Art. 44 c.1: a worker abandoning their post due to serious, immediate and unavoidable danger 'cannot suffer any prejudice'. No disciplinary sanction is possible."}}
 ]},

{id:'A7',cat:'A',order:7,icon:'🏥',hrs:3,
 title:{it:'Sorveglianza Sanitaria',en:'Health Surveillance'},
 sub:{it:'Art. 41-42 · MC, visite mediche, giudizi di idoneità',en:'Art. 41-42 · Physician, medical visits, fitness judgments'},
 arts:['Art. 25','Art. 38','Art. 39','Art. 41','Art. 42'],
 sum:{it:`Sorveglianza sanitaria (Art. 41): obbligatoria solo nei casi previsti dalla legge (esposizione a rumore, vibrazioni, agenti chimici/biologici, MMC, VDT, lavoro notturno, ecc.). Non è universale.

Tipologie di visite mediche:
• Preventive: prima dell'assunzione o del cambio mansione
• Periodiche: per controllare lo stato di salute e l'idoneità nel tempo
• Su richiesta del lavoratore: se correlate ai rischi professionali (a giudizio del MC)
• In occasione del cambio mansione
• Alla cessazione del rapporto: per agenti cancerogeni e biologici

Giudizi di idoneità (Art. 41 c.6):
• Idoneo alla mansione specifica
• Idoneo con prescrizioni/limitazioni (temporanee o permanenti)
• Inidoneo temporaneo
• Inidoneo permanente

Ricorso (Art. 41 c.9): contro il giudizio del MC, sia il lavoratore che il DL possono ricorrere all'organo di vigilanza territorialmente competente entro 30 giorni.

Nomina MC (Art. 39): nominato dal DL quando è prevista la sorveglianza sanitaria. La cartella sanitaria e di rischio è riservata: il lavoratore ne può richiedere copia alla cessazione del rapporto.`,
   en:`Health surveillance (Art. 41): mandatory only in legally required cases (exposure to noise, vibration, chemical/biological agents, MMC, VDT, night work, etc.). Not universal.

Types of medical visits:
• Preventive: before hiring or job change
• Periodic: to monitor health status and fitness over time
• Upon worker request: if related to professional risks (at MC's judgment)
• Upon job change
• At end of employment: for carcinogenic and biological agents

Fitness judgments (Art. 41 c.6):
• Fit for specific duty
• Partially fit with restrictions/limitations (temporary or permanent)
• Temporarily unfit
• Permanently unfit

Appeal (Art. 41 c.9): against the MC's judgment, both worker and employer can appeal to the territorial supervisory authority within 30 days.

MC appointment (Art. 39): appointed by employer when health surveillance is required. Health and risk records are confidential: worker may request copy upon leaving.`},
 kp:{it:['La sorveglianza sanitaria è obbligatoria SOLO dove previsto dalla legge, non per tutti i lavoratori','Art. 41: il MC può effettuare visite su richiesta del lavoratore se correlate ai rischi professionali','4 giudizi possibili: idoneo, idoneo con prescrizioni, inidoneo temporaneo, inidoneo permanente','Il ricorso avverso il giudizio del MC va presentato entro 30 giorni all\'organo di vigilanza territoriale','La cartella sanitaria è riservata; il lavoratore può richiederne copia alla cessazione'],
    en:['Health surveillance mandatory ONLY where required by law, not for all workers','Art. 41: MC can perform visits upon worker request if related to professional risks','4 possible judgments: fit, partially fit (with restrictions), temporarily unfit, permanently unfit','Appeal against MC judgment within 30 days to territorial supervisory authority','Health record is confidential; worker can request copy upon leaving']},
 quiz:[
  {q:{it:'La sorveglianza sanitaria è obbligatoria:',en:'Health surveillance is mandatory:'},opts:{it:['Per tutti i lavoratori indistintamente','Solo nelle aziende >15 dipendenti','Solo per i lavoratori esposti a specifici rischi previsti dalla legge','Solo per i lavoratori con contratto a tempo indeterminato'],en:['For all workers without exception','Only in companies >15 employees','Only for workers exposed to specific legally-required risks','Only for permanent contract workers']},ans:2,exp:{it:'Art. 41: la sorveglianza sanitaria è effettuata nei casi previsti dalla normativa (esposizione a rumore, vibrazioni, agenti chimici, biologici, cancerogeni, MMC, VDT, lavoro notturno, ecc.), non per tutti.',en:'Art. 41: health surveillance performed in legally required cases (exposure to noise, vibration, chemical, biological, carcinogenic agents, MMC, VDT, night work, etc.), not universally.'}},
  {q:{it:'Il medico competente viene nominato da:',en:'The occupational physician is appointed by:'},opts:{it:["L'ASL territoriale","Il datore di lavoro","L'RSPP","I lavoratori tramite RLS"],en:['The local health authority','The employer','The RSPP','Workers through RLS']},ans:1,exp:{it:"Art. 39 c.1: il medico competente è nominato dal datore di lavoro nei casi in cui è prevista la sorveglianza sanitaria. È uno degli obblighi delegabili del DL.",en:"Art. 39 c.1: occupational physician is appointed by the employer in cases where health surveillance is required. It is one of the employer's delegable duties."}},
  {q:{it:'Entro quanto tempo può essere presentato ricorso avverso il giudizio del MC?',en:'Within what time can an appeal be made against the MC judgment?'},opts:{it:['15 giorni','30 giorni','60 giorni','90 giorni'],en:['15 days','30 days','60 days','90 days']},ans:1,exp:{it:"Art. 41 c.9: avverso i giudizi del MC è ammesso ricorso all'organo di vigilanza territorialmente competente entro trenta giorni dalla comunicazione del giudizio.",en:"Art. 41 c.9: appeal against MC judgment to territorial supervisory authority within thirty days of judgment communication."}},
  {q:{it:'Quali sono i possibili giudizi di idoneità emessi dal MC?',en:'What are the possible fitness judgments issued by the MC?'},opts:{it:['Solo idoneo o inidoneo','Idoneo, idoneo con prescrizioni, inidoneo temporaneo, inidoneo permanente','Idoneo, idoneo con DPI, necessita ulteriori accertamenti','Solo idoneo o sospeso per accertamenti'],en:['Only fit or unfit','Fit, partially fit (with restrictions), temporarily unfit, permanently unfit','Fit, fit with PPE, needs further tests','Only fit or suspended for tests']},ans:1,exp:{it:'Art. 41 c.6: il MC può esprimere 4 giudizi: idoneo alla mansione, idoneo con prescrizioni/limitazioni (temp. o perm.), inidoneo temporaneo, inidoneo permanente. Il giudizio è comunicato sia al DL che al lavoratore.',en:'Art. 41 c.6: MC can issue 4 judgments: fit for duty, fit with restrictions/limitations (temp or perm), temporarily unfit, permanently unfit. Judgment communicated to both employer and worker.'}}
 ]},

{id:'B1',cat:'B',order:8,icon:'🏭',hrs:2,
 title:{it:'Luoghi di Lavoro — Logistica',en:'Workplaces — Logistics'},
 sub:{it:'Art. 62-68 · Allegato IV · Magazzini e aree operative',en:'Art. 62-68 · Annex IV · Warehouses and operational areas'},
 arts:['Art. 62','Art. 63','Art. 64','Art. 65','Art. 67'],
 sum:{it:`Il Titolo II (Art. 62-68) stabilisce i requisiti minimi per i luoghi di lavoro.

Requisiti principali (Allegato IV):
• Altezza minima: 3 m (2,70 m per uffici; 2,50 m con deroga prefettizia)
• Cubatura minima: 10 m³ per lavoratore
• Superficie minima: 2 m² per lavoratore
• Illuminazione: naturale preferibile; artificiale integrativa se necessario
• Temperatura: adeguata alla stagione e al tipo di lavoro; protezione da eccessi

Vie di circolazione (Allegato IV):
• Larghezza minima per pedoni: 80 cm
• Corridoi con traffico misto pedoni+veicoli: larghezza adeguata ai mezzi + margine sicurezza
• Separazione obbligatoria tra percorsi pedonali e corsie veicoli

Specifico per magazzini (contesto logistico):
• Segnalazione a terra delle corsie pedonali (colore giallo)
• Protezioni agli angoli e strutture scaffali (bugnature, protezioni laterali)
• Sistemi di ancoraggio e fissaggio delle scaffalature al suolo
• Vie di uscita sgombere, segnalate, sempre accessibili dall'interno`,
   en:`Title II (Art. 62-68) sets minimum requirements for workplaces.

Main requirements (Annex IV):
• Minimum height: 3m (2.70m for offices; 2.50m with prefecture exemption)
• Minimum volume: 10 m³ per worker
• Minimum surface area: 2 m² per worker
• Lighting: natural preferred; supplementary artificial if needed
• Temperature: appropriate for season and work type; protection from extremes

Circulation routes (Annex IV):
• Minimum width for pedestrians: 80cm
• Mixed pedestrian+vehicle corridors: width adequate for vehicles + safety margin
• Mandatory separation between pedestrian routes and vehicle lanes

Specific to warehouses (logistics context):
• Ground marking of pedestrian lanes (yellow color)
• Corner and shelf structure protection (rubber guards, lateral guards)
• Shelf anchoring and fixing systems to floor
• Emergency exits clear, signposted, always accessible from inside`},
 kp:{it:['Altezza minima luoghi di lavoro: 3 m (2,70 m uffici; 2,50 m con deroga)','Cubatura minima: 10 m³/lavoratore; superficie: 2 m²/lavoratore','Corsie pedonali in magazzino: obbligatorie, segnalate a terra in giallo','Le vie di emergenza devono essere sempre sgombere e apribili dall\'interno senza chiave','Art. 63: il DL deve assicurare conformità ai requisiti dell\'Allegato IV'],
    en:['Minimum workplace height: 3m (2.70m offices; 2.50m with prefecture exemption)','Minimum volume: 10 m³/worker; surface area: 2 m²/worker','Warehouse pedestrian lanes: mandatory, ground-marked in yellow','Emergency exits must always be clear and openable from inside without key','Art. 63: employer must ensure compliance with Annex IV requirements']},
 quiz:[
  {q:{it:"L'altezza minima di un luogo di lavoro (Allegato IV) è:",en:'Minimum workplace height (Annex IV) is:'},opts:{it:['2 m','2,50 m','3 m','4 m'],en:['2m','2.50m','3m','4m']},ans:2,exp:{it:"Allegato IV: altezza minima 3 m per i luoghi di lavoro. Per gli uffici è ammessa una riduzione a 2,70 m. Con autorizzazione prefettizia si può scendere a 2,50 m.",en:'Annex IV: minimum height 3m for workplaces. For offices, 2.70m is permitted. With prefecture authorization, 2.50m is allowed.'}},
  {q:{it:'La cubatura minima per ogni lavoratore negli ambienti di lavoro è:',en:'Minimum volume per worker in work environments is:'},opts:{it:['5 m³','8 m³','10 m³','15 m³'],en:['5 m³','8 m³','10 m³','15 m³']},ans:2,exp:{it:'Allegato IV: cubatura minima 10 m³ per lavoratore negli ambienti chiusi. La superficie minima è di 2 m² per lavoratore.',en:'Annex IV: minimum 10 m³ volume per worker in enclosed environments. Minimum surface area is 2 m² per worker.'}},
  {q:{it:'Nei magazzini con traffico misto, le corsie pedonali devono essere:',en:'In warehouses with mixed traffic, pedestrian lanes must be:'},opts:{it:['Solo segnalate con cartelli verticali','Chiaramente delimitate e segnalate a terra, separate dalle corsie dei mezzi','Separate da barriere fisiche alte almeno 2 m','Non necessarie se i carrelli sono sotto i 5 km/h'],en:['Only marked with vertical signs','Clearly delimited and ground-marked, separated from vehicle lanes','Separated by physical barriers at least 2m high','Not necessary if forklifts are below 5 km/h']},ans:1,exp:{it:'Allegato IV e norme tecniche: nei luoghi con traffico misto pedoni/veicoli, le corsie pedonali devono essere chiaramente delimitate (tipicamente linee gialle sul pavimento), illuminate e separate dai percorsi dei veicoli.',en:'Annex IV and technical standards: in places with mixed pedestrian/vehicle traffic, pedestrian lanes must be clearly delimited (typically yellow floor lines), lit and separated from vehicle paths.'}},
  {q:{it:'Le vie di uscita e di emergenza devono essere:',en:'Emergency exits must be:'},opts:{it:['Sempre chiuse a chiave per la sicurezza','Apribili solo dal personale autorizzato','Sgombere, accessibili e segnalate in ogni momento','Aperte solo durante l\'orario di lavoro'],en:['Always locked for security','Openable only by authorized personnel','Clear, accessible and signposted at all times','Open only during working hours']},ans:2,exp:{it:'Le vie di uscita devono essere sempre sgombere da ostacoli, apribili dall\'interno senza chiave, segnalate con segnaletica di salvataggio (sfondo verde) e illuminate, anche in caso di emergenza.',en:'Emergency exits must always be clear of obstacles, openable from inside without key, signposted with rescue signage (green background) and lit, including during emergencies.'}}
 ]},

{id:'B2',cat:'B',order:9,icon:'📦',hrs:3,
 title:{it:'Movimentazione Manuale dei Carichi',en:'Manual Handling of Loads'},
 sub:{it:'Art. 167-171 · Allegato XXXIII · Metodo NIOSH',en:'Art. 167-171 · Annex XXXIII · NIOSH method'},
 arts:['Art. 167','Art. 168','Art. 169','Art. 170','Art. 171'],
 sum:{it:`Definizione MMC (Art. 167): operazioni di trasporto o sostegno di un carico con le mani o con la forza del corpo: sollevamento, deposizione, spinta, traino, portamento, spostamento.

Rischio principale: sovraccarico biomeccanico del rachide → rachialgia, ernie discali, patologie muscolo-scheletriche. Tra i disturbi professionali più diffusi nel settore logistica.

Metodo NIOSH — Peso limite raccomandato in condizioni ideali (Allegato XXXIII):
• Uomini adulti: 25 kg
• Donne adulte: 20 kg
• Lavoratori <18 anni: 15 kg (indipendentemente dal sesso)

I coefficienti moltiplicativi NIOSH (altezza di presa, dislocazione verticale, asimmetria, frequenza, tipo di presa, distanza orizzontale) sono tutti ≤ 1: riducono il peso limite al diminuire delle condizioni ideali.

Obblighi del DL (Art. 168):
• Valutare i rischi tenendo conto di: caratteristiche del carico, sforzo fisico richiesto, caratteristiche dell'ambiente, esigenze dell'attività
• Adottare misure organizzative (rotazione, pause)
• Fornire ausili meccanici (transpallet, carrelli, ecc.)
• Garantire formazione e informazione`,
   en:`MMC definition (Art. 167): operations of transporting or supporting a load by hand or bodily force: lifting, lowering, pushing, pulling, carrying, moving.

Main risk: biomechanical spinal overload → lower back pain, disc herniation, musculoskeletal disorders. Among the most common occupational disorders in logistics.

NIOSH Method — Recommended weight limit in ideal conditions (Annex XXXIII):
• Adult males: 25 kg
• Adult females: 20 kg
• Workers <18 years: 15 kg (regardless of gender)

NIOSH multiplicative coefficients (grip height, vertical displacement, asymmetry, frequency, grip type, horizontal distance) are all ≤ 1: they reduce the weight limit as conditions deviate from ideal.

Employer obligations (Art. 168):
• Assess risks considering: load characteristics, physical effort required, environmental characteristics, activity requirements
• Adopt organizational measures (rotation, breaks)
• Provide mechanical aids (pallet trucks, trolleys, etc.)
• Ensure training and information`},
 kp:{it:['MMC include: sollevamento, deposizione, spinta, traino, portamento, spostamento (Art. 167)','Rischio principale MMC: sovraccarico biomeccanico del rachide (lombalgia, ernie)','NIOSH in condizioni ideali: uomini 25 kg, donne 20 kg, <18 anni 15 kg','I coefficienti NIOSH sono tutti ≤ 1 e riducono il peso limite nelle condizioni reali','Art. 168: il DL deve fornire ausili meccanici, adottare misure organizzative e garantire formazione'],
    en:['MMC includes: lifting, lowering, pushing, pulling, carrying, moving (Art. 167)','Main MMC risk: biomechanical spinal overload (back pain, disc herniation)','NIOSH in ideal conditions: males 25kg, females 20kg, <18 years 15kg','NIOSH coefficients are all ≤ 1 and reduce weight limit in real conditions','Art. 168: employer must provide mechanical aids, adopt organizational measures and ensure training']},
 quiz:[
  {q:{it:'Il peso limite NIOSH per un uomo adulto in condizioni ideali è:',en:'NIOSH weight limit for an adult male in ideal conditions is:'},opts:{it:['15 kg','20 kg','25 kg','30 kg'],en:['15 kg','20 kg','25 kg','30 kg']},ans:2,exp:{it:'Allegato XXXIII: peso di riferimento 25 kg per uomini adulti, 20 kg per donne adulte, in condizioni ideali. Questo valore si riduce applicando i coefficienti NIOSH in base alle condizioni reali.',en:'Annex XXXIII: reference weight 25kg for adult males, 20kg for adult females, in ideal conditions. This value decreases by applying NIOSH coefficients based on real conditions.'}},
  {q:{it:'Il rischio principale della MMC è:',en:'The main MMC risk is:'},opts:{it:['Caduta del carico sui piedi','Sovraccarico biomeccanico del rachide (rachialgia e patologie muscoloscheletriche)','Rischio cardiovascolare da sforzo','Infezioni da contatto con superfici'],en:['Load falling on feet','Biomechanical spinal overload (back pain and musculoskeletal disorders)','Cardiovascular risk from exertion','Infections from surface contact']},ans:1,exp:{it:'Il rischio principale della MMC è il sovraccarico biomeccanico del rachide, che può causare lombalgia, ernie discali e altre patologie muscoloscheletriche. È tra i disturbi professionali più diffusi nel settore logistico.',en:'The main MMC risk is biomechanical spinal overload, causing lower back pain, disc herniation and other musculoskeletal disorders. Among the most common occupational disorders in logistics.'}},
  {q:{it:'I coefficienti moltiplicativi del metodo NIOSH sono:',en:'NIOSH multiplicative coefficients are:'},opts:{it:['Sempre >1 e aumentano il peso limite','Sempre ≤1 e riducono il peso limite in base alle condizioni reali','Fissi e uguali per tutti i lavoratori','Si applicano solo per carichi >30 kg'],en:['Always >1 and increase weight limit','Always ≤1 and reduce weight limit based on real conditions','Fixed and equal for all workers','Applied only for loads >30 kg']},ans:1,exp:{it:'I coefficienti NIOSH (altezza presa, dislocazione, asimmetria, frequenza, presa, distanza) sono tutti ≤1. Il valore 1 corrisponde alla condizione ideale; condizioni peggiori danno coefficienti <1, riducendo il peso limite.',en:'NIOSH coefficients (grip height, displacement, asymmetry, frequency, grip, distance) are all ≤1. Value 1 = ideal condition; worse conditions give coefficients <1, reducing weight limit.'}},

 title:{it:'Rischi Fisici: Rumore e Vibrazioni',en:'Physical Risks: Noise & Vibrations'},
 sub:{it:'Art. 188-201 (Titolo VIII) · Valori limite e d\'azione',en:'Art. 188-201 (Title VIII) · Limit and action values'},
 arts:['Art. 188','Art. 189','Art. 192','Art. 193','Art. 196'],
 sum:{it:`RUMORE (Art. 188-200) — misurato in dB(A) come LEX,8h (esposizione quotidiana personale):

Tre soglie fondamentali:
• Valore inferiore di azione: LEX = 80 dB(A) → informazione e formazione; DPI (otoprotettori) disponibili su richiesta ma NON obbligatori
• Valore superiore di azione: LEX = 85 dB(A) → sorveglianza sanitaria obbligatoria; uso DPI obbligatorio; segnalazione e delimitazione zone rumorose; misure tecniche/organizzative
• Valore limite di esposizione: LEX = 87 dB(A) → non superabile mai, anche tenuto conto dell'attenuazione dei DPI

La valutazione del rischio rumore va aggiornata ogni 4 anni (ogni 2 anni se cambiano le condizioni).

VIBRAZIONI (Art. 201-210):
HAV — mano-braccio (utensili vibranti, ecc.):
• Valore d'azione: 2,5 m/s² | Valore limite: 5,0 m/s²

WBV — corpo intero (conducenti carrelli elevatori, veicoli industriali):
• Valore d'azione: 0,5 m/s² | Valore limite: 1,15 m/s²

Rilevanza in logistica: rumore da carrelli elevatori e nastri trasportatori; WBV per carrellisti su pavimentazioni irregolari.`,
   en:`NOISE (Art. 188-200) — measured in dB(A) as LEX,8h (personal daily exposure):

Three key thresholds:
• Lower action value: LEX = 80 dB(A) → information and training; PPE (hearing protectors) available on request but NOT mandatory
• Upper action value: LEX = 85 dB(A) → mandatory health surveillance; mandatory PPE use; noisy zone marking
